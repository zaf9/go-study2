  - id: lexical-identifiers-040
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          type int = string
          var x int = "hello"
          fmt.Printf("%T: %v", x, x)
      }
    options:
      - "A: int: hello"
      - "B: string: hello"
      - "C: 编译错误"
      - "D: main.int: hello"
    answer: B
    explanation: "int是预声明类型但可以被遮蔽。这里int被定义为string的别名,x的底层类型是string。%T显示底层类型string。参见 Go 规范 Type definitions 章节。"
    topic: lexical_elements
    chapter: identifiers
