      - "B: Go提供complex128类型"
      - "C: complex64由两个float32组成"
      - "D: complex128由两个float64组成"
    answer: ABCD
    explanation: "Go提供complex64(由两个float32组成)和complex128(由两个float64组成)两种复数类型。参见 Go 规范 Numeric types 章节。"
