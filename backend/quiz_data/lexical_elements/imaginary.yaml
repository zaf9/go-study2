  # ========== 困难题 (Hard) - 3道 ==========

  - id: lexical-imaginary-033
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import (
          "fmt"
          "math/cmplx"
      )
      func main() {
          c := cmplx.Exp(1i * cmplx.Pi)
          fmt.Printf("%.0f\n", real(c))
      }
    options:
      - "A: 1"
      - "B: -1"
      - "C: 0"
      - "D: 3"
    answer: B
    explanation: "欧拉公式:e^(iπ) = -1。cmplx.Exp(1i * cmplx.Pi)计算e^(iπ) ≈ -1+0i,实部是-1。参见欧拉公式。"
    topic: lexical_elements
    chapter: imaginary

  - id: lexical-imaginary-034
    type: multiple
    difficulty: hard
    stem: "关于Go复数类型的内存布局,以下说法正确的是?(多选)"
    options:
      - "A: complex64占8字节"
      - "B: complex128占16字节"
      - "C: 实部在前虚部在后"
      - "D: 与C语言的_Complex兼容"
    answer: ABC
    explanation: "complex64=2×float32=8字节,complex128=2×float64=16字节。内存中实部在前虚部在后。Go的复数与C的_Complex类型兼容。参见 Go 规范和cgo文档。"
    topic: lexical_elements
    chapter: imaginary

