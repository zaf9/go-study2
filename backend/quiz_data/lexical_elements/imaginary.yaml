  # ========== 简单题 (Easy) - 21道 ==========
  
  - id: lexical-imaginary-001
    type: multiple
    difficulty: easy
    stem: "关于Go的虚数字面量,以下哪些说法是正确的?(多选)"
    options:
      - "A: 使用i后缀表示虚数"
      - "B: 3.14i是虚数字面量"
      - "C: 虚数是复数的一部分"
      - "D: 虚数字面量类型是complex128"
    answer: ABC
    explanation: "Go使用小写i作为虚数后缀,如3.14i表示虚数。这与数学中的虚数单位i一致。参见 Go 规范 Imaginary literals 章节。"
    topic: lexical_elements
    chapter: imaginary

