    explanation: "代码没有错误。real(complex64)返回float32,1.0是无类型常量可以自动转换为float32。参见 Go 规范 Constants 章节。"
    topic: lexical_elements
    chapter: imaginary

  - id: lexical-imaginary-026
    type: multiple
    difficulty: medium
    stem: "关于real()和imag()函数,以下说法正确的是?(多选)"
    options:
      - "A: 是内建函数"
      - "B: complex64参数返回float32"
      - "C: complex128参数返回float64"
      - "D: 可以用于任何数值类型"
    answer: ABC
    explanation: "real和imag是内建函数,返回类型与复数类型对应:complex64→float32,complex128→float64。只能用于复数类型。参见 Go 规范 Complex numbers 章节。"
    topic: lexical_elements
    chapter: imaginary

  - id: lexical-imaginary-027
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          c := 1i * 1i
          fmt.Println(c)
      }
    options:
      - "A: 1"
      - "B: -1"
      - "C: (-1+0i)"
      - "D: (0-1i)"
    answer: C
    explanation: "1i是虚数单位,1i*1i = i² = -1。Go输出为复数格式(-1+0i)。参见复数运算规则。"
    topic: lexical_elements
    chapter: imaginary

  - id: lexical-imaginary-028
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import (
          "fmt"
          "math/cmplx"
      )
      func main() {
          c := 3 + 4i
          fmt.Println(cmplx.Abs(c))
      }
    options:
      - "A: 7"
      - "B: 5"
      - "C: 25"
      - "D: 12"
    answer: B
    explanation: "cmplx.Abs返回复数的模(绝对值)。|3+4i| = √(3²+4²) = √25 = 5。参见 Go math/cmplx包文档。"
    topic: lexical_elements
    chapter: imaginary

  - id: lexical-imaginary-029
    type: code_fix
    difficulty: medium
    stem: "以下代码无法编译,正确的修正方案是?"
    code: |
      package main
      import "fmt"
      func main() {
          c := 3 + 4i
          if c > 1+0i {
              fmt.Println("greater")
          }
      }
    options:
      - "A: 使用cmplx.Abs(c) > 1比较"
      - "B: 使用real(c) > 1比较"
