  # ========== 中等题 (Medium) - 11道 ==========

  - id: lexical-imaginary-022
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          c := 3 + 4i
          fmt.Printf("%T\n", c)
      }
    options:
      - "A: complex"
      - "B: complex64"
      - "C: complex128"
      - "D: float64"
    answer: C
    explanation: "无类型复数常量默认为complex128类型。3+4i是complex128,不是complex64。参见 Go 规范 Constants 章节。"
    topic: lexical_elements
    chapter: imaginary

  - id: lexical-imaginary-023
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          c := 3 + 4i
          fmt.Println(real(c)*real(c) + imag(c)*imag(c))
      }
    options:
      - "A: 7"
      - "B: 25"
      - "C: 5"
      - "D: 12"
    answer: B
    explanation: "real(c)=3, imag(c)=4。3*3+4*4=9+16=25。这是复数模的平方(|c|²)。参见 Go 规范 Complex numbers 章节。"
    topic: lexical_elements
    chapter: imaginary

  - id: lexical-imaginary-024
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          a := 2 + 3i
          b := 1 + 2i
          fmt.Println(a * b)
      }
    options:
      - "A: (2+6i)"
      - "B: (-4+7i)"
      - "C: (3+5i)"
      - "D: (8+1i)"
    answer: B
    explanation: "(2+3i)*(1+2i) = 2*1 + 2*2i + 3i*1 + 3i*2i = 2 + 4i + 3i + 6i² = 2 + 7i - 6 = -4 + 7i。参见复数乘法公式。"
    topic: lexical_elements
    chapter: imaginary

  - id: lexical-imaginary-025
    type: code_fix
    difficulty: medium
    stem: "以下代码有类型错误,正确的修正方案是?"
