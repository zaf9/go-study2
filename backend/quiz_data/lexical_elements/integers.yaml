      - "B: 0"
      - "C: 18446744073709551615"
      - "D: 4294967295"
    answer: C
    explanation: "在64位系统上uint是64位无符号整数。0-1溢出变为最大值2^64-1=18446744073709551615。32位系统上是2^32-1。参见 Go 规范 Integer overflow 章节。"
