questions:
  # ========== 简单题 (Easy) - 24道 ==========
  
  - id: lexical-integers-001
    type: single
    difficulty: easy
    stem: "Go语言中,十进制整数字面量的前缀是?"
    options:
      - "A: 0d"
      - "B: 0x"
      - "C: 无前缀"
      - "D: 0"
    answer: C
    explanation: "Go的十进制整数字面量无需前缀,直接写数字如123。0d不是Go的前缀,0x是十六进制,0是八进制前缀。参见 Go 规范 Integer literals 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-002
    type: multiple
    difficulty: easy
    stem: "关于Go的十六进制整数字面量,以下哪些说法是正确的?(多选)"
    options:
      - "A: 使用0x或0X前缀"
      - "B: 0xFF表示255"
      - "C: 字母a-f不区分大小写"
      - "D: 是Go 1.13之前就支持的特性"
    answer: ABCD
    explanation: "Go使用0x或0X前缀表示十六进制整数,如0xFF、0X1A。#是某些语言(CSS)的十六进制写法,不是Go的。参见 Go 规范 Integer literals 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-003
    type: multiple
    difficulty: easy
    stem: "关于Go的二进制整数字面量,以下哪些说法是正确的?(多选)"
    options:
      - "A: 使用0b或0B前缀"
      - "B: Go 1.13+支持"
      - "C: 0b1010表示十进制10"
      - "D: 只能包含0和1"
    answer: ABCD
    explanation: "Go 1.13+支持0b或0B前缀表示二进制整数,如0b1010表示10。参见 Go 规范 Integer literals 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-004
    type: multiple
    difficulty: easy
    stem: "关于Go的八进制整数字面量,以下哪些说法是正确的?(多选)"
    options:
      - "A: 传统0前缀如0755"
      - "B: Go 1.13+新增0o前缀"
      - "C: 0o755等于十进制493"
      - "D: 0o前缀更明确推荐"
    answer: ABCD
    explanation: "Go支持传统的0前缀(如0755)和Go 1.13+新增的0o/0O前缀(如0o755)表示八进制。参见 Go 规范 Integer literals 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-005
    type: single
    difficulty: medium
    stem: "以下哪个是有效的Go十六进制整数字面量?"
    options:
      - "A: 0xGH"
      - "B: 0x1F"
      - "C: xAB"
      - "D: #FF"
    answer: B
    explanation: "0x1F是有效的十六进制字面量。十六进制只能使用0-9和a-f/A-F,G和H无效。xAB缺少0前缀,#不是Go的前缀。参见 Go 规范 Integer literals 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-006
    type: single
    difficulty: medium
    stem: "Go语言中,整数字面量可以使用什么字符来提高可读性?"
    options:
      - "A: 逗号,"
      - "B: 下划线_"
      - "C: 空格"
      - "D: 单引号'"
    answer: B
    explanation: "Go 1.13+允许在数字字面量中使用下划线_作为分隔符提高可读性,如1_000_000。逗号和空格不能用于数字内部。参见 Go 规范 Integer literals 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-007
    type: multiple
    difficulty: easy
    stem: "以下哪些是有效的Go整数字面量?(多选)"
    options:
      - "A: 100"
      - "B: 0xFF"
      - "C: 0b1010"
      - "D: 0o777"
    answer: ABCD
    explanation: "100是十进制,0xFF是十六进制,0b1010是二进制,0o777是八进制,都是有效的Go整数字面量。参见 Go 规范 Integer literals 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-008
    type: single
    difficulty: medium
    stem: "0755在Go中表示什么进制的数?"
    options:
      - "A: 十进制"
      - "B: 八进制"
      - "C: 十六进制"
      - "D: 二进制"
    answer: B
    explanation: "以0开头(非0x/0b/0o)的数字字面量是八进制。0755八进制等于十进制的493。参见 Go 规范 Integer literals 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-009
    type: single
    difficulty: easy
    stem: "Go语言中,哪种整数类型是平台相关的?"
    options:
      - "A: int8"
      - "B: int32"
      - "C: int"
      - "D: int64"
    answer: C
    explanation: "int和uint的大小是平台相关的,在32位系统上是32位,64位系统上是64位。int8/int32/int64是固定大小。参见 Go 规范 Numeric types 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-010
    type: multiple
    difficulty: easy
    stem: "以下哪些是Go的有符号整数类型?(多选)"
    options:
      - "A: int"
      - "B: int8"
      - "C: uint"
      - "D: int64"
    answer: ABD
    explanation: "int、int8、int16、int32、int64是有符号整数类型。uint、uint8等是无符号整数类型。参见 Go 规范 Numeric types 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-011
    type: single
    difficulty: easy
    stem: "Go的int8类型的取值范围是?"
    options:
      - "A: 0 到 255"
      - "B: -128 到 127"
      - "C: -256 到 255"
      - "D: 0 到 127"
    answer: B
    explanation: "int8是8位有符号整数,范围是-128到127(-2^7到2^7-1)。0到255是uint8的范围。参见 Go 规范 Numeric types 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-012
    type: single
    difficulty: easy
    stem: "Go的uint8类型的别名是?"
    options:
      - "A: char"
      - "B: byte"
      - "C: uchar"
      - "D: short"
    answer: B
    explanation: "byte是uint8的别名,常用于处理字节数据。Go没有char类型,使用rune(int32别名)处理Unicode字符。参见 Go 规范 Numeric types 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-013
    type: single
    difficulty: easy
    stem: "以下哪个整数字面量使用了可读性分隔符?"
    options:
      - "A: 1,000,000"
      - "B: 1_000_000"
      - "C: 1'000'000"
      - "D: 1 000 000"
    answer: B
    explanation: "Go使用下划线_作为数字分隔符,如1_000_000等于1000000。逗号、单引号、空格都不是有效的分隔符。参见 Go 规范 Integer literals 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-014
    type: single
    difficulty: easy
    stem: "Go语言中表示指针大小的整数类型是?"
    options:
      - "A: int"
      - "B: intptr"
      - "C: uintptr"
      - "D: size_t"
    answer: C
    explanation: "uintptr是一个无符号整数类型,足够存储任何指针。Go没有intptr和size_t类型。int不保证与指针大小相同。参见 Go 规范 Numeric types 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-015
    type: multiple
    difficulty: easy
    stem: "以下哪些是有效的下划线分隔整数字面量?(多选)"
    options:
      - "A: 1_000"
      - "B: _1000"
      - "C: 0x_FF"
      - "D: 0xFF_FF"
    answer: AD
    explanation: "下划线不能出现在数字开头或前缀后面。1_000和0xFF_FF有效。_1000是标识符,0x_FF无效(下划线紧跟前缀)。参见 Go 规范 Integer literals 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-016
    type: single
    difficulty: easy
    stem: "以下哪个是Go的无符号整数类型?"
    options:
      - "A: int"
      - "B: int32"
      - "C: uint32"
      - "D: integer"
    answer: C
    explanation: "uint32是32位无符号整数类型,范围0到2^32-1。int和int32是有符号类型,integer不是Go类型。参见 Go 规范 Numeric types 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-017
    type: single
    difficulty: easy
    stem: "Go语言中,整数字面量的默认类型是?"
    options:
      - "A: int"
      - "B: int64"
      - "C: int32"
      - "D: 无类型整数常量"
    answer: D
    explanation: "Go的整数字面量是无类型常量(untyped constant),可以根据上下文自动转换为需要的类型。参见 Go 规范 Constants 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-018
    type: multiple
    difficulty: easy
    stem: "以下哪些十六进制字符可用于Go整数字面量?(多选)"
    options:
      - "A: a-f"
      - "B: A-F"
      - "C: 0-9"
      - "D: g-z"
    answer: ABC
    explanation: "十六进制使用0-9和a-f(或A-F)表示0-15。g-z不是有效的十六进制字符。参见 Go 规范 Integer literals 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-019
    type: single
    difficulty: easy
    stem: "以下哪个八进制字面量是有效的?"
    options:
      - "A: 0o789"
      - "B: 0o777"
      - "C: 0o888"
      - "D: 08"
    answer: B
    explanation: "八进制只能使用0-7的数字。0o777有效,0o789和0o888包含无效数字8/9,08也无效(8不是八进制数字)。参见 Go 规范 Integer literals 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-020
    type: single
    difficulty: medium
    stem: "Go的int64类型占用多少字节?"
    options:
      - "A: 4字节"
      - "B: 8字节"
      - "C: 16字节"
      - "D: 平台相关"
    answer: B
    explanation: "int64是64位整数,固定占用8字节(64/8=8)。int的大小是平台相关的,但int64固定为8字节。参见 Go 规范 Numeric types 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-021
    type: single
    difficulty: medium
    stem: "0b1100在Go中表示的十进制值是?"
    options:
      - "A: 1100"
      - "B: 12"
      - "C: 28"
      - "D: 3"
    answer: B
    explanation: "0b1100是二进制,等于1*8+1*4+0*2+0*1=12。参见 Go 规范 Integer literals 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-022
    type: multiple
    difficulty: easy
    stem: "关于Go整数类型的零值,以下说法正确的是?(多选)"
    options:
      - "A: int的零值是0"
      - "B: uint的零值是0"
      - "C: byte的零值是0"
      - "D: 整数类型没有零值"
    answer: ABC
    explanation: "所有整数类型的零值都是0,包括int、uint、byte(uint8别名)等。参见 Go 规范 The zero value 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-023
    type: single
    difficulty: easy
    stem: "以下哪个表示十六进制的255?"
    options:
      - "A: 0xFF"
      - "B: 0xFG"
      - "C: 0o377"
      - "D: 0b11111111"
    answer: A
    explanation: "0xFF = 15*16+15 = 255。0xFG无效(G不是十六进制),0o377=255是八进制,0b11111111=255是二进制。题目问的是十六进制表示。参见 Go 规范 Integer literals 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-024
    type: single
    difficulty: easy
    stem: "Go的rune类型是哪个类型的别名?"
    options:
      - "A: int8"
      - "B: int16"
      - "C: int32"
      - "D: int64"
    answer: C
    explanation: "rune是int32的别名,用于表示Unicode码点。一个Unicode字符可能需要1-4个字节,int32足够容纳所有Unicode码点。参见 Go 规范 Numeric types 章节。"
    topic: lexical_elements
    chapter: integers

  # ========== 中等题 (Medium) - 12道 ==========

  - id: lexical-integers-025
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          fmt.Println(0xFF)
      }
    options:
      - "A: 0xFF"
      - "B: 255"
      - "C: FF"
      - "D: 16"
    answer: B
    explanation: "0xFF是十六进制字面量,值为15*16+15=255。fmt.Println默认以十进制输出整数。参见 Go 规范 Integer literals 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-026
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          fmt.Println(0o77)
      }
    options:
      - "A: 77"
      - "B: 63"
      - "C: 119"
      - "D: 49"
    answer: B
    explanation: "0o77是八进制字面量,值为7*8+7=63。使用0o前缀明确表示八进制。参见 Go 规范 Integer literals 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-027
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          x := 1_000_000
          fmt.Println(x)
      }
    options:
      - "A: 1_000_000"
      - "B: 1000000"
      - "C: 编译错误"
      - "D: 1,000,000"
    answer: B
    explanation: "下划线分隔符仅用于源码可读性,不影响实际值。x的值是1000000,输出也是1000000。参见 Go 规范 Integer literals 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-028
    type: code_fix
    difficulty: medium
    stem: "以下代码有语法错误,正确的修正方案是?"
    code: |
      package main
      func main() {
          x := 0x_FF
          println(x)
      }
    options:
      - "A: 将0x_FF改为0xFF"
      - "B: 将0x_FF改为_0xFF"
      - "C: 将0x_FF改为0xF_F"
      - "D: A或C都可以"
    answer: D
    explanation: "下划线不能紧跟在进制前缀(0x/0b/0o)后面。0xFF或0xF_F都是有效的写法。参见 Go 规范 Integer literals 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-029
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var x int8 = 127
          x++
          fmt.Println(x)
      }
    options:
      - "A: 128"
      - "B: -128"
      - "C: 0"
      - "D: 编译错误"
    answer: B
    explanation: "int8范围是-128到127。127+1溢出,结果回绕到-128(补码表示)。Go不会报溢出错误。参见 Go 规范 Integer overflow 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-030
    type: multiple
    difficulty: medium
    stem: "关于Go的整数溢出,以下说法正确的是?(多选)"
    options:
      - "A: 有符号整数溢出会回绕"
      - "B: 无符号整数溢出会回绕"
      - "C: 编译时常量溢出会报错"
      - "D: 运行时溢出会panic"
    answer: ABC
    explanation: "有符号和无符号整数运行时溢出都会回绕(wrap around),不会panic。但编译时常量溢出会在编译阶段报错。参见 Go 规范 Integer overflow 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-031
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          fmt.Printf("%T\n", 42)
      }
    options:
      - "A: int"
      - "B: int32"
      - "C: int64"
      - "D: untyped int"
    answer: A
    explanation: "无类型整数常量在需要具体类型时,默认转换为int。%T显示值的类型,42作为参数传递时成为int类型。参见 Go 规范 Constants 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-032
    type: code_fix
    difficulty: medium
    stem: "以下代码有类型错误,最佳修正方案是?"
    code: |
      package main
      func main() {
          var x int32 = 100
          var y int64 = x
          println(y)
      }
    options:
      - "A: 将y的类型改为int32"
      - "B: 将x转换为int64"
      - "C: 删除var y行"
      - "D: 代码没有错误"
    answer: B
    explanation: "Go不允许隐式类型转换,int32不能直接赋值给int64。需要显式转换:var y int64 = int64(x)。参见 Go 规范 Conversions 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-033
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          x := 010
          fmt.Println(x)
      }
    options:
      - "A: 10"
      - "B: 8"
      - "C: 2"
      - "D: 编译错误"
    answer: B
    explanation: "以0开头的数字是八进制。010八进制等于1*8+0=8。这是一个常见的陷阱。参见 Go 规范 Integer literals 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-034
    type: multiple
    difficulty: medium
    stem: "关于Go的整数类型转换,以下说法正确的是?(多选)"
    options:
      - "A: 大范围转小范围可能截断"
      - "B: 小范围转大范围总是安全的"
      - "C: 有符号转无符号会改变负数的值"
      - "D: 转换不会改变底层位模式"
    answer: ACD
    explanation: "大转小会截断,有符号转无符号负数会变正数(位模式不变但解释改变)。但小转大也不总是安全:负的int8转uint64会得到很大的正数。参见 Go 规范 Conversions 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-035
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var x int8 = -1
          var y uint8 = uint8(x)
          fmt.Println(y)
      }
    options:
      - "A: -1"
      - "B: 255"
      - "C: 0"
      - "D: 编译错误"
    answer: B
    explanation: "-1的int8二进制表示是11111111(补码),转换为uint8后解释为255。位模式不变,但解释方式改变。参见 Go 规范 Conversions 章节。"
    topic: lexical_elements
    chapter: integers

  - id: lexical-integers-036
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          const x = 1 << 100
          fmt.Println(x >> 97)
      }
    options:
      - "A: 溢出错误"
      - "B: 8"
      - "C: 编译错误"
      - "D: 0"
    answer: B
    explanation: "无类型常量可以表示任意精度。1<<100是一个非常大的数,右移97位等于1<<3=8。只有赋值给具体类型变量时才检查溢出。参见 Go 规范 Constants 章节。"
    topic: lexical_elements
    chapter: integers

  # ========== 困难题 (Hard) - 4道 ==========

  - id: lexical-integers-037
    type: code_output
    difficulty: hard
