  - id: lexical-keywords-015
    type: single
    difficulty: easy
    stem: "以下哪个关键字用于定义通道类型?"
    options:
      - "A: channel"
      - "B: chan"
      - "C: pipe"
      - "D: queue"
    answer: B
    explanation: "Go使用chan关键字定义通道类型,如chan int或chan<- string。channel不是关键字,而chan是其缩写形式的关键字。参见 Go 规范 Channel types 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-016
    type: single
    difficulty: easy
    stem: "Go语言中,switch语句的默认分支使用哪个关键字?"
    options:
      - "A: else"
      - "B: default"
      - "C: otherwise"
      - "D: fallback"
    answer: B
    explanation: "Go的switch语句使用default关键字定义默认分支。else用于if语句,otherwise和fallback不是Go关键字。参见 Go 规范 Switch statements 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-017
    type: single
    difficulty: easy
    stem: "以下哪个关键字用于case之间的穿透?"
    options:
      - "A: through"
      - "B: fallthrough"
      - "C: continue"
      - "D: pass"
    answer: B
    explanation: "Go使用fallthrough关键字使switch的case穿透到下一个case。与C不同,Go的case默认不穿透。参见 Go 规范 Fallthrough statements 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-018
    type: single
    difficulty: easy
    stem: "Go语言中用于范围迭代的关键字是?"
    options:
      - "A: foreach"
      - "B: in"
      - "C: range"
      - "D: iterate"
    answer: C
    explanation: "Go使用range关键字配合for循环进行范围迭代,如for i, v := range slice。foreach和in不是Go关键字。参见 Go 规范 For statements with range clause 章节。"
    topic: lexical_elements
    chapter: keywords

