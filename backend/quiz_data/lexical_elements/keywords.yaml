  # ========== 简单题 (Easy) - 24道 ==========
  
  - id: lexical-keywords-001
    type: multiple
    difficulty: easy
    stem: "关于Go关键字,以下哪些说法是正确的?(多选)"
    options:
      - "A: Go有25个关键字"
      - "B: 关键字不能用作标识符"
      - "C: var是声明关键字"
      - "D: func是函数关键字"
    answer: ABCD
    explanation: "Go语言共有25个关键字,这些关键字是语言的保留字,不能用作标识符。参见 Go 规范 Keywords 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-002
    type: multiple
    difficulty: easy
    stem: "以下哪些不是Go语言的关键字?(多选)"
    options:
      - "A: class"
      - "B: extends"
      - "C: implements"
      - "D: public"
    answer: ABCD
    explanation: "Go语言没有class关键字,Go使用struct定义数据结构,使用interface定义接口。class是Java/C++等语言的关键字。参见 Go 规范 Keywords 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-003
    type: single
    difficulty: easy
    stem: "在Go语言中,用于定义函数的关键字是?"
    options:
      - "A: function"
      - "B: def"
      - "C: func"
      - "D: fn"
    answer: C
    explanation: "Go语言使用func关键字定义函数,这是Go的25个关键字之一。function是JavaScript的写法,def是Python的写法,fn是Rust的写法。参见 Go 规范 Function declarations 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-004
    type: single
    difficulty: easy
    stem: "Go语言中用于声明包的关键字是?"
    options:
      - "A: module"
      - "B: package"
      - "C: import"
      - "D: namespace"
    answer: B
    explanation: "Go使用package关键字声明包,每个Go源文件的第一行必须是package声明。import用于导入包,module是Go模块系统的概念。参见 Go 规范 Package clause 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-005
    type: single
    difficulty: easy
    stem: "以下哪个关键字用于定义常量?"
    options:
      - "A: var"
      - "B: let"
      - "C: const"
      - "D: define"
    answer: C
    explanation: "Go使用const关键字声明常量。var用于声明变量,let是JavaScript的写法,define不是Go关键字。参见 Go 规范 Constant declarations 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-006
    type: single
    difficulty: easy
    stem: "Go语言中用于导入其他包的关键字是?"
    options:
      - "A: include"
      - "B: require"
      - "C: import"
      - "D: using"
    answer: C
    explanation: "Go使用import关键字导入其他包。include是C/C++的写法,require是Node.js的写法,using是C#的写法。参见 Go 规范 Import declarations 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-007
    type: single
    difficulty: easy
    stem: "以下哪个关键字用于定义结构体?"
    options:
      - "A: class"
      - "B: struct"
      - "C: type"
      - "D: object"
    answer: B
    explanation: "Go使用struct关键字定义结构体类型。type关键字用于类型声明,通常与struct配合使用如type Person struct{}。参见 Go 规范 Struct types 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-008
    type: single
    difficulty: easy
    stem: "Go语言中用于延迟执行的关键字是?"
    options:
      - "A: delay"
      - "B: defer"
      - "C: wait"
      - "D: later"
    answer: B
    explanation: "Go使用defer关键字延迟函数调用到当前函数返回前执行,常用于资源清理。defer是Go的25个关键字之一。参见 Go 规范 Defer statements 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-009
    type: single
    difficulty: easy
    stem: "以下哪个关键字用于启动goroutine?"
    options:
      - "A: async"
      - "B: thread"
      - "C: go"
      - "D: spawn"
    answer: C
    explanation: "Go使用go关键字启动一个新的goroutine并发执行函数。这是Go语言并发编程的核心特性。参见 Go 规范 Go statements 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-010
    type: single
    difficulty: easy
    stem: "Go语言中用于从通道接收数据或等待多个通道的关键字是?"
    options:
      - "A: switch"
      - "B: select"
      - "C: await"
      - "D: receive"
    answer: B
    explanation: "Go使用select关键字等待多个通道操作,类似于switch但专用于通道。switch用于条件分支,await不是Go关键字。参见 Go 规范 Select statements 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-011
    type: multiple
    difficulty: easy
    stem: "以下哪些是Go语言的关键字?(多选)"
    options:
      - "A: if"
      - "B: else"
      - "C: elif"
      - "D: for"
    answer: ABD
    explanation: "Go语言中if、else、for都是关键字。Go没有elif关键字,而是使用else if组合。参见 Go 规范 Keywords 章节。"
    topic: lexical_elements
    chapter: keywords

