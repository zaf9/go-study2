    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-020
    type: multiple
    difficulty: easy
    stem: "以下哪些是Go的循环相关关键字?(多选)"
    options:
      - "A: for"
      - "B: while"
      - "C: range"
      - "D: do"
