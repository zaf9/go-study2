    type: multiple
    difficulty: easy
    stem: "以下哪些关键字用于类型定义?(多选)"
    options:
      - "A: type"
      - "B: struct"
      - "C: interface"
      - "D: class"
    answer: ABC
    explanation: "type用于类型声明,struct定义结构体,interface定义接口,这三个都是Go关键字。Go没有class关键字。参见 Go 规范 Type declarations 章节。"
    topic: lexical_elements
    chapter: keywords

