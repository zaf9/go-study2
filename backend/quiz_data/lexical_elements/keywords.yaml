    type: multiple
    difficulty: easy
    stem: "以下哪些是Go的流程控制关键字?(多选)"
    options:
      - "A: break"
      - "B: continue"
      - "C: return"
      - "D: exit"
    answer: ABC
    explanation: "break、continue、return都是Go的流程控制关键字。exit不是关键字,而是os包中的函数os.Exit()。参见 Go 规范 Statements 章节。"
    topic: lexical_elements
    chapter: keywords

