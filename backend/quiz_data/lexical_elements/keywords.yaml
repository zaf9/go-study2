    type: single
    difficulty: easy
    stem: "Go语言中用于定义映射类型的关键字是?"
    options:
      - "A: dict"
      - "B: hash"
      - "C: map"
      - "D: table"
    answer: C
    explanation: "Go使用map关键字定义映射(字典)类型,如map[string]int。dict是Python的写法,hash和table不是Go关键字。参见 Go 规范 Map types 章节。"
    topic: lexical_elements
