      - "C: interface"
      - "D: trait"
    answer: C
    explanation: "Go使用interface关键字定义接口类型。protocol是Swift的写法,abstract是Java的写法,trait是Rust的写法。参见 Go 规范 Interface types 章节。"
    topic: lexical_elements
    chapter: keywords

  # ========== 中等题 (Medium) - 12道 ==========
  
  - id: lexical-keywords-025
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          switch 2 {
          case 1:
              fmt.Print("one")
          case 2:
              fmt.Print("two")
              fallthrough
          case 3:
              fmt.Print("three")
          }
      }
    options:
      - "A: two"
      - "B: twothree"
      - "C: three"
      - "D: 编译错误"
    answer: B
    explanation: "fallthrough关键字使程序从当前case穿透到下一个case,不检查下一个case的条件。因此输出twothree。参见 Go 规范 Fallthrough statements 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-026
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          defer fmt.Print("world")
          fmt.Print("hello ")
      }
    options:
      - "A: hello world"
      - "B: world hello"
      - "C: hello "
      - "D: worldhello "
    answer: A
    explanation: "defer延迟函数在当前函数返回前执行,所以先输出hello ,然后函数返回前输出world。参见 Go 规范 Defer statements 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-027
    type: multiple
    difficulty: medium
    stem: "关于Go的关键字,以下说法正确的是?(多选)"
    options:
      - "A: 关键字不能用作变量名"
      - "B: 关键字不能用作函数名"
      - "C: 关键字区分大小写"
      - "D: 可以通过加下划线前缀使用关键字"
    answer: ABC
    explanation: "Go关键字不能用作任何标识符(变量名、函数名等),且区分大小写(func是关键字,Func不是)。加下划线如_func是新的合法标识符。参见 Go 规范 Keywords 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-028
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          for i := 0; i < 3; i++ {
              defer fmt.Print(i)
          }
      }
    options:
      - "A: 012"
      - "B: 210"
      - "C: 222"
      - "D: 000"
    answer: B
    explanation: "defer语句按LIFO(后进先出)顺序执行,且i的值在defer时被确定。所以输出顺序是2、1、0。参见 Go 规范 Defer statements 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-029
    type: multiple
    difficulty: medium
    stem: "以下哪些语句需要使用关键字?(多选)"
    options:
      - "A: 声明变量"
      - "B: 声明常量"
      - "C: 短变量声明"
      - "D: 定义类型"
    answer: ABD
    explanation: "声明变量用var,常量用const,定义类型用type。短变量声明使用:=操作符,不需要var关键字。参见 Go 规范 Declarations 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-030
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          i := 0
      loop:
          fmt.Print(i)
          i++
          if i < 3 {
              goto loop
          }
      }
    options:
      - "A: 012"
      - "B: 0123"
      - "C: 123"
      - "D: 无限循环"
    answer: A
    explanation: "goto跳转到loop标签,循环执行直到i>=3。输出0、1、2后条件不满足,程序结束。参见 Go 规范 Goto statements 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-031
    type: code_fix
    difficulty: medium
    stem: "以下代码有语法错误,正确的修正方案是?"
    code: |
      package main
      func main() {
          var if = 10
          println(if)
      }
    options:
      - "A: 将if改为If"
      - "B: 将var改为const"
      - "C: 将if改为其他非关键字名称"
      - "D: 删除var关键字"
    answer: C
    explanation: "if是Go的关键字,不能用作变量名。虽然Go区分大小写,If是合法标识符,但更好的做法是使用其他有意义的名称。参见 Go 规范 Keywords 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-032
    type: multiple
    difficulty: medium
    stem: "关于switch和select关键字,以下说法正确的是?(多选)"
    options:
      - "A: switch用于条件分支"
      - "B: select用于通道操作选择"
      - "C: 两者都支持default分支"
      - "D: 两者的case都需要break"
    answer: ABC
    explanation: "switch用于条件分支,select用于通道操作,两者都支持default。Go的switch和select的case默认不穿透,不需要break。参见 Go 规范相关章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-033
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          x := []int{1, 2, 3}
          for range x {
              fmt.Print("a")
          }
      }
    options:
      - "A: a"
      - "B: aaa"
      - "C: 123"
      - "D: 编译错误"
    answer: B
    explanation: "for range可以省略索引和值变量,仅用于计数循环。切片有3个元素,所以循环3次,输出aaa。参见 Go 规范 For statements with range clause 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-034
    type: code_fix
    difficulty: medium
    stem: "以下代码无法编译,正确的修正方案是?"
    code: |
      package main
      func main() {
          func := func() { println("hello") }
          func()
      }
    options:
      - "A: 将第一个func改为fn"
      - "B: 将变量名func改为f"
      - "C: 删除:="
      - "D: 添加var关键字"
    answer: B
    explanation: "func是关键字,不能用作变量名。应将变量名改为f或其他合法标识符。fn不是Go的关键字但也不是惯用名称。参见 Go 规范 Keywords 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-035
    type: multiple
    difficulty: medium
    stem: "以下哪些表达式合法?(多选)"
    options:
      - "A: var type = 1"
      - "B: var Type = 1"
      - "C: var _type = 1"
      - "D: var type_ = 1"
    answer: BC
    explanation: "type是关键字不能直接用作变量名。但Go区分大小写,Type是合法标识符;_type和type_也都是合法的标识符。参见 Go 规范 Keywords 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-036
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          ch := make(chan int, 1)
          ch <- 1
          select {
          case v := <-ch:
              fmt.Print(v)
          default:
              fmt.Print("default")
          }
      }
    options:
      - "A: 1"
      - "B: default"
      - "C: 1default"
      - "D: 死锁"
    answer: A
    explanation: "通道ch中有数据,select会选择可以执行的case。由于ch有数据,第一个case可以执行,输出1。default仅在所有case都不能执行时才执行。参见 Go 规范 Select statements 章节。"
    topic: lexical_elements
    chapter: keywords

  # ========== 困难题 (Hard) - 4道 ==========

  - id: lexical-keywords-037
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          defer func() { fmt.Print("1") }()
          defer func() { fmt.Print("2") }()
          panic("error")
          defer func() { fmt.Print("3") }()
      }
    options:
      - "A: 123panic"
      - "B: 321panic"
      - "C: 21panic"
      - "D: 21然后程序panic"
    answer: D
    explanation: "panic之前注册的defer会在panic传播前执行(LIFO顺序),所以先输出2再输出1。panic之后的代码不执行。最后程序因panic而终止。参见 Go 规范 Handling panics 章节。"
    topic: lexical_elements
    chapter: keywords

  - id: lexical-keywords-038
    type: code_fix
    difficulty: hard
    stem: "以下代码存在问题,最佳修正方案是?"
    code: |
      package main
      func main() {
          i := 0
          goto end
          i := 1  // 重新声明
      end:
          println(i)
      }
    options:
      - "A: 将第二个i := 1改为i = 1"
      - "B: 删除goto语句"
      - "C: 添加大括号创建新作用域"
      - "D: 代码没有问题"
    answer: A
    explanation: "goto不能跳过变量声明,但这里的问题是同一作用域内i被重复声明。将:=改为=是赋值而非声明,可以解决问题。参见 Go 规范 Goto statements 章节。"
