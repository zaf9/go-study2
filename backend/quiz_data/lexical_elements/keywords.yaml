    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          switch x := 1; {
          case x > 0:
              fmt.Print("positive")
              fallthrough
          case x == 0:
              fmt.Print("zero")
          case x < 0:
              fmt.Print("negative")
          }
      }
    options:
      - "A: positive"
      - "B: positivezero"
      - "C: zero"
      - "D: 编译错误"
    answer: B
    explanation: "switch可以包含初始化语句。x=1>0为true,输出positive后fallthrough到下一个case(不检查条件),输出zero。参见 Go 规范 Switch statements 和 Fallthrough statements 章节。"
