  # ========== 简单题 (Easy) - 24道 ==========
  
  - id: lexical-floats-001
    type: single
    difficulty: easy
    stem: "Go语言中,哪些是浮点数类型?"
    options:
      - "A: float, double"
      - "B: float32, float64"
      - "C: single, double"
      - "D: real32, real64"
    answer: B
    explanation: "Go提供float32和float64两种浮点数类型。Go没有float、double、single、real等类型名称。参见 Go 规范 Numeric types 章节。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-002
    type: single
    difficulty: easy
    stem: "Go的float64类型对应的IEEE标准是?"
    options:
      - "A: IEEE 754单精度"
      - "B: IEEE 754双精度"
      - "C: IEEE 754扩展精度"
      - "D: Go专有格式"
    answer: B
    explanation: "float64对应IEEE 754双精度浮点数(64位),float32对应单精度(32位)。这是国际标准。参见 Go 规范 Numeric types 章节。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-003
    type: single
    difficulty: easy
    stem: "以下哪个是有效的Go浮点数字面量?"
    options:
      - "A: 3.14"
      - "B: .14"
      - "C: 3."
      - "D: 以上都是"
    answer: D
    explanation: "Go支持3.14、.14(省略整数部分)、3.(省略小数部分)等浮点数字面量格式。参见 Go 规范 Floating-point literals 章节。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-004
    type: single
    difficulty: easy
    stem: "Go浮点数字面量的科学计数法使用什么符号?"
    options:
      - "A: e或E"
      - "B: ^"
      - "C: **"
      - "D: x"
    answer: A
    explanation: "Go使用e或E表示科学计数法,如1.5e10或1.5E-3。这是标准的科学计数法表示。参见 Go 规范 Floating-point literals 章节。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-005
    type: single
    difficulty: easy
    stem: "浮点数字面量1e3表示的值是?"
    options:
      - "A: 1000"
      - "B: 3"
      - "C: 1"
      - "D: 1.3"
    answer: A
    explanation: "1e3表示1×10^3=1000。e表示10的幂次。参见 Go 规范 Floating-point literals 章节。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-006
    type: single
    difficulty: easy
    stem: "Go浮点数字面量的默认类型是?"
    options:
      - "A: float32"
      - "B: float64"
      - "C: float"
      - "D: 无类型浮点常量"
    answer: D
    explanation: "浮点数字面量是无类型浮点常量,需要具体类型时默认转换为float64。参见 Go 规范 Constants 章节。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-007
    type: multiple
    difficulty: easy
    stem: "以下哪些是有效的Go浮点数字面量?(多选)"
    options:
      - "A: 0.5"
      - "B: 2.5e10"
      - "C: .5"
      - "D: 5."
    answer: ABCD
    explanation: "Go支持多种浮点数字面量格式:完整小数、科学计数法、省略整数部分、省略小数部分都是有效的。参见 Go 规范 Floating-point literals 章节。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-008
    type: single
    difficulty: easy
    stem: "float32类型大约有多少位有效数字?"
    options:
      - "A: 6-7位"
      - "B: 15-16位"
      - "C: 32位"
      - "D: 4位"
    answer: A
    explanation: "float32(单精度)有约6-7位十进制有效数字。float64(双精度)有约15-16位。参见 Go 规范和IEEE 754标准。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-009
    type: single
    difficulty: easy
    stem: "Go 1.13+支持的十六进制浮点数字面量前缀是?"
    options:
      - "A: 0x"
      - "B: 0h"
      - "C: 0f"
      - "D: Go不支持十六进制浮点数"
    answer: A
    explanation: "Go 1.13+支持十六进制浮点数,使用0x前缀,如0x1.fp4表示31.0。必须有p/P指数部分。参见 Go 规范 Floating-point literals 章节。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-010
    type: single
    difficulty: easy
    stem: "十六进制浮点数0x1p2表示的值是?"
    options:
      - "A: 2"
      - "B: 4"
      - "C: 12"
      - "D: 0.5"
    answer: B
    explanation: "0x1p2表示1×2^2=4。十六进制浮点数的p/P指数是2的幂次,不是10的幂次。参见 Go 规范 Floating-point literals 章节。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-011
    type: single
    difficulty: easy
    stem: "Go浮点数类型的零值是?"
    options:
      - "A: nil"
      - "B: null"
      - "C: 0.0"
      - "D: NaN"
    answer: C
    explanation: "所有数值类型的零值都是0。浮点数的零值是0.0(正零)。nil用于指针/切片等,NaN是特殊值。参见 Go 规范 The zero value 章节。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-012
    type: multiple
    difficulty: easy
    stem: "关于float64类型,以下说法正确的是?(多选)"
    options:
      - "A: 占用8字节"
      - "B: 是Go浮点数的默认类型"
      - "C: 精度约15-16位十进制"
      - "D: 可以精确表示所有整数"
    answer: ABC
    explanation: "float64占8字节,是默认浮点类型,有15-16位精度。但不能精确表示所有整数(如2^53+1)。参见 Go 规范 Numeric types 章节。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-013
    type: single
    difficulty: easy
    stem: "以下哪个浮点数字面量使用了分隔符?"
    options:
      - "A: 1,000.0"
      - "B: 1_000.0"
      - "C: 1'000.0"
      - "D: 1 000.0"
    answer: B
    explanation: "Go使用下划线_作为数字分隔符。1_000.0等于1000.0。逗号、单引号、空格不是有效分隔符。参见 Go 规范 Floating-point literals 章节。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-014
    type: single
    difficulty: easy
    stem: "Go语言中如何表示正无穷大?"
    options:
      - "A: Infinity"
      - "B: math.Inf(1)"
      - "C: INF"
      - "D: float64.Max"
    answer: B
    explanation: "Go使用math包的Inf函数表示无穷大。math.Inf(1)是正无穷,math.Inf(-1)是负无穷。Go没有Infinity字面量。参见 Go math包文档。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-015
    type: single
    difficulty: easy
    stem: "Go语言中如何检测一个浮点数是否为NaN?"
    options:
      - "A: x == NaN"
      - "B: x == math.NaN()"
      - "C: math.IsNaN(x)"
      - "D: isnan(x)"
    answer: C
    explanation: "NaN不等于任何值包括自身,所以==比较无效。必须使用math.IsNaN()函数检测。参见 Go math包文档。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-016
    type: single
    difficulty: easy
    stem: "浮点数字面量2.5e-3表示的值是?"
    options:
      - "A: 2500"
      - "B: 0.0025"
      - "C: -7.5"
      - "D: 2.5"
    answer: B
    explanation: "2.5e-3表示2.5×10^(-3)=0.0025。负指数表示小数。参见 Go 规范 Floating-point literals 章节。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-017
    type: multiple
    difficulty: easy
    stem: "以下哪些是Go浮点数的特殊值?(多选)"
    options:
      - "A: 正无穷"
      - "B: 负无穷"
      - "C: NaN"
      - "D: null"
    answer: ABC
    explanation: "IEEE 754定义了正无穷、负无穷、NaN(非数字)作为特殊值。Go遵循此标准。null不是Go的浮点数概念。参见 IEEE 754标准。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-018
    type: single
    difficulty: easy
    stem: "以下哪个表达式的结果是NaN?"
    options:
      - "A: 1.0 / 0.0"
      - "B: 0.0 / 0.0"
      - "C: -1.0 / 0.0"
      - "D: 0.0 / 1.0"
    answer: B
    explanation: "0.0/0.0结果是NaN。1.0/0.0是正无穷,-1.0/0.0是负无穷,0.0/1.0是0.0。参见 IEEE 754标准。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-019
    type: single
    difficulty: easy
    stem: "float32类型占用多少字节?"
    options:
      - "A: 2字节"
      - "B: 4字节"
      - "C: 8字节"
      - "D: 平台相关"
    answer: B
    explanation: "float32是32位浮点数,固定占用4字节(32/8=4)。float64占用8字节。参见 Go 规范 Numeric types 章节。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-020
    type: single
    difficulty: easy
    stem: "以下哪个是有效的十六进制浮点数字面量?"
    options:
      - "A: 0xFF.FF"
      - "B: 0x1.8p1"
      - "C: 0x1.5"
      - "D: 1.5p2"
    answer: B
    explanation: "十六进制浮点数必须有0x前缀和p/P指数部分。0x1.8p1表示1.5×2^1=3.0。缺少p部分的是无效的。参见 Go 规范 Floating-point literals 章节。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-021
    type: single
    difficulty: easy
    stem: "浮点数字面量.5e2表示的值是?"
    options:
      - "A: 5"
      - "B: 50"
      - "C: 500"
      - "D: 0.05"
    answer: B
    explanation: ".5e2表示0.5×10^2=50。省略整数部分的小数0.5乘以100。参见 Go 规范 Floating-point literals 章节。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-022
    type: multiple
    difficulty: easy
    stem: "关于Go浮点数比较,以下说法正确的是?(多选)"
    options:
      - "A: NaN不等于任何值"
      - "B: NaN不等于自身"
      - "C: 正零等于负零"
      - "D: 可以直接用==比较浮点数"
    answer: ABC
    explanation: "NaN不等于任何值包括自身,正零等于负零(0.0==-0.0为true)。虽然可以用==但不推荐,因为精度问题。参见 IEEE 754标准。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-023
    type: single
    difficulty: easy
    stem: "Go语言中,math.Pi的类型是?"
    options:
      - "A: float32"
      - "B: float64"
      - "C: 无类型浮点常量"
      - "D: int"
    answer: B
    explanation: "math.Pi是float64类型的常量,值约为3.141592653589793。math包中的常量都是float64类型。参见 Go math包文档。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-024
    type: single
    difficulty: easy
    stem: "以下哪个转换可能导致精度损失?"
    options:
      - "A: float32转float64"
      - "B: float64转float32"
      - "C: int32转float64"
      - "D: int转float64"
    answer: B
    explanation: "float64转float32会损失精度(从15-16位减少到6-7位)。float32转float64不损失精度。int32的所有值都能精确转为float64。参见 Go 规范 Conversions 章节。"
    topic: lexical_elements
    chapter: floats

  # ========== 中等题 (Medium) - 12道 ==========

  - id: lexical-floats-025
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          x := 0.1 + 0.2
          fmt.Println(x == 0.3)
      }
    options:
      - "A: true"
      - "B: false"
      - "C: 编译错误"
      - "D: 运行时错误"
    answer: B
    explanation: "由于浮点数精度问题,0.1+0.2的结果不精确等于0.3。实际值约为0.30000000000000004。这是IEEE 754的特性。参见浮点数精度相关文档。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-026
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import (
          "fmt"
          "math"
      )
      func main() {
          x := math.NaN()
          fmt.Println(x == x)
      }
    options:
      - "A: true"
      - "B: false"
      - "C: NaN"
      - "D: 编译错误"
    answer: B
    explanation: "NaN不等于任何值,包括自身。NaN==NaN返回false。这是IEEE 754标准的规定。参见 IEEE 754标准。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-027
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          fmt.Println(1.0 / 0.0)
      }
    options:
      - "A: 0"
      - "B: +Inf"
      - "C: NaN"
      - "D: panic"
    answer: B
    explanation: "正数除以零得到正无穷(+Inf),不是panic。Go遵循IEEE 754标准处理浮点数除零。参见 IEEE 754标准。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-028
    type: code_fix
    difficulty: medium
    stem: "以下代码有语法错误,正确的修正方案是?"
    code: |
      package main
      import "fmt"
      func main() {
          x := 0x1.5
          fmt.Println(x)
      }
    options:
      - "A: 将0x1.5改为0x1.5p0"
      - "B: 将0x1.5改为1.5"
      - "C: 将0x1.5改为0x15"
      - "D: A或B都可以"
    answer: D
    explanation: "十六进制浮点数必须有p指数部分。0x1.5p0或普通十进制1.5都是有效的。0x15是整数不是浮点数。参见 Go 规范 Floating-point literals 章节。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-029
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var x float32 = 16777217
          fmt.Println(int(x))
      }
    options:
      - "A: 16777217"
      - "B: 16777216"
      - "C: 16777218"
      - "D: 0"
    answer: B
    explanation: "float32只有约7位有效数字,16777217(2^24+1)超出精度,被舍入为16777216(2^24)。参见 IEEE 754精度限制。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-030
    type: multiple
    difficulty: medium
    stem: "关于浮点数到整数的转换,以下说法正确的是?(多选)"
    options:
      - "A: 向零截断(不是四舍五入)"
      - "B: 3.9转换为int得到3"
      - "C: -3.9转换为int得到-3"
      - "D: NaN转换为int会panic"
    answer: ABC
    explanation: "Go浮点数转整数向零截断:3.9→3,-3.9→-3。NaN转换为整数结果是未定义的(implementation-defined),不一定panic。参见 Go 规范 Conversions 章节。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-031
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import (
          "fmt"
          "math"
      )
      func main() {
          x := math.Inf(1)
          y := math.Inf(1)
          fmt.Println(x == y)
      }
    options:
      - "A: true"
      - "B: false"
      - "C: +Inf"
      - "D: 编译错误"
    answer: A
    explanation: "与NaN不同,无穷大可以比较。正无穷等于正无穷,负无穷等于负无穷。参见 IEEE 754标准。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-032
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          fmt.Println(0x1.8p1)
      }
    options:
      - "A: 1.8"
      - "B: 3"
      - "C: 24"
      - "D: 12"
    answer: B
    explanation: "0x1.8p1 = (1 + 8/16) × 2^1 = 1.5 × 2 = 3。十六进制小数.8表示8/16=0.5。参见 Go 规范 Floating-point literals 章节。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-033
    type: code_fix
    difficulty: medium
    stem: "以下代码存在精度问题,最佳修正方案是?"
    code: |
      package main
      import "fmt"
      func main() {
          a := 0.1
          b := 0.2
          if a + b == 0.3 {
              fmt.Println("equal")
          }
      }
    options:
      - "A: 使用math.Abs(a+b-0.3) < 1e-9比较"
      - "B: 将变量改为float32"
      - "C: 使用整数运算代替"
      - "D: 代码没有问题"
    answer: A
    explanation: "浮点数比较应使用误差范围。常见做法是math.Abs(a-b) < epsilon。直接==比较可能因精度问题失败。参见浮点数比较最佳实践。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-034
    type: multiple
    difficulty: medium
    stem: "关于Go的科学计数法,以下说法正确的是?(多选)"
    options:
      - "A: 1e10表示10的10次方"
      - "B: e大小写不敏感"
      - "C: 指数可以是负数"
      - "D: 指数必须是整数"
    answer: BCD
    explanation: "1e10表示1×10^10不是10^10。e/E都可以,指数可正可负,必须是整数(如1e2.5无效)。参见 Go 规范 Floating-point literals 章节。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-035
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import (
          "fmt"
          "math"
      )
      func main() {
          x := math.Inf(1) - math.Inf(1)
          fmt.Println(math.IsNaN(x))
      }
    options:
      - "A: true"
      - "B: false"
      - "C: 0"
      - "D: +Inf"
    answer: A
    explanation: "无穷大减无穷大是未定义的,结果是NaN。同样,0×Inf、Inf/Inf也是NaN。参见 IEEE 754标准。"
    topic: lexical_elements
    chapter: floats

  - id: lexical-floats-036
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          x := 1e100
          y := 1e100
          fmt.Println(x - y)
      }
    options:
      - "A: 0"
      - "B: NaN"
      - "C: 精度损失的小数"
      - "D: 编译错误"
    answer: A
    explanation: "相同的浮点数相减得到精确的0。精度问题出现在不同值的计算中,相同值减法是精确的。参见 IEEE 754标准。"
    topic: lexical_elements
    chapter: floats

  # ========== 困难题 (Hard) - 4道 ==========

  - id: lexical-floats-037
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var x float64 = 1 << 53
          var y float64 = 1 << 53 + 1
          fmt.Println(x == y)
      }
    options:
      - "A: true"
