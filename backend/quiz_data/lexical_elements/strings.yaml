  - id: lexical-strings-038
    type: code_fix
    difficulty: hard
    stem: "以下代码在处理UTF-8字符串时可能出问题,最佳修正方案是?"
    code: |
      package main
      import "fmt"
      func main() {
          s := "Hello世界"
          for i := 0; i < len(s); i++ {
              fmt.Printf("%c", s[i])
          }
      }
    options:
      - "A: 使用for range遍历"
      - "B: 使用[]rune转换后遍历"
      - "C: 使用utf8.DecodeRuneInString"
      - "D: 以上都可以"
    answer: D
    explanation: "按字节遍历UTF-8字符串会破坏多字节字符。应使用for range(自动处理rune)、[]rune转换、或utf8包手动解码。参见 Go UTF-8处理最佳实践。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-039
    type: multiple
    difficulty: hard
    stem: "关于Go字符串的内部表示,以下说法正确的是?(多选)"
    options:
      - "A: 字符串头包含指针和长度"
      - "B: 字符串不以null结尾"
      - "C: 相同字面量可能共享存储"
      - "D: 字符串头占16字节(64位系统)"
    answer: ABCD
    explanation: "Go字符串由指针(8字节)+长度(8字节)=16字节头组成,不以null结尾。编译器可能让相同字面量共享底层存储。参见 Go runtime string实现。"
    topic: lexical_elements
