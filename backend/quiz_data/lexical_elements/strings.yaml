questions:
  # ========== 简单题 (Easy) - 24道 ==========
  
  - id: lexical-strings-001
    type: single
    difficulty: easy
    stem: "Go语言中,解释型字符串字面量使用什么符号括起来?"
    options:
      - "A: 单引号 ''"
      - "B: 双引号 \"\""
      - "C: 反引号 ``"
      - "D: 三引号 '''"
    answer: B
    explanation: "Go使用双引号\"\"括起解释型字符串(interpreted string),支持转义序列。单引号用于rune字面量。参见 Go 规范 String literals 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-002
    type: single
    difficulty: easy
    stem: "Go语言中,原始字符串字面量使用什么符号括起来?"
    options:
      - "A: 单引号 ''"
      - "B: 双引号 \"\""
      - "C: 反引号 ``"
      - "D: 三双引号 \"\"\""
    answer: C
    explanation: "Go使用反引号``括起原始字符串(raw string),不处理转义序列,可以包含换行。参见 Go 规范 String literals 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-003
    type: single
    difficulty: easy
    stem: "以下哪个转义序列表示换行符?"
    options:
      - "A: \\r"
      - "B: \\n"
      - "C: \\t"
      - "D: \\0"
    answer: B
    explanation: "\\n表示换行符(newline)。\\r是回车,\\t是制表符,\\0是空字符。参见 Go 规范 Rune literals 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-004
    type: single
    difficulty: easy
    stem: "以下哪个转义序列表示制表符?"
    options:
      - "A: \\s"
      - "B: \\t"
      - "C: \\tab"
      - "D: \\b"
    answer: B
    explanation: "\\t表示水平制表符(tab)。\\s和\\tab不是Go转义序列,\\b是退格符。参见 Go 规范 Rune literals 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-005
    type: single
    difficulty: easy
    stem: "Go字符串的底层是?"
    options:
      - "A: 字符数组"
      - "B: UTF-8编码的字节切片"
      - "C: Unicode码点数组"
      - "D: UTF-16编码"
    answer: B
    explanation: "Go字符串是只读的字节切片,通常包含UTF-8编码的文本。但可以包含任意字节。参见 Go 规范 String types 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-006
    type: single
    difficulty: easy
    stem: "获取Go字符串的字节长度使用什么函数?"
    options:
      - "A: size()"
      - "B: length()"
      - "C: len()"
      - "D: bytes()"
    answer: C
    explanation: "len()返回字符串的字节数。对于包含多字节字符的UTF-8字符串,字节数可能大于字符数。参见 Go 规范 Length and capacity 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-007
    type: multiple
    difficulty: easy
    stem: "以下哪些是有效的Go转义序列?(多选)"
    options:
      - "A: \\n"
      - "B: \\t"
      - "C: \\\\"
      - "D: \\s"
    answer: ABC
    explanation: "Go支持\\n(换行)、\\t(制表符)、\\\\(反斜杠)等转义序列。\\s不是Go的转义序列(那是正则表达式的空白匹配)。参见 Go 规范 Rune literals 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-008
    type: single
    difficulty: easy
    stem: "以下哪种方式可以在字符串中表示双引号?"
    options:
      - "A: \""
      - "B: \\\""
      - "C: '\"'"
      - "D: ``\"``"
    answer: B
    explanation: "在解释型字符串中,使用\\\"转义双引号。或者使用原始字符串(反引号)包含双引号。参见 Go 规范 String literals 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-009
    type: single
    difficulty: easy
    stem: "Go字符串是否可以修改?"
    options:
      - "A: 可以,字符串是可变的"
      - "B: 不可以,字符串是不可变的"
      - "C: 可以通过指针修改"
      - "D: 可以通过索引修改"
    answer: B
    explanation: "Go字符串是不可变的(immutable),不能修改单个字节。要修改需要转换为[]byte或[]rune再转回。参见 Go 规范 String types 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-010
    type: single
    difficulty: easy
    stem: "以下哪个表示Unicode码点\\u4E2D的字符?"
    options:
      - "A: 中"
      - "B: A"
      - "C: 0"
      - "D: 空格"
    answer: A
    explanation: "\\u4E2D是Unicode码点表示法,对应汉字\"中\"。4E2D是十六进制,等于十进制20013。参见 Go 规范 Rune literals 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-011
    type: multiple
    difficulty: easy
    stem: "关于原始字符串(反引号字符串),以下说法正确的是?(多选)"
    options:
      - "A: 不处理转义序列"
      - "B: 可以跨多行"
      - "C: 不能包含反引号字符"
      - "D: 会移除回车符\\r"
    answer: ABCD
    explanation: "原始字符串不处理转义,可跨行,不能包含反引号(因为没有转义),且会移除\\r以统一换行风格。参见 Go 规范 String literals 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-012
    type: single
    difficulty: easy
    stem: "Go字符串的零值是?"
    options:
      - "A: nil"
      - "B: null"
      - "C: 空字符串\"\""
      - "D: undefined"
    answer: C
    explanation: "Go字符串的零值是空字符串\"\",长度为0。nil用于指针/切片等引用类型。参见 Go 规范 The zero value 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-013
    type: single
    difficulty: easy
    stem: "以下哪个函数用于获取字符串的字符(rune)数?"
    options:
      - "A: len()"
      - "B: utf8.RuneCountInString()"
      - "C: strings.Count()"
      - "D: runes()"
    answer: B
    explanation: "len()返回字节数,utf8.RuneCountInString()返回UTF-8字符(rune)数。对于中文等多字节字符,两者结果不同。参见 Go unicode/utf8包文档。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-014
    type: single
    difficulty: easy
    stem: "Go字符串连接使用什么运算符?"
    options:
      - "A: &"
      - "B: +"
      - "C: ."
      - "D: concat()"
    answer: B
    explanation: "Go使用+运算符连接字符串,如\"Hello\" + \" \" + \"World\"。参见 Go 规范 String concatenation 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-015
    type: single
    difficulty: easy
    stem: "以下哪个转义序列表示反斜杠?"
    options:
      - "A: \\/"
      - "B: \\\\"
      - "C: \\b"
      - "D: \\"
    answer: B
    explanation: "\\\\表示一个反斜杠字符。单个\\后面需要跟有效的转义字符。参见 Go 规范 Rune literals 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-016
    type: multiple
    difficulty: easy
    stem: "以下哪些Unicode转义在Go中有效?(多选)"
    options:
      - "A: \\u0041 (4位十六进制)"
      - "B: \\U00000041 (8位十六进制)"
      - "C: \\x41 (2位十六进制字节)"
      - "D: \\041 (八进制字节)"
    answer: ABCD
    explanation: "Go支持\\uXXXX(4位Unicode)、\\UXXXXXXXX(8位Unicode)、\\xXX(十六进制字节)、\\NNN(八进制字节)等转义形式。参见 Go 规范 Rune literals 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-017
    type: single
    difficulty: easy
    stem: "字符串\"中\"的len()结果是?"
    options:
      - "A: 1"
      - "B: 2"
      - "C: 3"
      - "D: 4"
    answer: C
    explanation: "汉字\"中\"的UTF-8编码占3个字节,所以len()返回3。len()返回字节数,不是字符数。参见 Go 规范 String types 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-018
    type: single
    difficulty: easy
    stem: "以下哪个可以将字符串转换为字节切片?"
    options:
      - "A: string(bytes)"
      - "B: []byte(str)"
      - "C: bytes(str)"
      - "D: str.Bytes()"
    answer: B
    explanation: "Go使用[]byte(str)将字符串转换为字节切片。这是类型转换语法。bytes(str)不是有效语法。参见 Go 规范 Conversions 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-019
    type: single
    difficulty: easy
    stem: "Go字符串比较使用什么运算符?"
    options:
      - "A: equals()"
      - "B: =="
      - "C: strcmp()"
      - "D: compare()"
    answer: B
    explanation: "Go使用==比较字符串是否相等,<、>比较字典序。不需要调用函数。参见 Go 规范 Comparison operators 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-020
    type: multiple
    difficulty: easy
    stem: "以下哪些字符串字面量在Go中等价?(多选)"
    options:
      - "A: \"Hello\""
      - "B: `Hello`"
      - "C: \"Hel\" + \"lo\""
      - "D: `Hel` + `lo`"
    answer: ABCD
    explanation: "这四种写法最终得到相同的字符串\"Hello\"。解释型和原始字符串可以连接,编译时常量连接会被优化。参见 Go 规范 String literals 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-021
    type: single
    difficulty: easy
    stem: "以下哪个表示8位十六进制字节转义?"
    options:
      - "A: \\x41"
      - "B: \\u0041"
      - "C: \\101"
      - "D: \\X41"
    answer: A
    explanation: "\\xNN是十六进制字节转义(2位)。\\uNNNN是4位Unicode。\\101是八进制。\\X大写无效。参见 Go 规范 Rune literals 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-022
    type: single
    difficulty: easy
    stem: "以下哪个函数用于遍历字符串的每个字符(rune)?"
    options:
      - "A: for i := 0; i < len(s); i++"
      - "B: for i, r := range s"
      - "C: for s.next()"
      - "D: foreach r in s"
    answer: B
    explanation: "for range遍历字符串会按rune(Unicode字符)迭代,i是字节索引,r是rune值。普通for循环按字节遍历。参见 Go 规范 For statements with range clause 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-023
    type: single
    difficulty: easy
    stem: "Go字符串支持索引访问,s[0]返回什么类型?"
    options:
      - "A: string"
      - "B: rune"
      - "C: byte(uint8)"
      - "D: int"
    answer: C
    explanation: "字符串索引s[i]返回byte(即uint8)类型,是该位置的字节值,不是字符(rune)。参见 Go 规范 Index expressions 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-024
    type: single
    difficulty: easy
    stem: "以下哪个是有效的多行字符串?"
    options:
      - "A: \"line1\\nline2\""
      - "B: `line1\nline2`"
      - "C: \"line1\n  line2\""
      - "D: A和B都可以"
    answer: D
    explanation: "双引号字符串用\\n转义换行,反引号字符串直接包含换行。双引号内不能直接写换行符会编译错误。参见 Go 规范 String literals 章节。"
    topic: lexical_elements
    chapter: strings

  # ========== 中等题 (Medium) - 12道 ==========

  - id: lexical-strings-025
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          s := "Hello"
          fmt.Println(s[0])
      }
    options:
      - "A: H"
      - "B: 72"
      - "C: Hello"
      - "D: 编译错误"
    answer: B
    explanation: "s[0]返回byte类型,'H'的ASCII码是72。fmt.Println打印数字72而非字符H。要打印字符需用string(s[0])或%c格式。参见 Go 规范 Index expressions 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-026
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          s := "中国"
          fmt.Println(len(s))
      }
    options:
      - "A: 2"
      - "B: 4"
      - "C: 6"
      - "D: 8"
    answer: C
    explanation: "\"中国\"包含2个汉字,每个汉字UTF-8编码占3字节,所以len()返回6。len()返回字节数不是字符数。参见 Go 规范 String types 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-027
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          s := `Hello\nWorld`
          fmt.Println(s)
      }
    options:
      - "A: Hello\nWorld(两行)"
      - "B: Hello\\nWorld(一行)"
      - "C: Hello World"
      - "D: 编译错误"
    answer: B
    explanation: "原始字符串(反引号)不处理转义序列,\\n被保留为两个字符(反斜杠和n)而非换行。参见 Go 规范 String literals 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-028
    type: code_fix
    difficulty: medium
    stem: "以下代码有语法错误,正确的修正方案是?"
    code: |
      package main
      func main() {
          s := "Hello
          World"
          println(s)
      }
    options:
      - "A: 使用+连接两个字符串"
      - "B: 使用\\n转义换行"
      - "C: 使用反引号原始字符串"
      - "D: 以上都可以"
    answer: D
    explanation: "双引号字符串不能直接包含换行。可以用\\n转义、+连接、或改用反引号。三种方式都能解决问题。参见 Go 规范 String literals 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-029
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          s := "中国"
          for i, r := range s {
              fmt.Printf("%d:%c ", i, r)
          }
      }
    options:
      - "A: 0:中 1:国"
      - "B: 0:中 3:国"
      - "C: 0:中 2:国"
      - "D: 0:? 1:? 2:?"
    answer: B
    explanation: "for range按rune遍历,返回字节索引和rune值。\"中\"占3字节(索引0-2),\"国\"从索引3开始。参见 Go 规范 For statements with range clause 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-030
    type: multiple
    difficulty: medium
    stem: "关于Go字符串和[]byte的转换,以下说法正确的是?(多选)"
    options:
      - "A: 转换会创建新的内存副本"
      - "B: 转换是O(n)操作"
      - "C: 可以通过unsafe避免复制"
      - "D: 转换后修改不影响原字符串"
    answer: ABCD
    explanation: "字符串转[]byte会复制数据(因为字符串不可变),是O(n)操作。unsafe包可以避免复制但有风险。修改[]byte不影响原字符串。参见 Go 规范 Conversions 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-031
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          s := "Hello"
          b := []byte(s)
          b[0] = 'h'
          fmt.Println(s, string(b))
      }
    options:
      - "A: hello hello"
      - "B: Hello hello"
      - "C: Hello Hello"
      - "D: 编译错误"
    answer: B
    explanation: "[]byte(s)创建副本,修改b不影响原字符串s。所以s仍是\"Hello\",string(b)是\"hello\"。参见 Go 规范 Conversions 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-032
    type: code_fix
    difficulty: medium
    stem: "以下代码存在问题,最佳修正方案是?"
    code: |
      package main
      import "fmt"
      func main() {
          s := "Hello"
          s[0] = 'h'
          fmt.Println(s)
      }
    options:
      - "A: 使用[]byte转换后修改"
      - "B: 使用strings.Replace"
      - "C: 重新赋值整个字符串"
      - "D: 以上都可以"
    answer: D
    explanation: "字符串不可变,不能直接修改。可以转[]byte修改再转回,用strings.Replace,或构造新字符串。参见 Go 规范 String types 章节。"
    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-033
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          s := "\x48\x65\x6c\x6c\x6f"
