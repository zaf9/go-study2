  - id: lexical-strings-040
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          s := "a\xffc"
          for i, r := range s {
              fmt.Printf("%d:%q ", i, r)
          }
      }
    options:
      - "A: 0:'a' 1:'\\xff' 2:'c'"
      - "B: 0:'a' 1:'�' 2:'c'"
      - "C: 0:'a' 1:'�' 3:'c'"
      - "D: 编译错误"
    answer: B
    explanation: "\\xff(255)不是有效的UTF-8序列,for range将其解码为替换字符U+FFFD(显示为�)。每个无效字节消耗1字节,所以索引是0、1、2。参见 Go UTF-8错误处理。"
    topic: lexical_elements
    chapter: strings
