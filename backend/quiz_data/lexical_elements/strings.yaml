    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-034
    type: multiple
    difficulty: medium
    stem: "关于字符串和[]rune的转换,以下说法正确的是?(多选)"
    options:
      - "A: []rune(s)按Unicode字符分割"
      - "B: len([]rune(s))返回字符数"
      - "C: 转换会创建新的内存"
      - "D: rune是int32的别名"
