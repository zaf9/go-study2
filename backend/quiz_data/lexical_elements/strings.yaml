    topic: lexical_elements
    chapter: strings

  - id: lexical-strings-036
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          s := "Hello"[1:3]
          fmt.Println(s)
      }
    options:
      - "A: He"
      - "B: el"
      - "C: ell"
      - "D: ello"
    answer: B
    explanation: "字符串切片s[1:3]获取索引1到2的字节(不含3)。\"Hello\"[1:3]是\"el\"。参见 Go 规范 Slice expressions 章节。"
    topic: lexical_elements
    chapter: strings

