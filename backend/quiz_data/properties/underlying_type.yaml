      - "B: int"
      - "C: string"
      - "D: []int"
    answer: ABC
    explanation: "bool, int, string 都是基本类型。[]int 是复合类型。"
    topic: properties
    chapter: underlying_type

  # ============ 多选题 (Medium) ============
  - id: q-under-025
    type: multiple
    difficulty: medium
    stem: "关于底层类型，以下哪些说法是正确的？"
    options:
      - "A: 基本类型的底层类型是自身"
      - "B: 类型定义创建的新类型，其底层类型是原类型的底层类型"
      - "C: 类型别名的底层类型是别名指定的类型"
      - "D: 指针类型的底层类型会递归应用"
    answer: ABCD
    explanation: "所有选项都正确。底层类型的推导规则适用于所有情况。"
    topic: properties
    chapter: underlying_type

  - id: q-under-026
    type: multiple
    difficulty: medium
    stem: "以下哪些代码片段中，T 的底层类型是 int？"
    options:
      - "A: type T int"
      - "B: type T = int"
      - "C: type MyInt int; type T MyInt"
      - "D: type T int; type U T"
    answer: ABCD
    explanation: "所有情况最终都会推导到 int 作为底层类型。"
    topic: properties
    chapter: underlying_type

  - id: q-under-027
    type: multiple
    difficulty: medium
    stem: "关于类型别名，以下哪些说法是正确的？"
    options:
      - "A: 类型别名不创建新类型"
      - "B: 类型别名和原类型可以互相赋值"
      - "C: 类型别名的底层类型是原类型的底层类型"
      - "D: 类型别名和原类型完全相同"
    answer: ABCD
    explanation: "类型别名 type T = base 创建的 T 和 base 完全相同，可以互相赋值。"
    topic: properties
    chapter: underlying_type

  - id: q-under-028
    type: multiple
    difficulty: medium
    stem: "以下哪些类型的底层类型是 *int？"
    options:
      - "A: *int"
      - "B: type MyInt int; type MyIntPtr *MyInt"
      - "C: type IntPtr *int"
      - "D: type P **int"
    answer: ABC
    explanation: "*int, MyIntPtr (递归到 *int), IntPtr 的底层类型都是 *int。P 的底层类型是 **int。"
    topic: properties
    chapter: underlying_type

  # ============ 多选题 (Hard) ============
  - id: q-under-029
    type: multiple
    difficulty: hard
    stem: "关于底层类型推导的递归性，以下哪些说法是正确的？"
    options:
      - "A: 类型定义会递归查找底层类型"
      - "B: 指针类型会递归应用到底层类型"
      - "C: 数组类型会递归应用到元素类型"
      - "D: 函数类型不会递归到参数和返回值"
    answer: ABCD
    explanation: "底层类型推导在大多数情况下会递归，但函数类型的参数和返回值不会递归。"
    topic: properties
    chapter: underlying_type

  - id: q-under-030
    type: multiple
    difficulty: hard
    stem: "以下哪些情况会导致两个类型即使底层类型相同也不能直接赋值？"
    options:
      - "A: 两个都是通过 type 定义的新类型"
      - "B: 一个是类型定义，一个是类型别名"
      - "C: 两个都是类型别名"
      - "D: 一个是基本类型，一个是类型定义"
    answer: AB
    explanation: "两个都是 type 定义的新类型不能直接赋值。类型别名与原类型相同可以赋值。类型定义与基本类型（其中一个不是命名类型）可以赋值。"
    topic: properties
    chapter: underlying_type

  - id: q-under-031
    type: multiple
    difficulty: hard
    stem: "以下哪些关于类型参数底层类型的说法是正确的？"
    options:
      - "A: 类型参数的底层类型是其约束的底层类型"
      - "B: 约束是接口时，底层类型是接口的类型集的核心类型"
      - "C: 约束是具体类型时，底层类型是该类型"
      - "D: 类型参数本身没有底层类型"
    answer: ABC
    explanation: "类型参数的底层类型推导遵循特定规则，基于其类型约束。"
    topic: properties
    chapter: underlying_type

  - id: q-under-032
    type: multiple
    difficulty: hard
    stem: "以下哪些复合类型的底层类型是类型本身？"
    options:
      - "A: 结构体"
      - "B: 函数"
      - "C: 接口"
      - "D: map"
    answer: ABCD
    explanation: "结构体、函数、接口、map、channel 等类型的底层类型都是类型本身，不会递归。"
    topic: properties
    chapter: underlying_type

