  # ============ 单选题 (Medium) ============
  - id: q-under-009
    type: single
    difficulty: medium
    stem: "以下代码中 YourInt 的底层类型是什么？\n\ntype MyInt int\ntype YourInt MyInt"
    options:
      - "A: YourInt"
      - "B: MyInt"
      - "C: int"
      - "D: interface{}"
    answer: C
    explanation: "YourInt 的底层类型是 MyInt 的底层类型，即 int。类型定义会递归地查找底层类型。"
    topic: properties
    chapter: underlying_type

  - id: q-under-010
    type: single
    difficulty: medium
    stem: "以下代码中 MyIntPtr 的底层类型是什么？\n\ntype MyInt int\ntype MyIntPtr *MyInt"
    options:
      - "A: *MyInt"
      - "B: *int"
      - "C: MyInt"
      - "D: int"
    answer: B
    explanation: "MyIntPtr 的底层类型是 *int。指针类型的底层类型递归地应用到底层类型上。"
    topic: properties
    chapter: underlying_type

