  # ============ 单选题 (Hard) ============
  - id: q-under-017
    type: single
    difficulty: hard
    stem: "以下代码中 YourYourInt 的底层类型是什么？\n\ntype MyInt int\ntype YourInt MyInt\ntype YourYourInt YourInt"
    options:
      - "A: YourYourInt"
      - "B: YourInt"
      - "C: MyInt"
      - "D: int"
    answer: D
    explanation: "底层类型推导会一直递归直到基本类型。YourYourInt → YourInt → MyInt → int。"
    topic: properties
    chapter: underlying_type

  - id: q-under-018
    type: single
    difficulty: hard
    stem: "以下代码中 ComplexPtr 的底层类型是什么？\n\ntype MyInt int\ntype MyIntPtr *MyInt\ntype ComplexPtr *MyIntPtr"
    options:
      - "A: *MyIntPtr"
      - "B: **MyInt"
      - "C: **int"
      - "D: *int"
    answer: C
    explanation: "ComplexPtr → *MyIntPtr → **MyInt → **int。指针类型的底层类型递归应用。"
    topic: properties
    chapter: underlying_type

  - id: q-under-019
    type: single
    difficulty: hard
    stem: "类型参数的底层类型是什么？"
    options:
      - "A: 类型参数本身"
      - "B: 类型参数的约束类型"
      - "C: 约束类型的底层类型"
      - "D: interface{}"
    answer: C
    explanation: "类型参数的底层类型是其类型约束的底层类型。"
    topic: properties
    chapter: underlying_type

  - id: q-under-020
    type: single
    difficulty: hard
    stem: "以下代码中 MyFunc 的底层类型是什么？\n\ntype MyInt int\ntype MyFunc func(MyInt) string"
    options:
      - "A: func(MyInt) string"
      - "B: func(int) string"
      - "C: func(int) interface{}"
      - "D: interface{}"
    answer: A
    explanation: "函数类型的底层类型是函数类型本身，不递归到参数和返回值的底层类型。"
    topic: properties
    chapter: underlying_type

  # ============ 多选题 (Easy) ============
  - id: q-under-021
    type: multiple
    difficulty: easy
    stem: "以下哪些类型的底层类型是它们自身？"
    options:
      - "A: int"
      - "B: string"
      - "C: float64"
      - "D: []int"
    answer: ABC
    explanation: "基本类型（int, string, float64等）的底层类型是自身。[]int 不是基本类型，但其底层类型也是 []int 本身。题目问基本类型，所以选 A, B, C。"
    topic: properties
    chapter: underlying_type

  - id: q-under-022
    type: multiple
    difficulty: easy
    stem: "以下哪些类型的底层类型是它们自身？"
    options:
      - "A: [3]int"
      - "B: []int"
      - "C: *int"
      - "D: map[string]int"
    answer: ABCD
    explanation: "复合类型（数组、切片、指针、map、channel）的底层类型都是它们自身。"
    topic: properties
    chapter: underlying_type

  - id: q-under-023
    type: multiple
    difficulty: easy
    stem: "以下哪些语句创建了底层类型为 int 的新类型？"
    options:
      - "A: type MyInt int"
      - "B: type MyInt = int"
      - "C: type MyInt int; type YourInt MyInt"
      - "D: type MyInt = int; type YourInt = MyInt"
    answer: AC
    explanation: "类型定义 type T int 创建新类型，底层类型为 int。类型别名 type T = int 不创建新类型。"
    topic: properties
    chapter: underlying_type

