  # ============ 单选题 (Easy) ============
  - id: q-under-001
    type: single
    difficulty: easy
    stem: "基本类型 int 的底层类型是什么？"
    options:
      - "A: int"
      - "B: interface{}"
      - "C: any"
      - "D: 没有底层类型"
    answer: A
    explanation: "基本类型（预声明类型）的底层类型是自身。int 的底层类型是 int。"
    topic: properties
    chapter: underlying_type

  - id: q-under-002
    type: single
    difficulty: easy
