  # ============ 单选题 (Medium) ============
  - id: q-core-009
    type: single
    difficulty: medium
    stem: "以下类型定义中，哪个没有核心类型？"
    options:
      - "A: type Point struct { X, Y int }"
      - "B: type Data struct { a int; b string }"
      - "C: type IntPtr *int"
      - "D: type MyInt int"
    answer: B
    explanation: "结构体类型 Data 的字段类型不同（int 和 string），因此没有核心类型。"
    topic: properties
    chapter: core_type

  - id: q-core-010
    type: single
    difficulty: medium
    stem: "bytestring 核心类型表示什么？"
    options:
      - "A: 只是 string"
      - "B: 只是 []byte"
      - "C: string 或 []byte"
      - "D: 任意字节序列"
    answer: C
    explanation: "bytestring 核心类型表示可以是 string 或 []byte。"
    topic: properties
    chapter: core_type

  - id: q-core-011
    type: single
    difficulty: medium
    stem: "接口类型 Integer 的核心类型是什么？\n\ntype Integer interface {\n\t~int | ~int8 | ~int16 | ~int32 | ~int64\n}"
    options:
      - "A: int"
      - "B: interface{}"
      - "C: 没有核心类型"
      - "D: int8"
    answer: A
    explanation: "Integer 接口的类型集是所有整型的核心类型，它们的核心类型是 int。"
    topic: properties
    chapter: core_type

  - id: q-core-012
    type: single
    difficulty: medium
    stem: "以下接口的核心类型是什么？\n\ntype Any interface {\n\tint | float64 | string\n}"
    options:
      - "A: int"
      - "B: interface{}"
      - "C: 没有核心类型"
      - "D: bytestring"
    answer: C
    explanation: "int、float64、string 没有共同的核心类型，因此 Any 接口没有核心类型。"
    topic: properties
    chapter: core_type

