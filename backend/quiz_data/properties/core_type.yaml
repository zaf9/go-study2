  # ============ 多选题 (Medium) ============
  - id: q-core-025
    type: multiple
    difficulty: medium
    stem: "关于核心类型，以下哪些说法是正确的？"
    options:
      - "A: 基本类型的核心类型是其自身"
      - "B: 结构体字段类型相同时，核心类型是结构体本身"
      - "C: 接口类型的核心类型是其类型集的交集"
      - "D: bytestring 是 string 或 []byte"
    answer: ABCD
    explanation: "所有选项都正确描述了核心类型的规则。"
    topic: properties
    chapter: core_type

  - id: q-core-026
    type: multiple
    difficulty: medium
    stem: "以下哪些结构体有核心类型？"
    options:
      - "A: type Point struct { X, Y int }"
      - "B: type Data struct { name string; age int }"
      - "C: type Empty struct {}"
      - "D: type Pair struct { a, b int }"
    answer: ACD
    explanation: "Point（字段相同）、Empty（无字段）、Pair（字段相同）都有核心类型。Data 字段不同，没有核心类型。"
    topic: properties
    chapter: core_type

  - id: q-core-027
    type: multiple
    difficulty: medium
    stem: "关于接口的核心类型，以下哪些说法是正确的？"
    options:
      - "A: 接口的核心类型是其类型集的核心类型"
      - "B: 类型集为空时没有核心类型"
      - "C: 类型集只有一个类型时，核心类型是那个类型"
      - "D: 类型集类型无共同核心类型时，没有核心类型"
    answer: ABCD
    explanation: "接口的核心类型由其类型集决定。"
    topic: properties
    chapter: core_type

  - id: q-core-028
    type: multiple
    difficulty: medium
    stem: "以下哪些接口有核心类型？"
    options:
      - "A: type Integer interface { ~int | ~int8 }"
      - "B: type Any interface { int | float64 }"
      - "C: type Byteseq interface { ~string | ~[]byte }"
      - "D: type Empty interface {}"
    answer: AC
    explanation: "Integer 的核心类型是 int。Byteseq 的核心类型是 bytestring。Any 和 Empty 没有核心类型。"
    topic: properties
    chapter: core_type

