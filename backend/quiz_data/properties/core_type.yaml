    stem: "以下哪些函数签名使用了核心类型相关的约束？"
    options:
      - "A: func Print[T ~string](v T)"
      - "B: func Sum[T ~int | ~float64](v T) T"
      - "C: func Process[T any](v T)"
      - "D: func Bytes[T ~[]byte | ~string](v T)"
    answer: ABD
    explanation: "any 不限制核心类型。其他选项都使用了核心类型相关的约束。"
    topic: properties
    chapter: core_type

