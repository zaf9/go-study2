    type: single
    difficulty: hard
    stem: "带有标签的结构体有核心类型吗？\n\ntype Point struct {\n\tX int `json:\"x\"`\n\tY int `json:\"y\"`\n}"
    options:
      - "A: 有，是 Point"
      - "B: 没有"
      - "C: 有，是 int"
      - "D: 有，是 struct"
    answer: A
