      - "B: 用于泛型类型约束"
      - "C: 是一种联合核心类型"
      - "D: 可以用于 byteseq 接口"
    answer: ABCD
    explanation: "bytestring 是特殊的联合核心类型，用于表示 string 或 []byte。"
    topic: properties
    chapter: core_type

  - id: q-core-030
    type: multiple
    difficulty: hard
    stem: "以下哪些情况会导致结构体没有核心类型？"
    options:
      - "A: 字段类型不同"
      - "B: 空结构体"
      - "C: 字段类型相同但标签不同"
      - "D: 嵌入字段"
    answer: AC
    explanation: "字段类型不同或字段类型相同但标签不同的结构体没有核心类型。"
    topic: properties
    chapter: core_type

  - id: q-core-031
    type: multiple
    difficulty: hard
    stem: "关于类型参数的核心类型，以下哪些说法是正确的？"
    options:
      - "A: 类型参数的核心类型由其约束决定"
      - "B: 约束是接口时，核心类型是接口的核心类型"
      - "C: 约束是具体类型时，核心类型是该类型的核心类型"
      - "D: 类型参数本身有独立的核心类型"
    answer: ABC
    explanation: "类型参数的核心类型基于其类型约束，不是独立的。"
    topic: properties
    chapter: core_type

  - id: q-core-032
    type: multiple
