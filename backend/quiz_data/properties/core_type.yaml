  # ============ 单选题 (Easy) ============
  - id: q-core-001
    type: single
    difficulty: easy
    stem: "基本类型 int 的核心类型是什么？"
    options:
      - "A: int"
      - "B: interface{}"
      - "C: any"
      - "D: 没有核心类型"
    answer: A
    explanation: "基本类型的核心类型是其底层类型，也就是其自身。"
    topic: properties
    chapter: core_type

