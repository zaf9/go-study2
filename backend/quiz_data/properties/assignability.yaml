    stem: "nil 可以赋值给以下哪些类型？"
    options:
      - "A: *int"
      - "B: func()"
      - "C: []int"
      - "D: int"
    answer: ABC
    explanation: "nil 可以赋值给指针、函数、切片、map、channel 和接口类型。"
    topic: properties
    chapter: assignability

  - id: q-assign-023
    type: multiple
    difficulty: easy
    stem: "以下哪些常量可以赋值给 int 类型？"
    options:
      - "A: 42"
      - "B: 3.14"
      - "C: 'a'"
      - "D: true"
    answer: AC
    explanation: "42 和 'a' 可以表示为 int。3.14 是浮点数，true 是布尔值。"
