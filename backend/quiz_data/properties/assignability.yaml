  - id: q-assign-029
    type: multiple
    difficulty: hard
    stem: "关于类型参数的可赋值性，以下哪些说法是正确的？"
    options:
      - "A: 类型参数的实例化类型相同可以赋值"
      - "B: 类型参数的核心类型实现了接口可以赋值"
      - "C: 类型参数总是可以赋值给 any"
      - "D: 类型参数的约束决定可赋值性"
    answer: ABD
