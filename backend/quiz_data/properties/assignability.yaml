    stem: "关于 channel 的可赋值性，以下哪些说法是正确的？"
    options:
      - "A: 双向 channel 可以赋值给单向 channel"
      - "B: 单向 channel 不能赋值给双向 channel"
      - "C: 元素类型必须相同"
      - "D: 方向必须完全匹配"
    answer: ABC
    explanation: "方向不需要完全匹配，双向可以赋值给单向。"
    topic: properties
