  - id: q-assign-024
    type: multiple
    difficulty: easy
    stem: "以下哪些赋值是合法的？"
    options:
      - "A: var i int = 42"
      - "B: var f float64 = 3.14"
      - "C: var s string = \"hello\""
      - "D: var b bool = true"
    answer: ABCD
    explanation: "所有赋值都合法（类型相同）。"
    topic: properties
    chapter: assignability

  # ============ 多选题 (Medium) ============
  - id: q-assign-025
    type: multiple
    difficulty: medium
    stem: "关于可赋值性，以下哪些说法是正确的？"
    options:
      - "A: 类型相同可以赋值"
      - "B: 底层类型相同且一个不是命名类型可以赋值"
      - "C: 实现了接口可以赋值给接口变量"
      - "D: nil 只能赋值给特定类型"
    answer: ABCD
    explanation: "所有选项都正确描述了可赋值性条件。"
    topic: properties
    chapter: assignability

  - id: q-assign-026
    type: multiple
    difficulty: medium
    stem: "以下哪些赋值是不合法的？"
    options:
      - "A: type T1 int; type T2 int; var t1 T1; var t2 T2; t2 = t1"
      - "B: type T int; var t T; var i int; i = t"
      - "C: type T = int; var t T; var i int; i = t"
      - "D: var i int; i = nil"
    answer: ABD
    explanation: "T1 和 T2 都是命名类型不能赋值。T 和 int 都是命名类型不能赋值。nil 不能赋值给 int。类型别名可以赋值。"
    topic: properties
    chapter: assignability

  - id: q-assign-027
    type: multiple
    difficulty: medium
    stem: "以下哪些情况需要显式类型转换？"
    options:
      - "A: 两个命名类型赋值"
      - "B: 底层类型相同但都是命名类型"
      - "C: 浮点常量赋值给整数类型"
      - "D: 类型别名赋值"
    answer: ABC
    explanation: "类型别名不需要转换。"
    topic: properties
    chapter: assignability

  - id: q-assign-028
    type: multiple
    difficulty: medium
    stem: "关于接口赋值，以下哪些说法是正确的？"
    options:
      - "A: 值实现了接口可以赋值"
      - "B: 指针实现了接口可以赋值"
      - "C: 值的指针实现了接口，值不能赋值"
      - "D: 空接口可以接受任何值"
    answer: ABD
    explanation: "只有当值类型本身实现接口时才能赋值。空接口可以接受任何值。"
    topic: properties
    chapter: assignability

