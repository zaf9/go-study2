    stem: "以下哪些是涉及类型参数的额外可赋值性条件？"
    options:
      - "A: 类型参数的实例化类型相同"
      - "B: T 是接口，V 的核心类型实现了 T"
      - "C: 底层类型相同，忽略结构体标签"
      - "D: 无类型常量可表示为 T"
    answer: ABC
    explanation: "这些都是涉及类型参数的额外条件。"
    topic: properties
    chapter: assignability

  - id: q-assign-031
    type: multiple
