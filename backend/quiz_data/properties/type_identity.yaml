  # ============ 多选题 (Easy) ============
  - id: q-id-021
    type: multiple
    difficulty: easy
    stem: "以下哪些情况表示两个类型相同？"
    options:
      - "A: 两个类型字面量完全相同"
      - "B: 两个类型别名指向同一类型"
      - "C: 两个类型定义的底层类型相同"
      - "D: 两个类型名称相同"
    answer: AB
    explanation: "类型字面量相同或类型别名指向同一类型时，类型相同。类型定义创建新类型，即使底层类型相同也不同。"
    topic: properties
    chapter: type_identity

  - id: q-id-022
    type: multiple
    difficulty: easy
    stem: "以下哪些类型定义创建了与 int 不同的类型？"
    options:
      - "A: type MyInt int"
      - "B: type YourInt int"
      - "C: type ThisInt = int"
      - "D: type ThatInt = int"
    answer: AB
    explanation: "type MyInt int 和 type YourInt int 创建新类型。type T = int 是类型别名，不创建新类型。"
    topic: properties
    chapter: type_identity

