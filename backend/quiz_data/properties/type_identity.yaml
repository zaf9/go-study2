  - id: q-id-001
    type: single
    difficulty: easy
    stem: "类型定义 type T int 创建的类型 T 与 int 的关系是什么？"
    options:
      - "A: 类型相同"
      - "B: 类型不同"
      - "C: T 是 int 的别名"
      - "D: 编译错误"
    answer: B
    explanation: "类型定义 type T int 创建的新类型 T 与 int 类型不同。"
    topic: properties
    chapter: type_identity

