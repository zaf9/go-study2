questions:
  # ========== 简单题 (Easy) - 21道 ==========
  
  - id: type-bool-001
    type: single
    difficulty: easy
    stem: "Go语言的布尔类型名称是什么?"
    options:
      - "A: boolean"
      - "B: bool"
      - "C: Boolean"
      - "D: BOOL"
    answer: B
    explanation: "Go的布尔类型是bool,不是boolean。Go类型名都是小写。参见 Go 规范 Boolean types 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-002
    type: single
    difficulty: easy
    stem: "bool类型有哪两个值?"
    options:
      - "A: 0和1"
      - "B: true和false"
      - "C: True和False"
      - "D: TRUE和FALSE"
    answer: B
    explanation: "bool只有true和false两个预声明常量。Go区分大小写,必须小写。参见 Go 规范 Boolean types 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-003
    type: single
    difficulty: easy
    stem: "bool类型的零值是什么?"
    options:
      - "A: 0"
      - "B: nil"
      - "C: false"
      - "D: true"
    answer: C
    explanation: "bool的零值是false。var b bool声明的b是false。参见 Go 规范 The zero value 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-004
    type: single
    difficulty: easy
    stem: "逻辑与运算符是什么?"
    options:
      - "A: &"
      - "B: &&"
      - "C: and"
      - "D: AND"
    answer: B
    explanation: "Go的逻辑与是&&。&是位与运算符。Go不支持and关键字。参见 Go 规范 Logical operators 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-005
    type: single
    difficulty: easy
    stem: "逻辑或运算符是什么?"
    options:
      - "A: |"
      - "B: ||"
      - "C: or"
      - "D: OR"
    answer: B
    explanation: "Go的逻辑或是||。|是位或运算符。Go不支持or关键字。参见 Go 规范 Logical operators 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-006
    type: single
    difficulty: easy
    stem: "逻辑非运算符是什么?"
    options:
      - "A: ~"
      - "B: !"
      - "C: not"
      - "D: NOT"
    answer: B
    explanation: "Go的逻辑非是!。~是位取反(仅用于整数)。Go不支持not关键字。参见 Go 规范 Logical operators 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-007
    type: single
    difficulty: easy
    stem: "true && false的结果是什么?"
    options:
      - "A: true"
      - "B: false"
      - "C: 1"
      - "D: 0"
    answer: B
    explanation: "逻辑与要求两边都为true。true && false = false。参见 Go 规范 Logical operators 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-008
    type: single
    difficulty: easy
    stem: "true || false的结果是什么?"
    options:
      - "A: true"
      - "B: false"
      - "C: 1"
      - "D: 0"
    answer: A
    explanation: "逻辑或只要有一边为true就是true。true || false = true。参见 Go 规范 Logical operators 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-009
    type: single
    difficulty: easy
    stem: "!true的结果是什么?"
    options:
      - "A: true"
      - "B: false"
      - "C: 0"
      - "D: -1"
    answer: B
    explanation: "逻辑非取反。!true = false。参见 Go 规范 Logical operators 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-010
    type: single
    difficulty: easy
    stem: "Go中可以用0代表false吗?"
    options:
      - "A: 可以"
      - "B: 不可以"
      - "C: 有时可以"
      - "D: 只在条件中可以"
    answer: B
    explanation: "Go是强类型语言,bool和int不能混用。0不能当false,true不能当1。参见 Go 规范 Boolean types 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-011
    type: single
    difficulty: easy
    stem: "if 1 {}在Go中合法吗?"
    options:
      - "A: 合法"
      - "B: 不合法"
      - "C: 等于if true"
      - "D: 取决于编译器"
    answer: B
    explanation: "Go的if条件必须是bool类型。1是int,不能作为条件。参见 Go 规范 If statements 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-012
    type: single
    difficulty: easy
    stem: "比较运算符==返回什么类型?"
    options:
      - "A: int"
      - "B: bool"
      - "C: 取决于操作数"
      - "D: interface{}"
    answer: B
    explanation: "所有比较运算符(==, !=, <, >, <=, >=)返回bool类型。参见 Go 规范 Comparison operators 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-013
    type: single
    difficulty: easy
    stem: "3 > 2的类型是什么?"
    options:
      - "A: int"
      - "B: bool"
      - "C: true"
      - "D: untyped bool"
    answer: B
    explanation: "比较表达式的结果是bool类型。3 > 2是true,类型是bool。参见 Go 规范 Comparison operators 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-014
    type: multiple
    difficulty: easy
    stem: "以下哪些是bool类型的合法操作?(多选)"
    options:
      - "A: &&"
      - "B: ||"
      - "C: !"
      - "D: +"
    answer: ABC
    explanation: "bool支持&&、||、!逻辑运算。不支持+等算术运算。参见 Go 规范 Logical operators 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-015
    type: single
    difficulty: easy
    stem: "&&和||是短路求值吗?"
    options:
      - "A: 是"
      - "B: 不是"
      - "C: &&是,||不是"
      - "D: ||是,&&不是"
    answer: A
    explanation: "Go的&&和||都是短路求值。&&左边false不求右边,||左边true不求右边。参见 Go 规范 Logical operators 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-016
    type: single
    difficulty: easy
    stem: "false && f()中f()会被调用吗?"
    options:
      - "A: 会"
      - "B: 不会"
      - "C: 取决于f的返回值"
      - "D: 编译错误"
    answer: B
    explanation: "&&短路求值。左边false,整个表达式必是false,不需要求右边。f()不会被调用。参见 Go 规范 Logical operators 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-017
    type: single
    difficulty: easy
    stem: "true || f()中f()会被调用吗?"
    options:
      - "A: 会"
      - "B: 不会"
      - "C: 取决于f的返回值"
      - "D: 编译错误"
    answer: B
    explanation: "||短路求值。左边true,整个表达式必是true,不需要求右边。f()不会被调用。参见 Go 规范 Logical operators 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-018
    type: single
    difficulty: easy
    stem: "var b bool = \"true\"合法吗?"
    options:
      - "A: 合法"
      - "B: 不合法"
      - "C: 自动转换为true"
      - "D: 取决于编译器"
    answer: B
    explanation: "string不能自动转换为bool。需要用strconv.ParseBool。参见 Go 规范 Boolean types 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-019
    type: single
    difficulty: easy
    stem: "bool值可以比较相等吗?"
    options:
      - "A: 可以"
      - "B: 不可以"
      - "C: 只能用&&"
      - "D: 只能用=="
    answer: A
    explanation: "bool是可比较类型。true == true是true。可以用==和!=比较。参见 Go 规范 Comparison operators 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-020
    type: single
    difficulty: easy
    stem: "如何将bool转换为string?"
    options:
      - "A: string(b)"
      - "B: strconv.FormatBool(b)"
      - "C: fmt.Sprint(b)"
      - "D: B或C"
    answer: D
    explanation: "string(b)不能转换bool。可以用strconv.FormatBool或fmt.Sprint。参见 Go strconv包文档。"
    topic: types
    chapter: boolean

  - id: type-bool-021
    type: multiple
    difficulty: easy
    stem: "关于bool类型,以下说法正确的是?(多选)"
    options:
      - "A: 只有true和false两个值"
      - "B: 零值是false"
      - "C: 不能与int互转"
      - "D: 支持逻辑运算"
    answer: ABCD
    explanation: "bool只有true/false,零值false,不能与int互转,支持&&||!逻辑运算。参见 Go 规范 Boolean types 章节。"
    topic: types
    chapter: boolean

  # ========== 中等题 (Medium) - 10道 ==========

  - id: type-bool-022
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          a, b := true, false
          fmt.Println(a && b, a || b, !a)
      }
    options:
      - "A: false true false"
      - "B: true false true"
      - "C: 0 1 0"
      - "D: false true true"
    answer: A
    explanation: "true && false = false。true || false = true。!true = false。参见 Go 规范 Logical operators 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-023
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      var count = 0
      func f() bool {
          count++
          return true
      }
      func main() {
          _ = false && f()
          _ = true || f()
          fmt.Println(count)
      }
    options:
      - "A: 0"
      - "B: 1"
      - "C: 2"
      - "D: 编译错误"
    answer: A
    explanation: "短路求值:false&&不求右边,true||不求右边。f()一次都没被调用。count=0。参见 Go 规范 Logical operators 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-024
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          x := 5
          fmt.Println(x > 3 && x < 10)
      }
    options:
      - "A: true"
      - "B: false"
      - "C: 5"
      - "D: 编译错误"
    answer: A
    explanation: "5 > 3是true,5 < 10是true。true && true = true。参见 Go 规范 Logical operators 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-025
    type: code_fix
    difficulty: medium
    stem: "以下代码有编译错误,正确的修正方案是?"
    code: |
      package main
      import "fmt"
      func main() {
          x := 1
          if x {
              fmt.Println("one")
          }
      }
    options:
      - "A: if x == 1"
      - "B: if bool(x)"
      - "C: if x != 0"
      - "D: A或C"
    answer: D
    explanation: "if条件必须是bool。x是int。应该用比较表达式如x==1或x!=0。bool(x)不合法。参见 Go 规范 If statements 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-026
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          a := true
          b := !a
          c := !!a
          fmt.Println(a, b, c)
      }
    options:
      - "A: true false true"
      - "B: true false false"
      - "C: false true false"
      - "D: 编译错误"
    answer: A
    explanation: "a=true。b=!true=false。c=!!true=!false=true。双重否定等于原值。参见 Go 规范 Logical operators 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-027
    type: multiple
    difficulty: medium
    stem: "关于逻辑运算符优先级,以下说法正确的是?(多选)"
    options:
      - "A: !优先级最高"
      - "B: &&优先级高于||"
      - "C: a || b && c等于a || (b && c)"
      - "D: 建议用括号明确优先级"
    answer: ABCD
    explanation: "!>&&>||。a || b && c先算b&&c。建议用括号避免歧义。参见 Go 规范 Operator precedence 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-028
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          fmt.Println(true || false && false)
      }
    options:
      - "A: true"
      - "B: false"
      - "C: 编译错误"
      - "D: 取决于求值顺序"
    answer: A
    explanation: "&&优先级高于||。先算false && false = false。再算true || false = true。参见 Go 规范 Operator precedence 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-029
    type: code_fix
    difficulty: medium
    stem: "以下代码有问题,正确的修正方案是?"
    code: |
      package main
      import "fmt"
      func main() {
          var b bool
          n := int(b)
          fmt.Println(n)
      }
    options:
      - "A: 代码正确"
      - "B: 使用if b {n=1}"
      - "C: 使用三元运算符"
      - "D: 使用map[bool]int"
    answer: B
    explanation: "bool不能转int。Go没有三元运算符。应该用if或map转换。参见 Go 规范 Conversions 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-030
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var a, b bool
          fmt.Println(a == b, a && b, a || b)
      }
    options:
      - "A: true false false"
      - "B: false false false"
      - "C: true true true"
      - "D: false true false"
    answer: A
    explanation: "a,b都是零值false。false==false是true。false&&false=false。false||false=false。参见 Go 规范 Boolean types 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-031
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import (
          "fmt"
          "strconv"
      )
      func main() {
          b, _ := strconv.ParseBool("true")
          s := strconv.FormatBool(false)
          fmt.Println(b, s)
      }
    options:
      - "A: true false"
      - "B: true \"false\""
      - "C: 1 0"
      - "D: 编译错误"
    answer: A
    explanation: "ParseBool(\"true\")返回true。FormatBool(false)返回\"false\"。打印时不显示引号。参见 Go strconv包文档。"
    topic: types
    chapter: boolean

  # ========== 困难题 (Hard) - 4道 ==========

  - id: type-bool-032
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var x interface{} = true
          var y interface{} = true
          fmt.Println(x == y, x == true)
      }
    options:
      - "A: true true"
      - "B: false true"
      - "C: true false"
      - "D: false false"
    answer: A
    explanation: "interface{}比较:类型和值都相同才相等。x,y都是bool类型的true。x==true也成立。参见 Go 规范 Comparison operators 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-033
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type MyBool bool
      func main() {
          var a bool = true
          var b MyBool = true
          fmt.Println(a == bool(b), MyBool(a) == b)
      }
    options:
      - "A: true true"
      - "B: false false"
      - "C: 编译错误"
      - "D: true false"
    answer: A
    explanation: "bool和MyBool是不同类型,不能直接比较。但可以转换后比较。两个比较都是true。参见 Go 规范 Conversions 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-034
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          defer fmt.Println("a")
          defer fmt.Println("b")
          if false {
              defer fmt.Println("c")
          }
          fmt.Println("d")
      }
    options:
      - "A: d b a"
      - "B: d c b a"
      - "C: a b d"
      - "D: d a b"
    answer: A
    explanation: "if false块不执行,defer c不注册。执行顺序:d,然后defer逆序b,a。参见 Go 规范 Defer statements 章节。"
    topic: types
    chapter: boolean

  - id: type-bool-035
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          m := map[bool]string{true: "yes", false: "no"}
          var b bool
          fmt.Println(m[b], m[!b])
      }
    options:
      - "A: no yes"
      - "B: yes no"
      - "C:   (空字符串)"
      - "D: panic"
    answer: A
    explanation: "b零值是false。m[false]=\"no\"。!false是true,m[true]=\"yes\"。参见 Go 规范 Map types 章节。"
    topic: types
    chapter: boolean
