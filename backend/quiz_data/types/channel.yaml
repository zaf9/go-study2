    code: |
      package main
      import "fmt"
      func merge(ch1, ch2 <-chan int) <-chan int {
          out := make(chan int)
          go func() {
              for ch1 != nil || ch2 != nil {
                  select {
                  case v, ok := <-ch1:
                      if !ok { ch1 = nil; continue }
                      out <- v
                  case v, ok := <-ch2:
                      if !ok { ch2 = nil; continue }
                      out <- v
                  }
              }
              close(out)
          }()
          return out
      }
      func main() {
          ch1 := make(chan int, 2)
          ch2 := make(chan int, 2)
          ch1 <- 1; ch1 <- 2; close(ch1)
          ch2 <- 3; ch2 <- 4; close(ch2)
          for v := range merge(ch1, ch2) {
              fmt.Print(v)
          }
      }
    options:
      - "A: 1234"
      - "B: 3412"
      - "C: 包含1234的某个排列"
      - "D: 死锁"
    answer: C
    explanation: "merge合并两个channel。select随机选择就绪case。输出是1234的某个排列。参见 Go 并发模式。"
