  # ========== 困难题 (Hard) - 5道 ==========

  - id: type-struct-038
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type A struct{}
      func (A) Foo() { fmt.Print("A") }
      type B struct{ A }
      func (B) Foo() { fmt.Print("B") }
      func main() {
          b := B{}
          b.Foo()
          b.A.Foo()
      }
    options:
      - "A: AA"
      - "B: BB"
      - "C: BA"
      - "D: AB"
    answer: C
