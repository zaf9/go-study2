  - id: type-iface-042
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type I interface{ M() }
      type T int
      func (t T) M() { fmt.Print(t) }
      func main() {
          var i I = T(1)
          switch i.(type) {
          case T:
              i = T(2)
          }
          i.M()
      }
    options:
      - "A: 1"
      - "B: 2"
      - "C: 12"
      - "D: 21"
    answer: B
    explanation: "i初始T(1)。switch匹配case T,重新赋值i=T(2)。i.M()打印2。参见 Go 规范 Type switches 章节。"
    topic: types
    chapter: interface
