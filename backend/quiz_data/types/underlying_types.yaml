questions:
  # ========== 简单题 (Easy) - 18道 ==========
  
  - id: type-under-001
    type: single
    difficulty: easy
    stem: "Go中底层类型(underlying type)是什么?"
    options:
      - "A: 类型的别名"
      - "B: 类型定义的基础类型"
      - "C: 接口类型"
      - "D: 指针类型"
    answer: B
    explanation: "每个类型都有底层类型,决定了类型的内存布局和操作。参见 Go 规范 Underlying types 章节。"
    topic: types
    chapter: underlying_types

  - id: type-under-002
    type: single
    difficulty: easy
    stem: "type MyInt int,MyInt的底层类型是什么?"
    options:
      - "A: MyInt"
      - "B: int"
      - "C: interface{}"
      - "D: any"
    answer: B
    explanation: "type MyInt int定义新类型,底层类型是int。参见 Go 规范 Underlying types 章节。"
    topic: types
    chapter: underlying_types

  - id: type-under-003
    type: single
    difficulty: easy
    stem: "预声明类型int的底层类型是什么?"
    options:
      - "A: int"
      - "B: number"
      - "C: 无底层类型"
      - "D: interface{}"
    answer: A
    explanation: "预声明类型的底层类型是其自身。int的底层类型是int。参见 Go 规范 Underlying types 章节。"
    topic: types
    chapter: underlying_types

  - id: type-under-004
    type: single
    difficulty: easy
    stem: "type A int; type B A,B的底层类型是什么?"
    options:
      - "A: A"
      - "B: B"
      - "C: int"
      - "D: interface{}"
    answer: C
    explanation: "底层类型递归查找。B的底层类型是A的底层类型,即int。参见 Go 规范 Underlying types 章节。"
    topic: types
    chapter: underlying_types

  - id: type-under-005
    type: single
    difficulty: easy
    stem: "type S struct{X int}的底层类型是什么?"
    options:
      - "A: S"
      - "B: struct{X int}"
      - "C: int"
      - "D: struct"
    answer: B
    explanation: "结构体类型的底层类型是结构体字面量struct{X int}。参见 Go 规范 Underlying types 章节。"
    topic: types
    chapter: underlying_types

  - id: type-under-006
    type: single
    difficulty: easy
    stem: "类型别名type A = B,A的底层类型是什么?"
    options:
      - "A: A"
      - "B: B"
      - "C: B的底层类型"
      - "D: 无底层类型"
    answer: C
    explanation: "A是B的别名,A就是B。A的底层类型即B的底层类型。参见 Go 规范 Alias declarations 章节。"
    topic: types
    chapter: underlying_types

  - id: type-under-007
    type: single
    difficulty: easy
    stem: "[]int的底层类型是什么?"
    options:
      - "A: int"
      - "B: []int"
      - "C: slice"
      - "D: array"
    answer: B
    explanation: "类型字面量的底层类型是其自身。[]int的底层类型是[]int。参见 Go 规范 Underlying types 章节。"
    topic: types
    chapter: underlying_types

  - id: type-under-008
    type: single
    difficulty: easy
    stem: "底层类型相同的两个类型可以相互转换吗?"
    options:
      - "A: 不可以"
      - "B: 可以"
      - "C: 需要显式转换"
      - "D: B和C"
    answer: D
    explanation: "底层类型相同可以转换,但不同定义类型需要显式转换。参见 Go 规范 Conversions 章节。"
    topic: types
    chapter: underlying_types

  - id: type-under-009
