  # ========== 中等题 (Medium) - 10道 ==========

  - id: type-under-019
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type MyInt int
      func main() {
          var x MyInt = 10
          var y int = int(x)
          fmt.Println(y)
      }
    options:
      - "A: 10"
      - "B: MyInt(10)"
      - "C: 编译错误"
      - "D: 0"
    answer: A
    explanation: "MyInt底层是int,可以转换。int(x)=10。输出10。参见 Go 规范 Conversions 章节。"
    topic: types
    chapter: underlying_types

  - id: type-under-020
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type A int
      type B int
      func main() {
          var a A = 1
          var b B = B(a)
          fmt.Println(b)
      }
    options:
      - "A: 1"
      - "B: 编译错误"
      - "C: 0"
      - "D: A(1)"
    answer: A
    explanation: "A和B底层都是int,可以相互转换。B(a)=1。输出1。参见 Go 规范 Conversions 章节。"
    topic: types
    chapter: underlying_types

  - id: type-under-021
    type: code_fix
    difficulty: medium
    stem: "以下代码编译错误,正确的修正是?"
    code: |
      package main
      type MyInt int
      func main() {
          var x MyInt = 10
          var y int = x
      }
    options:
      - "A: var y int = int(x)"
      - "B: var y MyInt = x"
      - "C: 代码正确"
      - "D: A或B"
    answer: D
    explanation: "MyInt和int是不同类型,需要转换或改类型。A显式转换,B统一类型。参见 Go 规范 Conversions 章节。"
    topic: types
    chapter: underlying_types

  - id: type-under-022
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type MySlice []int
      func main() {
          var s MySlice = []int{1, 2, 3}
          fmt.Println(len(s))
      }
    options:
      - "A: 3"
      - "B: 编译错误"
      - "C: 0"
      - "D: MySlice"
    answer: A
    explanation: "MySlice底层是[]int。[]int字面量可以赋值。len(s)=3。参见 Go 规范 Underlying types 章节。"
    topic: types
    chapter: underlying_types

  - id: type-under-023
    type: multiple
    difficulty: medium
    stem: "以下哪些类型可以不经转换赋值给type MyInt int?(多选)"
    options:
      - "A: int"
      - "B: int64"
      - "C: 无类型常量10"
      - "D: MyInt"
    answer: CD
    explanation: "无类型常量可以隐式转换,同类型可以。int需要显式转换。参见 Go 规范 Assignability 章节。"
    topic: types
    chapter: underlying_types

  - id: type-under-024
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type Point struct{ X, Y int }
      func main() {
          p1 := Point{1, 2}
          p2 := struct{ X, Y int }{1, 2}
          fmt.Println(p1 == p2)
      }
    options:
      - "A: true"
      - "B: false"
      - "C: 编译错误"
      - "D: panic"
    answer: A
    explanation: "Point底层是struct{X,Y int}。p2也是该类型。可比较且相等。参见 Go 规范 Comparison operators 章节。"
    topic: types
    chapter: underlying_types

  - id: type-under-025
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type MyFunc func(int) int
      func main() {
          var f MyFunc = func(x int) int { return x * 2 }
          fmt.Println(f(5))
      }
    options:
      - "A: 10"
      - "B: 5"
      - "C: 编译错误"
      - "D: MyFunc"
    answer: A
    explanation: "MyFunc底层是func(int)int。函数字面量类型匹配可赋值。f(5)=10。参见 Go 规范 Underlying types 章节。"
    topic: types
    chapter: underlying_types

  - id: type-under-026
    type: multiple
    difficulty: medium
    stem: "关于底层类型和转换,以下说法正确的是?(多选)"
    options:
      - "A: 底层类型相同可以转换"
      - "B: 无类型常量可以隐式转换"
      - "C: 类型别名无需转换"
      - "D: 不同定义类型总是需要转换"
    answer: ABC
    explanation: "底层相同可转换,无类型常量隐式,别名是同类型。同底层不同名需要转换。参见 Go 规范 Conversions 章节。"
    topic: types
    chapter: underlying_types

  - id: type-under-027
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type MyMap map[string]int
      func main() {
          m := MyMap{"a": 1}
          m["b"] = 2
          fmt.Println(len(m))
      }
    options:
      - "A: 2"
      - "B: 1"
      - "C: 编译错误"
      - "D: 0"
    answer: A
    explanation: "MyMap底层是map[string]int。支持map操作。添加后len=2。参见 Go 规范 Underlying types 章节。"
    topic: types
    chapter: underlying_types

  - id: type-under-028
    type: code_fix
    difficulty: medium
    stem: "以下代码编译错误,如何修正?"
    code: |
      package main
      type Int1 int
      type Int2 int
      func main() {
          var x Int1 = 10
          var y Int2 = x
      }
    options:
      - "A: var y Int2 = Int2(x)"
      - "B: 代码正确"
      - "C: var y Int2 = int(x)"
      - "D: 无法修正"
    answer: A
    explanation: "Int1和Int2是不同类型。需要显式转换Int2(x)。底层都是int可转换。参见 Go 规范 Conversions 章节。"
    topic: types
    chapter: underlying_types

  # ========== 困难题 (Hard) - 4道 ==========

  - id: type-under-029
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type T1 struct{ X int }
      type T2 struct{ X int }
      func main() {
          v1 := T1{1}
          v2 := T2(v1)
          fmt.Println(v2.X)
      }
    options:
      - "A: 1"
      - "B: 编译错误"
      - "C: 0"
      - "D: T2{1}"
    answer: A
    explanation: "T1和T2底层类型相同struct{X int}。可以转换。v2.X=1。参见 Go 规范 Conversions 章节。"
    topic: types
    chapter: underlying_types

  - id: type-under-030
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type A int
      type B A
      type C B
      func main() {
          var c C = 10
          var i int = int(c)
          fmt.Println(i)
      }
    options:
      - "A: 10"
      - "B: 编译错误"
      - "C: C(10)"
      - "D: 0"
    answer: A
    explanation: "C->B->A->int,底层都是int。可以链式转换。int(c)=10。参见 Go 规范 Conversions 章节。"
    topic: types
    chapter: underlying_types

  - id: type-under-031
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type Number interface{ ~int | ~float64 }
      type MyInt int
      func Add[T Number](a, b T) T { return a + b }
      func main() {
          fmt.Println(Add(MyInt(1), MyInt(2)))
      }
    options:
      - "A: 3"
      - "B: 编译错误"
      - "C: MyInt(3)"
      - "D: 1"
    answer: A
    explanation: "MyInt底层是int,满足~int约束。Add(1,2)=3。输出3(非MyInt格式)。参见 Go 规范 Type constraints 章节。"
    topic: types
    chapter: underlying_types

  - id: type-under-032
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      import "reflect"
      type MyInt int
      func main() {
          var x MyInt = 10
          t := reflect.TypeOf(x)
          fmt.Println(t.Kind(), t.Name())
      }
    options:
      - "A: int MyInt"
      - "B: MyInt int"
      - "C: int int"
      - "D: MyInt MyInt"
    answer: A
    explanation: "Kind返回底层类型种类int。Name返回类型名MyInt。参见 Go reflect包文档。"
    topic: types
    chapter: underlying_types
