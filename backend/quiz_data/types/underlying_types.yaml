  - id: type-under-014
    type: single
    difficulty: easy
    stem: "泛型约束中~T表示什么?"
    options:
      - "A: 类型T"
      - "B: 底层类型是T"
      - "C: T的指针"
      - "D: T的别名"
    answer: B
    explanation: "~T表示底层类型是T的所有类型。用于泛型约束。参见 Go 规范 Type approximation 章节。"
    topic: types
    chapter: underlying_types

  - id: type-under-015
    type: multiple
    difficulty: easy
    stem: "以下哪些类型的底层类型是其自身?(多选)"
