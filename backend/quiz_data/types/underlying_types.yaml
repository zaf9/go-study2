    difficulty: easy
    stem: "interface{}的底层类型是什么?"
    options:
      - "A: interface"
      - "B: interface{}"
      - "C: any"
      - "D: 无底层类型"
    answer: B
    explanation: "interface{}是类型字面量,底层类型是其自身interface{}。参见 Go 规范 Underlying types 章节。"
    topic: types
    chapter: underlying_types

