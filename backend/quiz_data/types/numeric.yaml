  # ========== 中等题 (Medium) - 12道 ==========

  - id: type-num-025
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var x int8 = 127
          x++
          fmt.Println(x)
      }
    options:
      - "A: 128"
      - "B: -128"
      - "C: 溢出错误"
      - "D: 0"
    answer: B
    explanation: "int8范围-128到127。127+1溢出回绕到-128。Go不检测整数溢出。参见 Go 规范 Integer overflow 章节。"
    topic: types
    chapter: numeric

  - id: type-num-026
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var a int = 10
          var b int32 = 20
          fmt.Println(a + int(b))
      }
    options:
      - "A: 30"
      - "B: 编译错误"
      - "C: 类型不匹配"
      - "D: 30.0"
    answer: A
    explanation: "int和int32不同类型,需要转换。int(b)将b转为int。10+20=30。参见 Go 规范 Conversions 章节。"
    topic: types
    chapter: numeric

  - id: type-num-027
    type: code_fix
    difficulty: medium
    stem: "以下代码有编译错误,正确的修正方案是?"
    code: |
      package main
      import "fmt"
      func main() {
          var a int = 10
          var b int32 = 20
          fmt.Println(a + b)
      }
    options:
      - "A: a + int(b)"
      - "B: int32(a) + b"
      - "C: 两者都可以"
      - "D: 代码正确"
    answer: C
    explanation: "int和int32是不同类型。需要显式转换为相同类型后运算。参见 Go 规范 Conversions 章节。"
    topic: types
    chapter: numeric

  - id: type-num-028
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          x := 0.1 + 0.2
          fmt.Println(x == 0.3)
      }
    options:
      - "A: true"
      - "B: false"
      - "C: 0.3"
      - "D: 编译错误"
    answer: B
    explanation: "浮点数精度问题。0.1+0.2不精确等于0.3。比较浮点数应用误差范围。参见 IEEE 754浮点数精度。"
    topic: types
    chapter: numeric

  - id: type-num-029
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          c := 3 + 4i
          fmt.Println(real(c), imag(c))
      }
    options:
      - "A: 3 4"
      - "B: 3+4i 0"
      - "C: (3,4)"
      - "D: 编译错误"
    answer: A
    explanation: "real()返回实部3,imag()返回虚部4。参见 Go 规范 Complex numbers 章节。"
    topic: types
    chapter: numeric

  - id: type-num-030
    type: multiple
    difficulty: medium
    stem: "关于整数溢出,以下说法正确的是?(多选)"
    options:
      - "A: Go不检测运行时溢出"
      - "B: 溢出会回绕"
      - "C: 常量溢出编译错误"
      - "D: 使用math包检测溢出"
    answer: ABC
    explanation: "运行时溢出不报错,会回绕。常量必须在类型范围内,否则编译错误。math包有溢出检测函数。参见 Go 规范 Integer overflow 章节。"
    topic: types
    chapter: numeric

  - id: type-num-031
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          x := 10
          y := 3
          fmt.Println(x/y, x%y, -x/y, -x%y)
      }
    options:
      - "A: 3 1 -3 -1"
      - "B: 3 1 -4 2"
      - "C: 3.33 1 -3.33 -1"
      - "D: 3 1 -3 1"
    answer: A
    explanation: "整数除法向零截断。10/3=3,10%3=1。-10/3=-3(不是-4),-10%3=-1。参见 Go 规范 Integer operators 章节。"
    topic: types
    chapter: numeric

  - id: type-num-032
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var x uint8 = 255
          x++
          fmt.Println(x)
      }
    options:
      - "A: 256"
      - "B: 0"
      - "C: -1"
      - "D: 溢出错误"
    answer: B
    explanation: "uint8最大255。255+1溢出回绕到0。无符号溢出总是回绕到0。参见 Go 规范 Integer overflow 章节。"
    topic: types
    chapter: numeric

  - id: type-num-033
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          x := 1 << 62
          y := 1 << 63
          fmt.Printf("%T %T\n", x, y)
      }
    options:
      - "A: int int"
      - "B: int64 int64"
      - "C: int int64"
      - "D: 编译错误"
    answer: A
    explanation: "无类型整数常量默认int。64位系统int是64位。1<<62和1<<63都是int(63位有符号最大)。参见 Go 规范 Constants 章节。"
    topic: types
    chapter: numeric

  - id: type-num-034
    type: code_fix
    difficulty: medium
    stem: "以下代码有问题,正确的修正方案是?"
    code: |
      package main
      import "fmt"
      func main() {
          var x float64 = 1e400
          fmt.Println(x)
      }
    options:
      - "A: 使用math.MaxFloat64"
      - "B: 使用big.Float"
      - "C: 代码正确,输出+Inf"
      - "D: 编译错误"
    answer: D
    explanation: "1e400是常量,超出float64范围,编译错误。运行时溢出产生+Inf,但常量必须有效。参见 Go 规范 Constants 章节。"
    topic: types
    chapter: numeric

  - id: type-num-035
    type: multiple
    difficulty: medium
    stem: "关于位清零运算符&^,以下说法正确的是?(多选)"
    options:
      - "A: 是Go特有的运算符"
      - "B: a &^ b相当于a & ^b"
      - "C: 用于清除特定位"
      - "D: 结果是a中对应b为1的位被清零"
    answer: ABCD
    explanation: "&^是Go的位清零(AND NOT)。a &^ b = a & (^b)。b中为1的位在结果中被清零。参见 Go 规范 Integer operators 章节。"
    topic: types
    chapter: numeric

  - id: type-num-036
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          x := 0b1111
          y := 0b0101
          fmt.Println(x &^ y)
      }
    options:
      - "A: 10(十进制)"
      - "B: 5(十进制)"
      - "C: 15(十进制)"
      - "D: 0"
    answer: A
    explanation: "x=1111,y=0101。x &^ y清除x中对应y为1的位:1111 &^ 0101 = 1010 = 10。参见 Go 规范 Integer operators 章节。"
    topic: types
    chapter: numeric

  # ========== 困难题 (Hard) - 4道 ==========

  - id: type-num-037
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          const x = 1 << 100
          fmt.Println(float64(x))
      }
    options:
      - "A: 编译错误"
      - "B: +Inf"
      - "C: 1.2676506002282294e+30"
      - "D: 0"
    answer: C
    explanation: "无类型常量可以任意精度。1<<100转float64不溢出(float64最大约1.8e308)。输出约1.27e30。参见 Go 规范 Constants 章节。"
    topic: types
    chapter: numeric

  - id: type-num-038
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import (
          "fmt"
          "math"
      )
      func main() {
          x := math.NaN()
          fmt.Println(x == x, math.IsNaN(x))
      }
    options:
      - "A: true true"
      - "B: false true"
      - "C: true false"
      - "D: false false"
    answer: B
    explanation: "NaN不等于任何值包括自己。x==x是false。math.IsNaN(x)是true。参见 IEEE 754 NaN规范。"
    topic: types
    chapter: numeric

  - id: type-num-039
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var x int = -1
          var y uint = uint(x)
          fmt.Printf("%d %d\n", x, y)
      }
    options:
      - "A: -1 -1"
      - "B: -1 最大uint值"
      - "C: 编译错误"
      - "D: -1 0"
    answer: B
    explanation: "-1的二进制(补码)是全1。转uint后解释为最大正数(64位系统是18446744073709551615)。参见 Go 规范 Conversions 章节。"
    topic: types
    chapter: numeric

  - id: type-num-040
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          x := 1.0
          y := 1.0000000000000001
          z := 1.0000000000000002
          fmt.Println(x == y, y == z)
      }
    options:
      - "A: false false"
      - "B: true true"
      - "C: true false"
      - "D: false true"
    answer: C
    explanation: "float64约15位精度。1.0000000000000001与1.0在float64中相等。但1.0000000000000002可区分。参见 IEEE 754浮点精度。"
    topic: types
    chapter: numeric
