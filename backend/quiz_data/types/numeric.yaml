  # ========== 简单题 (Easy) - 24道 ==========
  
  - id: type-num-001
    type: single
    difficulty: easy
    stem: "Go中int的大小是多少位?"
    options:
      - "A: 32位"
      - "B: 64位"
      - "C: 取决于平台"
      - "D: 16位"
    answer: C
    explanation: "int大小取决于平台:32位系统是32位,64位系统是64位。参见 Go 规范 Numeric types 章节。"
    topic: types
    chapter: numeric

  - id: type-num-002
