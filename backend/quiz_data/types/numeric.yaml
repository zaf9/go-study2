      - "B: int32"
      - "C: int64"
      - "D: integer"
    answer: B
    explanation: "int32固定是32位有符号整数。int是平台相关的。Go没有integer类型。参见 Go 规范 Numeric types 章节。"
    topic: types
    chapter: numeric

