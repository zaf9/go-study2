    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func f(x interface{}) {
          switch x := x.(type) {
          case nil:
              fmt.Printf("nil:%T", x)
          case int:
              fmt.Printf("int:%T", x)
          }
      }
      func main() {
          f(nil)
          f(10)
      }
    options:
      - "A: nil:<nil>int:int"
      - "B: nil:interface{}int:int"
      - "C: panic"
      - "D: 编译错误"
