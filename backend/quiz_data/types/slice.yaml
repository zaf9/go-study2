questions:
  # ========== 简单题 (Easy) - 25道 ==========
  
  - id: type-slice-001
    type: single
    difficulty: easy
    stem: "Go中切片的类型表示是什么?"
    options:
      - "A: [N]T"
      - "B: []T"
      - "C: slice[T]"
      - "D: list[T]"
    answer: B
    explanation: "切片类型是[]T,没有长度。[N]T是数组。Go没有slice或list关键字。参见 Go 规范 Slice types 章节。"
    topic: types
    chapter: slice

  - id: type-slice-002
    type: single
    difficulty: easy
    stem: "切片和数组的主要区别是什么?"
    options:
      - "A: 切片长度可变"
      - "B: 切片是引用类型"
      - "C: 切片可以是nil"
      - "D: 以上都是"
    answer: D
    explanation: "切片长度可变、是引用类型(内部是指针+长度+容量)、可以是nil。参见 Go 规范 Slice types 章节。"
    topic: types
    chapter: slice

  - id: type-slice-003
    type: single
    difficulty: easy
    stem: "切片的零值是什么?"
    options:
      - "A: []"
      - "B: nil"
      - "C: 空切片"
      - "D: undefined"
    answer: B
    explanation: "切片的零值是nil。nil切片长度和容量都是0。参见 Go 规范 The zero value 章节。"
    topic: types
    chapter: slice

  - id: type-slice-004
    type: single
    difficulty: easy
    stem: "如何创建一个长度为3、容量为5的切片?"
    options:
      - "A: make([]int, 3, 5)"
      - "B: new([]int, 3, 5)"
      - "C: []int{3, 5}"
      - "D: [3:5]int{}"
    answer: A
    explanation: "make([]T, len, cap)创建指定长度和容量的切片。参见 Go 规范 Making slices 章节。"
    topic: types
    chapter: slice

  - id: type-slice-005
    type: single
    difficulty: easy
    stem: "make([]int, 5)创建的切片容量是多少?"
    options:
      - "A: 0"
      - "B: 5"
      - "C: 10"
      - "D: 未定义"
    answer: B
    explanation: "make([]T, len)省略cap时,cap等于len。容量是5。参见 Go 规范 Making slices 章节。"
    topic: types
    chapter: slice

  - id: type-slice-006
    type: single
    difficulty: easy
    stem: "len(s)和cap(s)分别返回什么?"
    options:
      - "A: 长度和长度"
      - "B: 容量和长度"
      - "C: 长度和容量"
      - "D: 大小和容量"
    answer: C
    explanation: "len返回切片长度(元素个数),cap返回容量(底层数组可用空间)。参见 Go 规范 Length and capacity 章节。"
    topic: types
    chapter: slice

  - id: type-slice-007
    type: single
    difficulty: easy
    stem: "append(s, 1, 2, 3)的作用是什么?"
    options:
      - "A: 在s开头添加元素"
      - "B: 在s末尾添加元素"
      - "C: 替换s的元素"
      - "D: 修改s的容量"
    answer: B
    explanation: "append在切片末尾追加元素。返回新切片(可能重新分配)。参见 Go 规范 Appending to slices 章节。"
    topic: types
    chapter: slice

  - id: type-slice-008
    type: single
    difficulty: easy
    stem: "append返回值必须使用吗?"
    options:
      - "A: 不必须"
      - "B: 必须"
      - "C: 取决于是否扩容"
      - "D: 取决于元素类型"
    answer: B
    explanation: "append可能返回新底层数组。必须使用返回值:s = append(s, x)。参见 Go 规范 Appending to slices 章节。"
    topic: types
    chapter: slice

  - id: type-slice-009
    type: single
    difficulty: easy
    stem: "切片索引s[i]返回什么?"
    options:
      - "A: 元素的引用"
      - "B: 元素的值"
      - "C: 元素的副本"
      - "D: 取决于元素类型"
    answer: B
    explanation: "s[i]返回元素值。可以用&s[i]获取地址。修改s[i]会修改切片元素。参见 Go 规范 Index expressions 章节。"
    topic: types
    chapter: slice

  - id: type-slice-010
    type: single
    difficulty: easy
    stem: "s[1:3]返回的切片长度是多少?"
    options:
      - "A: 1"
      - "B: 2"
      - "C: 3"
      - "D: 取决于s"
    answer: B
    explanation: "s[low:high]长度是high-low。s[1:3]长度=3-1=2。参见 Go 规范 Slice expressions 章节。"
    topic: types
    chapter: slice

  - id: type-slice-011
    type: single
    difficulty: easy
    stem: "s[:3]等价于什么?"
    options:
      - "A: s[0:3]"
      - "B: s[3:]"
      - "C: s[0:len(s)]"
      - "D: s[3:len(s)]"
    answer: A
    explanation: "省略low默认0。s[:3]等于s[0:3]。参见 Go 规范 Slice expressions 章节。"
    topic: types
    chapter: slice

  - id: type-slice-012
    type: single
    difficulty: easy
    stem: "s[2:]等价于什么?"
    options:
      - "A: s[2:2]"
      - "B: s[2:len(s)]"
      - "C: s[0:2]"
      - "D: s[2:cap(s)]"
    answer: B
    explanation: "省略high默认len(s)。s[2:]等于s[2:len(s)]。参见 Go 规范 Slice expressions 章节。"
    topic: types
    chapter: slice

  - id: type-slice-013
    type: single
    difficulty: easy
    stem: "切片可以比较吗?"
    options:
      - "A: 可以用=="
      - "B: 只能与nil比较"
      - "C: 用reflect.DeepEqual"
      - "D: B或C"
    answer: D
    explanation: "切片只能与nil用==比较。比较内容需要reflect.DeepEqual或slices.Equal。参见 Go 规范 Comparison operators 章节。"
    topic: types
    chapter: slice

  - id: type-slice-014
    type: single
    difficulty: easy
    stem: "copy(dst, src)返回什么?"
    options:
      - "A: 新切片"
      - "B: 复制的元素个数"
      - "C: 错误"
      - "D: dst"
    answer: B
    explanation: "copy返回实际复制的元素个数,是min(len(dst), len(src))。参见 Go 规范 Appending and copying slices 章节。"
    topic: types
    chapter: slice

  - id: type-slice-015
    type: single
    difficulty: easy
    stem: "nil切片和空切片的区别是什么?"
    options:
      - "A: 没有区别"
      - "B: nil切片无底层数组"
      - "C: 空切片len>0"
      - "D: nil切片不能append"
    answer: B
    explanation: "nil切片无底层数组(nil指针)。空切片有底层数组(非nil)。两者len都是0。参见 Go 规范 Slice types 章节。"
    topic: types
    chapter: slice

  - id: type-slice-016
    type: multiple
    difficulty: easy
    stem: "以下哪些创建的是nil切片?(多选)"
    options:
      - "A: var s []int"
      - "B: s := []int{}"
      - "C: s := make([]int, 0)"
      - "D: var s []int = nil"
    answer: AD
    explanation: "var声明和显式赋nil是nil切片。{}字面量和make创建的是非nil空切片。参见 Go 规范 Slice types 章节。"
    topic: types
    chapter: slice

  - id: type-slice-017
    type: single
    difficulty: easy
    stem: "切片扩容时容量如何增长?"
    options:
      - "A: 总是翻倍"
      - "B: 总是加1"
      - "C: 取决于当前大小"
      - "D: 固定增加10"
    answer: C
    explanation: "小切片约翻倍,大切片增长约25%。具体策略由运行时决定。参见 Go 运行时切片增长策略。"
    topic: types
    chapter: slice

  - id: type-slice-018
    type: single
    difficulty: easy
    stem: "append(s, t...)的...是什么意思?"
    options:
      - "A: 可变参数"
      - "B: 展开切片t"
      - "C: 连接两个切片"
      - "D: B和C"
    answer: D
    explanation: "...展开切片t的所有元素追加到s。等于连接两个切片。参见 Go 规范 Appending to slices 章节。"
    topic: types
    chapter: slice

  - id: type-slice-019
    type: single
    difficulty: easy
    stem: "切片的底层数据结构是什么?"
    options:
      - "A: 链表"
      - "B: 指针+长度+容量"
      - "C: 数组"
      - "D: map"
    answer: B
    explanation: "切片内部是(指针,len,cap)。指针指向底层数组。参见 Go 规范 Slice types 章节。"
    topic: types
    chapter: slice

  - id: type-slice-020
    type: single
    difficulty: easy
    stem: "修改切片元素会影响底层数组吗?"
    options:
      - "A: 会"
      - "B: 不会"
      - "C: 取决于是否扩容"
      - "D: 取决于元素类型"
    answer: A
    explanation: "切片共享底层数组。修改切片元素会修改底层数组。参见 Go 规范 Slice types 章节。"
    topic: types
    chapter: slice

  - id: type-slice-021
    type: single
    difficulty: easy
    stem: "从数组创建切片a[:]后,修改切片会影响数组吗?"
    options:
      - "A: 会"
      - "B: 不会"
      - "C: 取决于操作"
      - "D: 只有append会"
    answer: A
    explanation: "a[:]创建的切片共享数组a。修改切片元素会修改原数组。参见 Go 规范 Slice expressions 章节。"
    topic: types
    chapter: slice

  - id: type-slice-022
    type: single
    difficulty: easy
    stem: "如何复制切片以避免共享底层数组?"
    options:
      - "A: b := a"
      - "B: b := make([]T, len(a)); copy(b, a)"
      - "C: b := append([]T{}, a...)"
      - "D: B或C"
    answer: D
    explanation: "b:=a只复制切片头,共享底层数组。make+copy或append到新切片创建独立副本。参见 Go 规范 Appending and copying slices 章节。"
    topic: types
    chapter: slice

  - id: type-slice-023
    type: multiple
    difficulty: easy
    stem: "关于切片,以下说法正确的是?(多选)"
    options:
      - "A: 是引用类型"
      - "B: 长度可变"
      - "C: 可以是nil"
      - "D: 不能比较(除了nil)"
    answer: ABCD
    explanation: "切片是引用类型,长度可变,可以nil,不能用==比较(除nil)。参见 Go 规范 Slice types 章节。"
    topic: types
    chapter: slice

  - id: type-slice-024
    type: single
    difficulty: easy
    stem: "s[low:high:max]中max指定什么?"
    options:
      - "A: 最大长度"
      - "B: 容量上限"
      - "C: 元素个数"
      - "D: 编译错误"
    answer: B
    explanation: "三索引切片s[low:high:max]限制容量为max-low。防止超出预期范围。参见 Go 规范 Slice expressions 章节。"
    topic: types
    chapter: slice

  - id: type-slice-025
    type: single
    difficulty: easy
    stem: "slices.Delete(s, i, j)的作用是什么?"
    options:
      - "A: 删除索引i的元素"
      - "B: 删除索引[i,j)的元素"
      - "C: 删除值为i到j的元素"
      - "D: 返回新切片"
    answer: B
    explanation: "slices.Delete删除[i,j)范围的元素。返回修改后的切片。参见 Go slices包文档。"
    topic: types
    chapter: slice

  # ========== 中等题 (Medium) - 13道 ==========

  - id: type-slice-026
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          s := []int{1, 2, 3}
          t := s
          t[0] = 100
          fmt.Println(s[0])
      }
    options:
      - "A: 1"
      - "B: 100"
      - "C: 0"
      - "D: 编译错误"
    answer: B
    explanation: "切片赋值共享底层数组。t[0]=100也修改了s[0]。输出100。参见 Go 规范 Slice types 章节。"
    topic: types
    chapter: slice

  - id: type-slice-027
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          s := make([]int, 3, 5)
          fmt.Println(len(s), cap(s), s)
      }
    options:
      - "A: 3 5 [0 0 0]"
      - "B: 5 5 [0 0 0 0 0]"
      - "C: 3 3 [0 0 0]"
      - "D: 5 3 [0 0 0]"
    answer: A
    explanation: "make([]int, 3, 5)创建长度3容量5的切片。元素是零值0。参见 Go 规范 Making slices 章节。"
    topic: types
    chapter: slice

  - id: type-slice-028
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          s := []int{1, 2, 3, 4, 5}
          t := s[1:3]
          fmt.Println(len(t), cap(t))
      }
    options:
      - "A: 2 2"
      - "B: 2 4"
      - "C: 2 5"
      - "D: 3 4"
    answer: B
    explanation: "t=s[1:3]长度=3-1=2。容量从索引1到s末尾=5-1=4。参见 Go 规范 Slice expressions 章节。"
    topic: types
    chapter: slice

  - id: type-slice-029
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          s := []int{1, 2, 3}
          s = append(s, 4)
          fmt.Println(len(s), cap(s) >= 4)
      }
    options:
      - "A: 4 true"
      - "B: 4 false"
      - "C: 3 true"
      - "D: 5 true"
    answer: A
    explanation: "append添加一个元素,长度4。容量扩展(通常翻倍),至少4。参见 Go 规范 Appending to slices 章节。"
    topic: types
    chapter: slice

  - id: type-slice-030
    type: code_fix
    difficulty: medium
    stem: "以下代码有bug,正确的修正方案是?"
    code: |
      package main
      import "fmt"
      func addElement(s []int, x int) {
          s = append(s, x)
      }
      func main() {
          s := []int{1, 2, 3}
          addElement(s, 4)
          fmt.Println(len(s))
      }
    options:
      - "A: 返回新切片"
      - "B: 传切片指针"
      - "C: A或B"
      - "D: 代码正确"
    answer: C
    explanation: "append可能返回新切片,函数内修改不影响外部。应返回切片或传指针。参见 Go 规范 Appending to slices 章节。"
    topic: types
    chapter: slice

  - id: type-slice-031
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          a := [5]int{1, 2, 3, 4, 5}
          s := a[1:3:4]
          fmt.Println(len(s), cap(s))
      }
    options:
      - "A: 2 3"
      - "B: 2 4"
      - "C: 3 4"
      - "D: 2 2"
    answer: A
    explanation: "s[1:3:4]长度=3-1=2,容量=4-1=3。max限制了容量。参见 Go 规范 Slice expressions 章节。"
    topic: types
    chapter: slice

  - id: type-slice-032
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          s := []int{1, 2, 3}
          t := append(s[:1], s[2:]...)
          fmt.Println(t, s)
      }
    options:
      - "A: [1 3] [1 2 3]"
      - "B: [1 3] [1 3 3]"
      - "C: [1 2 3] [1 2 3]"
      - "D: [1 3] [1 3]"
    answer: B
    explanation: "s[:1]是[1],追加s[2:]=[3]得[1,3]。但这修改了原数组,s变为[1,3,3]。参见 Go 规范 Appending to slices 章节。"
    topic: types
    chapter: slice

  - id: type-slice-033
    type: multiple
    difficulty: medium
    stem: "关于切片扩容,以下说法正确的是?(多选)"
    options:
      - "A: 扩容会分配新数组"
      - "B: 扩容后与原数组脱钩"
      - "C: 必须使用append返回值"
      - "D: 扩容策略是固定的"
    answer: ABC
    explanation: "扩容分配新数组,与原数组脱钩。必须使用返回值。策略不固定(版本可能调整)。参见 Go 规范 Appending to slices 章节。"
    topic: types
    chapter: slice

  - id: type-slice-034
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          s := make([]int, 0, 5)
          s = append(s, 1, 2, 3)
          t := s
          s = append(s, 4)
          t = append(t, 5)
          fmt.Println(s[3], t[3])
      }
    options:
      - "A: 4 5"
      - "B: 5 5"
      - "C: 4 4"
      - "D: 5 4"
    answer: B
    explanation: "s和t共享底层数组(容量足够)。s追加4到[3]。t追加5覆盖[3]。最终s[3]=t[3]=5。参见 Go 规范 Appending to slices 章节。"
    topic: types
    chapter: slice

  - id: type-slice-035
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var s []int
          s = append(s, 1)
          fmt.Println(s, s == nil)
      }
    options:
      - "A: [1] true"
      - "B: [1] false"
      - "C: [] false"
      - "D: panic"
    answer: B
    explanation: "append可以作用于nil切片。返回新的非nil切片[1]。s不再是nil。参见 Go 规范 Appending to slices 章节。"
    topic: types
    chapter: slice

  - id: type-slice-036
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          s := []int{1, 2, 3, 4, 5}
          copy(s[1:], s[2:])
          fmt.Println(s)
      }
    options:
      - "A: [1 2 3 4 5]"
      - "B: [1 3 4 5 5]"
      - "C: [2 3 4 5 5]"
      - "D: panic"
    answer: B
    explanation: "copy(s[1:], s[2:])将[3,4,5]复制到[1:]位置。结果[1,3,4,5,5]。参见 Go 规范 Appending and copying slices 章节。"
    topic: types
    chapter: slice

  - id: type-slice-037
    type: code_fix
    difficulty: medium
    stem: "以下代码效率低,正确的优化方案是?"
    code: |
      package main
      func main() {
          var s []int
          for i := 0; i < 10000; i++ {
              s = append(s, i)
          }
      }
    options:
      - "A: s := make([]int, 0, 10000)"
      - "B: s := make([]int, 10000)"
      - "C: A更好(预分配容量)"
      - "D: B更好(预分配长度)"
    answer: C
    explanation: "预分配容量避免多次扩容。make([]int, 0, 10000)更合适(用append)。B需要索引赋值。参见 Go 性能优化最佳实践。"
    topic: types
    chapter: slice

  - id: type-slice-038
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          s := []int{1, 2, 3}
          fmt.Printf("%p %p\n", s, &s[0])
      }
    options:
      - "A: 相同地址"
      - "B: 不同地址"
