  - id: type-infer-020
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func F[T any](x T) T { return x }
      func main() {
          fmt.Printf("%T\n", F(42))
      }
    options:
      - "A: int"
      - "B: T"
      - "C: any"
      - "D: 编译错误"
    answer: A
    explanation: "F(42)中T推断为int。返回int类型。%T打印int。参见 Go 规范 Type inference 章节。"
    topic: types
    chapter: type_inference

