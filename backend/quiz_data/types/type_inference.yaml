  # ========== 困难题 (Hard) - 4道 ==========

  - id: type-infer-032
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type Ptr[T any] interface{ *T }
      func Get[T any, P Ptr[T]](p P) T { return *p }
      func main() {
          x := 10
          fmt.Println(Get(&x))
      }
    options:
      - "A: 10"
      - "B: 编译错误(无法推断)"
      - "C: 0"
      - "D: &10"
    answer: A
    explanation: "从&x推断P=*int,从Ptr约束推断T=int。Get返回*p=10。参见 Go 规范 Constraint type inference 章节。"
    topic: types
    chapter: type_inference

  - id: type-infer-033
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func Map[S ~[]E, E any](s S, f func(E) E) S {
          r := make(S, len(s))
          for i, v := range s {
              r[i] = f(v)
          }
          return r
      }
      func main() {
          s := []int{1, 2, 3}
          r := Map(s, func(x int) int { return x * 2 })
          fmt.Println(r)
      }
    options:
      - "A: [2 4 6]"
      - "B: [1 2 3]"
      - "C: 编译错误"
      - "D: [0 0 0]"
    answer: A
    explanation: "从s推断S=[]int,从~[]E推断E=int。Map将每个元素*2。参见 Go 规范 Constraint type inference 章节。"
    topic: types
    chapter: type_inference

  - id: type-infer-034
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func Convert[To, From any](s []From, f func(From) To) []To {
          r := make([]To, len(s))
          for i, v := range s {
              r[i] = f(v)
          }
          return r
      }
      func main() {
          nums := []int{1, 2, 3}
          strs := Convert(nums, func(n int) string {
              return fmt.Sprintf("%d", n)
          })
          fmt.Printf("%T %v\n", strs, strs)
      }
    options:
      - "A: []string [1 2 3]"
      - "B: []int [1 2 3]"
      - "C: 编译错误"
      - "D: []any [1 2 3]"
    answer: A
    explanation: "从nums推断From=int,从f返回值推断To=string。strs是[]string。参见 Go 规范 Type inference 章节。"
    topic: types
    chapter: type_inference

  - id: type-infer-035
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type Slice[T any] []T
      func (s Slice[T]) Map(f func(T) T) Slice[T] {
          r := make(Slice[T], len(s))
          for i, v := range s {
              r[i] = f(v)
          }
          return r
      }
      func main() {
          s := Slice[int]{1, 2, 3}
          r := s.Map(func(x int) int { return x + 1 })
          fmt.Println(r)
      }
    options:
      - "A: [2 3 4]"
      - "B: [1 2 3]"
      - "C: 编译错误"
      - "D: Slice[int]{2 3 4}"
    answer: A
    explanation: "s是Slice[int],T已确定为int。Map将每个元素+1。输出[2 3 4]。参见 Go 规范 Type inference 章节。"
    topic: types
    chapter: type_inference
