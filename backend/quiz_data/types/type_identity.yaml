  # ========== 中等题 (Medium) - 12道 ==========

  - id: type-ident-020
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type A int
      type B int
      func main() {
          var a A = 1
          var b B = 1
          fmt.Println(a == A(b))
      }
    options:
      - "A: true"
      - "B: false"
      - "C: 编译错误"
      - "D: panic"
    answer: A
    explanation: "A和B不同类型,需要转换。A(b)=1,a=1。转换后可比较,相等。参见 Go 规范 Comparison operators 章节。"
    topic: types
    chapter: type_identity

  - id: type-ident-021
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var x []int
          var y []int
          fmt.Println(x == nil, y == nil)
      }
    options:
      - "A: true true"
      - "B: false false"
      - "C: 编译错误"
      - "D: true false"
    answer: A
    explanation: "两个[]int是同一类型。未初始化都是nil。可以与nil比较。参见 Go 规范 Comparison operators 章节。"
    topic: types
    chapter: type_identity

  - id: type-ident-022
    type: code_fix
    difficulty: medium
    stem: "以下代码编译错误,正确的修正是?"
    code: |
      package main
      type A int
      type B int
      func F(a A) {}
      func main() {
          var b B = 10
          F(b)
      }
    options:
      - "A: F(A(b))"
      - "B: F(int(b))"
      - "C: 将B改为A"
      - "D: A或C"
    answer: D
    explanation: "A和B是不同类型。需要转换A(b)或改变b的类型。参见 Go 规范 Type identity 章节。"
    topic: types
    chapter: type_identity

  - id: type-ident-023
