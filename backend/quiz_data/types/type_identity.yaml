  # ========== 困难题 (Hard) - 4道 ==========

  - id: type-ident-032
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type A struct{ x int }
      type B struct{ x int }
      func main() {
          a := A{1}
          b := struct{ x int }{1}
          fmt.Println(a == A(b))
      }
    options:
      - "A: true"
      - "B: false"
      - "C: 编译错误"
      - "D: panic"
    answer: A
    explanation: "A底层是struct{x int}。b是该字面量类型。A(b)转换成功。相等。参见 Go 规范 Conversions 章节。"
    topic: types
    chapter: type_identity

  - id: type-ident-033
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import (
          "fmt"
          "reflect"
      )
      type A int
      type B = A
      func main() {
          var b B = 10
          t := reflect.TypeOf(b)
          fmt.Println(t.Name(), t.Kind())
      }
    options:
      - "A: A int"
      - "B: B int"
      - "C: int int"
      - "D: A A"
    answer: A
    explanation: "B是A的别名,运行时类型是A。Kind是底层类型int。参见 Go reflect包文档。"
    topic: types
    chapter: type_identity

  - id: type-ident-034
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type I1 interface{ M() }
      type I2 interface{ M() }
      type T struct{}
      func (T) M() {}
      func F(i I1) { fmt.Print("I1") }
      func main() {
          var i2 I2 = T{}
          F(i2)
      }
    options:
      - "A: I1"
      - "B: I2"
      - "C: 编译错误"
      - "D: panic"
    answer: A
    explanation: "I1和I2方法集相同,是同一类型。i2(类型I2)可以传给F(参数I1)。输出I1。参见 Go 规范 Type identity 章节。"
    topic: types
    chapter: type_identity

