    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          type S1 struct{ X int }
          type S2 struct{ X int }
          var s1 S1 = S1{1}
          var s2 S2 = S2(s1)
          fmt.Println(s2.X)
      }
    options:
      - "A: 1"
      - "B: 编译错误"
      - "C: 0"
      - "D: S2{1}"
