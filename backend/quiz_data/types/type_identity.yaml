    code: |
      package main
      import "fmt"
      func main() {
          type A = int
          type B = int
          var a A = 1
          var b B = a
          fmt.Println(b)
      }
    options:
      - "A: 1"
      - "B: 编译错误"
      - "C: 0"
      - "D: int(1)"
    answer: A
    explanation: "A和B都是int的别名,都是同一类型int。可以直接赋值。b=1。参见 Go 规范 Alias declarations 章节。"
    topic: types
    chapter: type_identity

