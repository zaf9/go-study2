  # ========== 简单题 (Easy) - 19道 ==========
  
  - id: type-ident-001
    type: single
    difficulty: easy
    stem: "Go中什么是类型同一性(type identity)?"
    options:
      - "A: 类型名称相同"
      - "B: 两个类型完全相同"
      - "C: 底层类型相同"
      - "D: 可以相互转换"
    answer: B
    explanation: "类型同一性是指两个类型完全相同,可以相互赋值无需转换。参见 Go 规范 Type identity 章节。"
    topic: types
    chapter: type_identity

  - id: type-ident-002
    type: single
    difficulty: easy
    stem: "定义类型type A int和type B int,A和B是同一类型吗?"
    options:
      - "A: 是"
      - "B: 不是"
      - "C: 取决于上下文"
      - "D: 取决于值"
    answer: B
    explanation: "每个type定义创建新的不同类型。A和B是不同类型。参见 Go 规范 Type identity 章节。"
    topic: types
    chapter: type_identity

  - id: type-ident-003
    type: single
    difficulty: easy
    stem: "类型别名type A = int,A和int是同一类型吗?"
    options:
      - "A: 不是"
      - "B: 是"
      - "C: 部分相同"
      - "D: 取决于包"
    answer: B
    explanation: "类型别名不创建新类型。A就是int,是同一类型。参见 Go 规范 Alias declarations 章节。"
    topic: types
    chapter: type_identity

