  # ========== 困难题 (Hard) - 4道 ==========

  - id: type-unify-030
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func F[S ~[]E, E any](s S) E {
          return s[0]
      }
      type MySlice []int
      func main() {
          s := MySlice{10, 20, 30}
          fmt.Println(F(s))
      }
    options:
      - "A: 10"
      - "B: [10 20 30]"
      - "C: 编译错误"
      - "D: MySlice"
    answer: A
    explanation: "MySlice底层是[]int。S=MySlice,从~[]E推断E=int。返回s[0]=10。参见 Go 规范 Constraint type inference 章节。"
    topic: types
    chapter: type_unification

  - id: type-unify-031
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type Ptr[T any] interface { *T }
      func Deref[T any, P Ptr[T]](p P) T { return *p }
      func main() {
          x := 42
          fmt.Println(Deref(&x))
      }
    options:
      - "A: 42"
      - "B: 编译错误(无法推断)"
      - "C: &42"
      - "D: 0"
    answer: A
    explanation: "从&x推断P=*int。从Ptr[T]约束*T=*int推断T=int。返回*p=42。参见 Go 规范 Constraint type inference 章节。"
    topic: types
    chapter: type_unification

  - id: type-unify-032
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func F[M ~map[K]V, K comparable, V any](m M) []K {
          keys := make([]K, 0, len(m))
          for k := range m {
              keys = append(keys, k)
          }
          return keys
      }
      type MyMap map[string]int
      func main() {
          m := MyMap{"a": 1, "b": 2}
          fmt.Printf("%T\n", F(m))
      }
    options:
      - "A: []string"
      - "B: []K"
      - "C: 编译错误"
      - "D: []interface{}"
    answer: A
    explanation: "M=MyMap,~map[K]V推断K=string,V=int。返回[]string。参见 Go 规范 Constraint type inference 章节。"
    topic: types
    chapter: type_unification

  - id: type-unify-033
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func Reduce[S ~[]E, E, R any](s S, init R, f func(R, E) R) R {
          acc := init
          for _, v := range s {
              acc = f(acc, v)
          }
          return acc
      }
      func main() {
          nums := []int{1, 2, 3, 4, 5}
          sum := Reduce(nums, 0, func(a, b int) int { return a + b })
          fmt.Println(sum)
      }
    options:
      - "A: 15"
      - "B: 0"
      - "C: 编译错误"
      - "D: 5"
    answer: A
    explanation: "S=[]int推断E=int。init=0和f返回值推断R=int。累加1+2+3+4+5=15。参见 Go 规范 Type unification 章节。"
    topic: types
    chapter: type_unification
