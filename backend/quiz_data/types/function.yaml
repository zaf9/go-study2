  # ========== 困难题 (Hard) - 4道 ==========

  - id: type-func-037
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func f() (r int) {
          t := 5
          defer func() {
              t = t + 5
          }()
          return t
      }
      func main() {
          fmt.Println(f())
      }
    options:
      - "A: 5"
      - "B: 10"
      - "C: 0"
      - "D: 15"
    answer: A
    explanation: "return t设置r=5。defer修改的是t不是r。返回5。参见 Go 规范 Defer statements 章节。"
    topic: types
    chapter: function

  - id: type-func-038
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func f() (r int) {
          defer func(r int) {
              r = r + 5
          }(r)
          return 1
      }
      func main() {
          fmt.Println(f())
      }
    options:
      - "A: 1"
      - "B: 5"
      - "C: 6"
      - "D: 0"
    answer: A
    explanation: "defer参数r立即求值(0)。defer内r是参数副本,修改不影响命名返回值r。返回1。参见 Go 规范 Defer statements 章节。"
    topic: types
    chapter: function

  - id: type-func-039
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          defer func() {
              if r := recover(); r != nil {
                  fmt.Print("recovered ")
              }
          }()
          defer func() {
              panic("second")
          }()
          panic("first")
      }
    options:
      - "A: recovered"
      - "B: recovered first"
      - "C: recovered second"
      - "D: panic: first"
    answer: C
    explanation: "first panic触发defer。第二个defer再次panic(second)覆盖first。第一个defer recover得到second。参见 Go 规范 Handling panics 章节。"
    topic: types
    chapter: function

