    code: |
      package main
      import "fmt"
      type F func() F
      func main() {
          var f F
          f = func() F {
              fmt.Print("a")
              return func() F {
                  fmt.Print("b")
                  return nil
              }
          }
          f()()
      }
    options:
      - "A: a"
      - "B: ab"
      - "C: ba"
      - "D: 编译错误"
