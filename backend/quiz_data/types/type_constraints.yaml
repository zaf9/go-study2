questions:
  # ========== 简单题 (Easy) - 22道 ==========
  
  - id: type-const-001
    type: single
    difficulty: easy
    stem: "Go中类型约束必须是什么类型?"
    options:
      - "A: 结构体"
      - "B: 接口"
      - "C: 函数"
      - "D: 任何类型"
    answer: B
    explanation: "类型约束必须是接口类型。any(interface{})是最基础的约束。参见 Go 规范 Type constraints 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-002
    type: single
    difficulty: easy
    stem: "any约束等价于什么?"
    options:
      - "A: object"
      - "B: interface{}"
      - "C: void"
      - "D: *interface{}"
    answer: B
    explanation: "any是interface{}的类型别名,允许任何类型。参见 Go 规范 Predeclared identifiers 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-003
    type: single
    difficulty: easy
    stem: "comparable约束允许什么操作?"
    options:
      - "A: 加减运算"
      - "B: 相等比较"
      - "C: 大小比较"
      - "D: 所有操作"
    answer: B
    explanation: "comparable只允许==和!=比较。不支持<、>等。参见 Go 规范 comparable constraint 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-004
    type: single
    difficulty: easy
    stem: "约束中|符号表示什么?"
    options:
      - "A: 与"
      - "B: 或(联合)"
      - "C: 非"
      - "D: 异或"
    answer: B
    explanation: "|表示类型联合,类型参数可以是任一类型。如int|string。参见 Go 规范 Union elements 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-005
    type: single
    difficulty: easy
    stem: "约束中~符号表示什么?"
    options:
      - "A: 近似"
      - "B: 底层类型近似"
      - "C: 指针类型"
      - "D: 取反"
    answer: B
    explanation: "~T表示底层类型是T的所有类型。如~int包括int和type MyInt int。参见 Go 规范 Type approximation 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-006
    type: single
    difficulty: easy
    stem: "interface{~int|~string}约束表示什么?"
    options:
      - "A: 只能是int或string"
      - "B: 底层类型是int或string"
      - "C: 可以转换为int或string"
      - "D: 包含int和string方法"
    answer: B
    explanation: "底层类型是int或string的所有类型都满足约束。参见 Go 规范 Union elements 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-007
    type: single
    difficulty: easy
    stem: "以下哪个类型不满足comparable约束?"
    options:
      - "A: int"
      - "B: string"
      - "C: []int"
      - "D: struct{X int}"
    answer: C
    explanation: "切片不可比较,不满足comparable。int、string、结构体(字段可比)可比较。参见 Go 规范 comparable constraint 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-008
    type: single
    difficulty: easy
    stem: "约束接口可以包含方法吗?"
    options:
      - "A: 不可以"
      - "B: 可以"
      - "C: 只能一个"
      - "D: 只能嵌入"
    answer: B
    explanation: "约束接口可以包含方法。如interface{Less(T)bool}。参见 Go 规范 Interface types 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-009
    type: single
    difficulty: easy
    stem: "约束可以嵌入其他接口吗?"
    options:
      - "A: 不可以"
      - "B: 可以"
      - "C: 只有any"
      - "D: 只有comparable"
    answer: B
    explanation: "约束可以嵌入其他接口,组合多个约束。参见 Go 规范 Interface types 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-010
    type: single
    difficulty: easy
    stem: "interface{int|string; M()}约束表示什么?"
    options:
      - "A: 是int或string并有M方法"
      - "B: int或string类型"
      - "C: 任何有M方法的类型"
      - "D: 编译错误"
    answer: A
    explanation: "多个元素用分号或换行分隔,表示交集(全部满足)。参见 Go 规范 Interface types 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-011
    type: single
    difficulty: easy
    stem: "只包含类型元素的接口可以作为变量类型吗?"
    options:
      - "A: 可以"
      - "B: 不可以"
      - "C: Go 1.20+可以"
      - "D: 只能comparable"
    answer: B
    explanation: "含类型元素的接口只能用作约束,不能作为变量类型。参见 Go 规范 General interfaces 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-012
    type: single
    difficulty: easy
    stem: "comparable约束的底层类型是什么?"
    options:
      - "A: interface{}"
      - "B: 特殊内置接口"
      - "C: any"
      - "D: struct{}"
    answer: B
    explanation: "comparable是特殊的预声明接口,不能用普通接口表示。参见 Go 规范 Predeclared identifiers 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-013
    type: single
    difficulty: easy
    stem: "以下哪个是有效的类型约束?"
    options:
      - "A: int"
      - "B: ~int"
      - "C: interface{~int}"
      - "D: 全部有效"
    answer: D
    explanation: "单个类型、近似类型、包含它们的接口都可以作为约束。参见 Go 规范 Type constraints 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-014
    type: single
    difficulty: easy
    stem: "约束中可以使用类型字面量吗?"
    options:
      - "A: 不可以"
      - "B: 可以"
      - "C: 只有struct"
      - "D: 只有interface"
    answer: B
    explanation: "可以使用类型字面量作为约束元素。如interface{struct{X int}}。参见 Go 规范 Type constraints 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-015
    type: multiple
    difficulty: easy
    stem: "关于类型约束,以下说法正确的是?(多选)"
    options:
      - "A: 必须是接口"
      - "B: 可以含类型元素"
      - "C: 可以含方法"
      - "D: 可以嵌入接口"
    answer: ABCD
    explanation: "约束是接口,可含类型元素、方法,可嵌入其他接口。参见 Go 规范 Interface types 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-016
    type: single
    difficulty: easy
    stem: "~int可以单独作为约束吗?"
    options:
      - "A: 可以"
      - "B: 不可以"
      - "C: 需要包在interface里"
      - "D: A和C都对"
    answer: D
    explanation: "~int可以直接作为约束(隐式包装为接口),也可以显式interface{~int}。参见 Go 规范 Type constraints 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-017
    type: single
    difficulty: easy
    stem: "int|string可以直接作为约束吗?"
    options:
      - "A: 可以"
      - "B: 不可以"
      - "C: 需要包在interface里"
      - "D: A和C都对"
    answer: D
    explanation: "联合类型可以直接作为约束,编译器隐式包装为接口。参见 Go 规范 Type constraints 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-018
    type: single
    difficulty: easy
    stem: "约束中多个方法是什么关系?"
    options:
      - "A: 或(任一)"
      - "B: 与(全部)"
      - "C: 互斥"
      - "D: 无关系"
    answer: B
    explanation: "约束中的多个方法是交集,类型必须实现所有方法。参见 Go 规范 Interface types 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-019
    type: single
    difficulty: easy
    stem: "约束中类型联合和方法是什么关系?"
    options:
      - "A: 或(任一)"
      - "B: 与(全部满足)"
      - "C: 独立"
      - "D: 方法优先"
    answer: B
    explanation: "类型必须在联合类型中,且必须实现所有方法。参见 Go 规范 Interface types 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-020
    type: multiple
    difficulty: easy
    stem: "以下哪些类型满足comparable约束?(多选)"
    options:
      - "A: int"
      - "B: string"
      - "C: [3]int"
      - "D: map[string]int"
    answer: ABC
    explanation: "int、string、数组可比较。map不可比较。参见 Go 规范 comparable constraint 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-021
    type: single
    difficulty: easy
    stem: "cmp.Ordered约束(标准库)支持哪些操作?"
    options:
      - "A: 只有=="
      - "B: ==和<、>等"
      - "C: 只有<、>"
      - "D: 所有算术"
    answer: B
    explanation: "cmp.Ordered支持比较操作符包括==、<、>等。参见 Go cmp包文档。"
    topic: types
    chapter: type_constraints

  - id: type-const-022
    type: single
    difficulty: easy
    stem: "空接口interface{}作为约束的含义是?"
    options:
      - "A: 不允许任何类型"
      - "B: 允许任何类型"
      - "C: 只允许接口"
      - "D: 编译错误"
    answer: B
    explanation: "空接口允许任何类型,等价于any约束。参见 Go 规范 Type constraints 章节。"
    topic: types
    chapter: type_constraints

  # ========== 中等题 (Medium) - 13道 ==========

  - id: type-const-023
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type Signed interface {
          ~int | ~int8 | ~int16 | ~int32 | ~int64
      }
      func Abs[T Signed](x T) T {
          if x < 0 {
              return -x
          }
          return x
      }
      func main() {
          fmt.Println(Abs(-5))
      }
    options:
      - "A: 5"
      - "B: -5"
      - "C: 编译错误"
      - "D: 0"
    answer: A
    explanation: "Signed约束支持<和-操作。Abs(-5)返回5。参见 Go 规范 Type constraints 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-024
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type Stringer interface {
          String() string
      }
      func Print[T Stringer](x T) {
          fmt.Println(x.String())
      }
      type MyInt int
      func (m MyInt) String() string { return "MyInt" }
      func main() {
          Print(MyInt(10))
      }
    options:
      - "A: MyInt"
      - "B: 10"
      - "C: 编译错误"
      - "D: <nil>"
    answer: A
    explanation: "MyInt实现了Stringer。Print调用String()返回MyInt。参见 Go 规范 Type constraints 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-025
    type: code_fix
    difficulty: medium
    stem: "以下代码编译错误,正确的修正是?"
    code: |
      package main
      func Max[T any](a, b T) T {
          if a > b {
              return a
          }
          return b
      }
    options:
      - "A: T comparable"
      - "B: T interface{~int|~float64}"
      - "C: T cmp.Ordered"
      - "D: B或C"
    answer: D
    explanation: "any不支持>操作。需要支持排序的约束如cmp.Ordered或自定义联合类型。参见 Go 规范 Type constraints 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-026
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type Number interface {
          ~int | ~float64
      }
      type MyFloat float64
      func Add[T Number](a, b T) T {
          return a + b
      }
      func main() {
          fmt.Println(Add(MyFloat(1.5), MyFloat(2.5)))
      }
    options:
      - "A: 4"
      - "B: 4.0"
      - "C: 编译错误"
      - "D: 3.0"
    answer: A
    explanation: "MyFloat底层是float64满足~float64。Add(1.5,2.5)=4.0,打印4。参见 Go 规范 Type constraints 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-027
    type: multiple
    difficulty: medium
    stem: "以下约束中,int类型满足哪些?(多选)"
    options:
      - "A: any"
      - "B: comparable"
      - "C: ~int"
      - "D: interface{~int|~string; Less(int)bool}"
    answer: ABC
    explanation: "int满足any、comparable、~int。不满足D因为int没有Less方法。参见 Go 规范 Type constraints 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-028
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type Constraint interface {
          comparable
          String() string
      }
      type S string
      func (s S) String() string { return string(s) }
      func F[T Constraint](x T) string { return x.String() }
      func main() {
          fmt.Println(F(S("hello")))
      }
    options:
      - "A: hello"
      - "B: S"
      - "C: 编译错误"
      - "D: string"
    answer: A
    explanation: "S满足comparable且有String方法。F(S(hello))返回hello。参见 Go 规范 Type constraints 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-029
    type: code_fix
    difficulty: medium
    stem: "以下代码编译错误,正确的修正是?"
    code: |
      package main
      type Numeric interface {
          int | float64
      }
      var x Numeric = 10
    options:
      - "A: 改为any"
      - "B: 不能用约束接口作变量类型"
      - "C: 移除类型元素"
      - "D: B正确,C是解决方案"
    answer: D
    explanation: "含类型元素的接口只能用作约束。要作变量类型需移除类型元素。参见 Go 规范 General interfaces 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-030
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type Ptr[T any] interface { *T }
      func Zero[T any, P Ptr[T]](p P) T { return *p }
      func main() {
          x := 10
          fmt.Println(Zero[int, *int](&x))
      }
    options:
      - "A: 10"
      - "B: 0"
      - "C: 编译错误"
      - "D: panic"
    answer: A
    explanation: "P是*T的约束。Zero解引用指针返回值10。参见 Go 规范 Type constraints 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-031
    type: multiple
    difficulty: medium
    stem: "关于泛型约束接口,以下说法正确的是?(多选)"
    options:
      - "A: 可以组合类型和方法"
      - "B: 可以嵌入comparable"
      - "C: 含类型元素不能作变量类型"
      - "D: 支持~近似类型"
    answer: ABCD
    explanation: "约束接口支持类型元素、方法、嵌入、近似类型。含类型元素只能作约束。参见 Go 规范 Interface types 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-032
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type Integer interface { ~int | ~int64 }
      type Float interface { ~float32 | ~float64 }
      type Number interface { Integer | Float }
      func Add[T Number](a, b T) T { return a + b }
      func main() {
          fmt.Println(Add(1.5, 2.5))
      }
    options:
      - "A: 4"
      - "B: 4.0"
      - "C: 编译错误"
      - "D: 3.0"
    answer: A
    explanation: "Number是Integer和Float的联合。1.5是float64满足Float。Add=4。参见 Go 规范 Type constraints 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-033
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func Contains[T comparable](s []T, v T) bool {
          for _, x := range s {
              if x == v {
                  return true
              }
          }
          return false
      }
      func main() {
          fmt.Println(Contains([]string{"a", "b", "c"}, "b"))
      }
    options:
      - "A: true"
      - "B: false"
      - "C: 编译错误"
      - "D: 1"
    answer: A
    explanation: "string满足comparable。b在切片中,返回true。参见 Go 规范 comparable constraint 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-034
    type: code_fix
    difficulty: medium
    stem: "以下代码编译错误,如何修正?"
    code: |
      package main
      func Sum[T any](s []T) T {
          var sum T
