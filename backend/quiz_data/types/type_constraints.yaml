      package main
      import "fmt"
      type Elem[T any] interface { *T | []T }
      func First[T any, E Elem[T]](e E) T {
          switch v := any(e).(type) {
          case *T:
              return *v
          case []T:
              return v[0]
          }
          var zero T
          return zero
      }
      func main() {
          s := []int{1, 2, 3}
          fmt.Println(First[int, []int](s))
      }
