      package main
      import "fmt"
      type Ordered interface { ~int | ~float64 | ~string }
      func Min[T Ordered](a, b T) T {
          if a < b { return a }
          return b
      }
      func main() {
          fmt.Println(Min("apple", "banana"))
      }
    options:
