  # ========== 困难题 (Hard) - 5道 ==========

  - id: type-const-036
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type Setter[T any] interface {
          Set(T)
          *T
      }
      func Set[T any, PT Setter[T]](p PT, v T) {
          p.Set(v)
      }
      type MyInt int
      func (m *MyInt) Set(v int) { *m = MyInt(v) }
      func main() {
          var x MyInt
          Set[MyInt, *MyInt](&x, 10)
          fmt.Println(x)
      }
    options:
      - "A: 10"
      - "B: 0"
      - "C: 编译错误"
      - "D: panic"
    answer: A
    explanation: "*MyInt满足Setter[int](是*MyInt且有Set方法)。Set修改x为10。参见 Go 规范 Type constraints 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-037
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type A interface{ ~int; M() }
      type B interface{ ~int | ~string }
      type C interface{ A; B }
      type MyInt int
      func (MyInt) M() {}
      func F[T C](x T) { fmt.Println("ok") }
      func main() {
          F(MyInt(1))
      }
    options:
      - "A: ok"
      - "B: 编译错误(MyInt不满足C)"
      - "C: 编译错误(C无效)"
      - "D: panic"
    answer: A
    explanation: "C要求~int且有M(),且是~int或~string。MyInt满足所有条件。输出ok。参见 Go 规范 Type constraints 章节。"
    topic: types
    chapter: type_constraints

  - id: type-const-038
    type: code_output
    difficulty: hard
