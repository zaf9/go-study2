  - id: type-param-036
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type Number interface {
          ~int | ~float64
      }
      func Sum[T Number](nums []T) T {
          var sum T
          for _, n := range nums {
              sum += n
          }
          return sum
      }
      func main() {
          fmt.Println(Sum([]float64{1.1, 2.2, 3.3}))
      }
    options:
      - "A: 6.6"
      - "B: 6"
      - "C: 6.600000000000001"
      - "D: 编译错误"
    answer: A
    explanation: "Number约束允许+操作。Sum计算切片总和。1.1+2.2+3.3=6.6。参见 Go 规范 Type constraints 章节。"
    topic: types
    chapter: type_parameters

  - id: type-param-037
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func Map[T, U any](s []T, f func(T) U) []U {
          r := make([]U, len(s))
          for i, v := range s {
              r[i] = f(v)
          }
          return r
      }
      func main() {
          nums := []int{1, 2, 3}
          strs := Map(nums, func(n int) string {
              return fmt.Sprintf("%d", n)
          })
          fmt.Println(strs)
      }
    options:
      - "A: [1 2 3]"
      - "B: [\"1\" \"2\" \"3\"]"
      - "C: 编译错误"
      - "D: panic"
