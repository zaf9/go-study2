  - id: type-param-034
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func Filter[T any](s []T, f func(T) bool) []T {
          var result []T
          for _, v := range s {
              if f(v) {
                  result = append(result, v)
              }
          }
          return result
      }
      func main() {
          nums := []int{1, 2, 3, 4, 5}
          evens := Filter(nums, func(n int) bool { return n%2 == 0 })
          fmt.Println(evens)
      }
    options:
      - "A: [2 4]"
      - "B: [1 3 5]"
      - "C: 编译错误"
      - "D: []"
    answer: A
    explanation: "Filter保留满足条件的元素。偶数是2和4。输出[2 4]。参见 Go 规范 Type inference 章节。"
    topic: types
    chapter: type_parameters

