  - id: type-param-026
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type Stack[T any] struct {
          items []T
      }
      func (s *Stack[T]) Push(item T) {
          s.items = append(s.items, item)
      }
      func (s *Stack[T]) Pop() T {
          n := len(s.items)
          item := s.items[n-1]
          s.items = s.items[:n-1]
          return item
      }
      func main() {
          s := &Stack[int]{}
          s.Push(10)
          s.Push(20)
          fmt.Println(s.Pop())
      }
    options:
      - "A: 10"
      - "B: 20"
      - "C: 编译错误"
      - "D: panic"
    answer: B
    explanation: "栈后进先出。Push(10),Push(20)后Pop()返回20。参见 Go 规范 Type parameters 章节。"
    topic: types
    chapter: type_parameters

