  # ========== 简单题 (Easy) - 23道 ==========
  
  - id: type-param-001
    type: single
    difficulty: easy
    stem: "Go中类型参数使用什么语法声明?"
    options:
      - "A: func F<T>(x T)"
      - "B: func F[T any](x T)"
      - "C: func F(T)(x T)"
      - "D: func F{T}(x T)"
    answer: B
    explanation: "Go使用方括号[]声明类型参数。func F[T any](x T)是正确语法。参见 Go 规范 Type parameter declarations 章节。"
    topic: types
    chapter: type_parameters

  - id: type-param-002
    type: single
    difficulty: easy
    stem: "any约束表示什么?"
    options:
      - "A: 只有基本类型"
      - "B: 任何类型"
      - "C: 只有接口"
      - "D: 只有结构体"
    answer: B
    explanation: "any是interface{}的别名,允许任何类型。参见 Go 规范 Type constraints 章节。"
    topic: types
    chapter: type_parameters

