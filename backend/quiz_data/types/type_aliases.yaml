    chapter: type_aliases

  # ========== 困难题 (Hard) - 4道 ==========

  - id: type-alias-032
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import (
          "fmt"
          "reflect"
      )
      type Original struct{ X int }
      type Alias = Original
      func main() {
          var a Alias
          t := reflect.TypeOf(a)
          fmt.Println(t.Name(), t.PkgPath())
      }
    options:
      - "A: Alias main"
      - "B: Original main"
      - "C: Original "
      - "D: Alias "
    answer: B
    explanation: "Alias是Original的别名。reflect返回Original和包路径main。参见 Go reflect包文档。"
    topic: types
    chapter: type_aliases

  - id: type-alias-033
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type A = struct{ X int }
      type B struct{ X int }
      func main() {
          a := A{1}
          b := B{1}
          fmt.Println(a == A(b))
      }
    options:
      - "A: true"
      - "B: false"
      - "C: 编译错误"
      - "D: panic"
    answer: A
    explanation: "A是struct{X int}别名,B是新类型。底层相同可转换。A(b)={1},a={1}。相等。参见 Go 规范 Conversions 章节。"
    topic: types
    chapter: type_aliases

  - id: type-alias-034
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type T struct{ X int }
      type A = *T
      func main() {
          t := T{1}
          var a A = &t
          fmt.Printf("%T %v\n", a, a.X)
      }
    options:
      - "A: *main.T 1"
      - "B: main.A 1"
      - "C: A 1"
      - "D: 编译错误"
    answer: A
    explanation: "A是*T的别名。运行时类型是*main.T。a.X=1。参见 Go 规范 Alias declarations 章节。"
    topic: types
    chapter: type_aliases

  - id: type-alias-035
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type I interface{ M() }
      type A = I
      type S struct{}
      func (S) M() {}
      func main() {
          var a A = S{}
          switch a.(type) {
          case S:
              fmt.Print("S")
          case A:
              fmt.Print("A")
          }
      }
    options:
      - "A: S"
      - "B: A"
      - "C: SA"
      - "D: 编译错误"
    answer: A
    explanation: "a的动态类型是S。type switch匹配S。A是接口类型不能作为case。输出S。参见 Go 规范 Type switches 章节。"
    topic: types
    chapter: type_aliases
