    topic: types
    chapter: type_aliases

  - id: type-alias-031
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type T int
      type A = T
      func (t T) M() int { return int(t) }
      func main() {
          var a A = 10
          fmt.Println(a.M())
      }
    options:
      - "A: 10"
      - "B: 0"
      - "C: 编译错误"
      - "D: nil"
    answer: A
    explanation: "A是T的别名。T有方法M。a.M()调用T的方法返回10。参见 Go 规范 Alias declarations 章节。"
