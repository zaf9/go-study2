  # ========== 困难题 (Hard) - 4道 ==========

  - id: type-arr-035
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          a := [3]int{1, 2, 3}
          p := &a
          (*p)[0] = 100
          fmt.Println(a, p[0])
      }
    options:
      - "A: [100 2 3] 100"
      - "B: [1 2 3] 100"
      - "C: [100 2 3] 1"
      - "D: 编译错误"
    answer: A
    explanation: "p是数组指针。(*p)[0]和p[0]都能访问元素(指针自动解引用)。a[0]变为100。参见 Go 规范 Pointer types 章节。"
    topic: types
    chapter: array

