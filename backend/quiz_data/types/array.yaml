  # ========== 简单题 (Easy) - 23道 ==========
  
  - id: type-arr-001
    type: single
    difficulty: easy
    stem: "Go中如何声明一个长度为5的int数组?"
    options:
      - "A: var a []int = [5]int{}"
      - "B: var a [5]int"
      - "C: var a array[5]int"
      - "D: var a = new int[5]"
    answer: B
    explanation: "Go数组语法是[N]T。var a [5]int声明长度5的int数组。参见 Go 规范 Array types 章节。"
    topic: types
    chapter: array

  - id: type-arr-002
    type: single
    difficulty: easy
    stem: "数组长度是类型的一部分吗?"
    options:
      - "A: 是"
      - "B: 不是"
      - "C: 取决于声明方式"
      - "D: 只在编译时"
    answer: A
    explanation: "[3]int和[4]int是不同类型。数组长度是类型的一部分,必须是编译时常量。参见 Go 规范 Array types 章节。"
    topic: types
    chapter: array

  - id: type-arr-003
    type: single
    difficulty: easy
    stem: "[3]int和[4]int可以互相赋值吗?"
    options:
      - "A: 可以"
      - "B: 不可以"
      - "C: 需要转换"
      - "D: 自动截断"
    answer: B
    explanation: "[3]int和[4]int是不同类型,不能互相赋值。参见 Go 规范 Array types 章节。"
    topic: types
    chapter: array

  - id: type-arr-004
    type: single
    difficulty: easy
    stem: "数组的零值是什么?"
    options:
      - "A: nil"
      - "B: 空数组"
      - "C: 元素全为零值"
      - "D: undefined"
    answer: C
    explanation: "数组的零值是所有元素都为元素类型零值的数组。数组不能是nil。参见 Go 规范 The zero value 章节。"
    topic: types
    chapter: array

  - id: type-arr-005
    type: single
    difficulty: easy
    stem: "var a [3]int声明后a[0]的值是什么?"
    options:
      - "A: nil"
      - "B: undefined"
      - "C: 0"
      - "D: 随机值"
    answer: C
    explanation: "数组元素初始化为零值。int的零值是0。参见 Go 规范 The zero value 章节。"
    topic: types
    chapter: array

  - id: type-arr-006
    type: single
    difficulty: easy
    stem: "如何用字面量初始化数组?"
    options:
      - "A: [3]int{1, 2, 3}"
      - "B: {1, 2, 3}[3]int"
      - "C: array(1, 2, 3)"
      - "D: [1, 2, 3]"
    answer: A
    explanation: "数组字面量语法是[N]T{values}。如[3]int{1, 2, 3}。参见 Go 规范 Composite literals 章节。"
    topic: types
    chapter: array

  - id: type-arr-007
    type: single
    difficulty: easy
    stem: "[...]int{1, 2, 3}中...的作用是什么?"
    options:
      - "A: 可变参数"
      - "B: 编译器推断长度"
      - "C: 无限长度"
      - "D: 创建切片"
    answer: B
    explanation: "[...]让编译器根据初始值个数推断数组长度。[...]int{1,2,3}等于[3]int{1,2,3}。参见 Go 规范 Composite literals 章节。"
    topic: types
    chapter: array

  - id: type-arr-008
    type: single
    difficulty: easy
    stem: "len([5]int{})的结果是什么?"
    options:
      - "A: 0"
      - "B: 5"
      - "C: 编译错误"
      - "D: 取决于初始化"
    answer: B
    explanation: "数组长度固定。即使是空字面量,长度也是声明的5。参见 Go 规范 Length and capacity 章节。"
    topic: types
    chapter: array

  - id: type-arr-009
    type: single
    difficulty: easy
    stem: "数组是值类型还是引用类型?"
    options:
      - "A: 值类型"
      - "B: 引用类型"
      - "C: 取决于大小"
      - "D: 取决于元素类型"
    answer: A
    explanation: "数组是值类型。赋值和传参会复制整个数组。参见 Go 规范 Array types 章节。"
    topic: types
    chapter: array

  - id: type-arr-010
    type: single
    difficulty: easy
    stem: "数组赋值a = b会发生什么?"
    options:
      - "A: a和b指向同一数组"
      - "B: 复制整个数组"
      - "C: 浅拷贝"
      - "D: 编译错误"
    answer: B
    explanation: "数组是值类型。a=b复制整个数组,a和b是独立的。参见 Go 规范 Array types 章节。"
    topic: types
    chapter: array

  - id: type-arr-011
    type: single
    difficulty: easy
    stem: "如何获取数组的容量?"
    options:
      - "A: cap(a)"
      - "B: len(a)"
      - "C: 数组没有容量概念"
      - "D: A和B都可以"
    answer: D
    explanation: "数组的长度和容量相同,都是固定的。cap(a)和len(a)对数组返回相同值。参见 Go 规范 Length and capacity 章节。"
    topic: types
    chapter: array

  - id: type-arr-012
    type: single
    difficulty: easy
    stem: "数组可以比较相等吗?"
    options:
      - "A: 可以"
      - "B: 不可以"
      - "C: 只能比较地址"
      - "D: 需要循环比较"
    answer: A
    explanation: "同类型数组可以用==和!=比较。逐元素比较,全部相等则相等。参见 Go 规范 Comparison operators 章节。"
    topic: types
    chapter: array

  - id: type-arr-013
    type: single
    difficulty: easy
    stem: "[3]int{1,2,3} == [3]int{1,2,3}的结果是什么?"
    options:
      - "A: true"
      - "B: false"
      - "C: 编译错误"
      - "D: 比较地址"
    answer: A
    explanation: "相同类型数组可以比较。元素全部相等,结果是true。参见 Go 规范 Comparison operators 章节。"
    topic: types
    chapter: array

  - id: type-arr-014
    type: multiple
    difficulty: easy
    stem: "以下哪些是有效的数组声明?(多选)"
    options:
      - "A: var a [3]int"
      - "B: a := [3]int{1, 2, 3}"
      - "C: a := [...]int{1, 2, 3}"
      - "D: var a []int = [3]int{}"
    answer: ABC
    explanation: "A声明零值数组,B显式长度字面量,C推断长度。D是类型不匹配([]int是切片)。参见 Go 规范 Array types 章节。"
    topic: types
    chapter: array

  - id: type-arr-015
    type: single
    difficulty: easy
    stem: "a[1:3]对数组a返回什么类型?"
    options:
      - "A: 数组"
      - "B: 切片"
      - "C: 指针"
      - "D: 子数组"
    answer: B
    explanation: "对数组切片操作返回切片,不是数组。切片引用数组的底层数据。参见 Go 规范 Slice expressions 章节。"
    topic: types
    chapter: array

  - id: type-arr-016
    type: single
    difficulty: easy
    stem: "[2][3]int是什么类型?"
    options:
      - "A: 2x3矩阵"
      - "B: 二维数组"
      - "C: 数组的数组"
      - "D: 以上都对"
    answer: D
    explanation: "[2][3]int是包含2个[3]int元素的数组,即2行3列的二维数组/矩阵。参见 Go 规范 Array types 章节。"
    topic: types
    chapter: array

  - id: type-arr-017
    type: single
    difficulty: easy
    stem: "如何遍历数组?"
    options:
      - "A: for range a"
      - "B: for i := 0; i < len(a); i++"
      - "C: A和B都可以"
      - "D: foreach a"
    answer: C
    explanation: "可以用range或传统for循环遍历数组。Go没有foreach关键字。参见 Go 规范 For statements 章节。"
    topic: types
    chapter: array

  - id: type-arr-018
    type: single
    difficulty: easy
    stem: "for i, v := range a中v是什么?"
    options:
      - "A: 元素的引用"
      - "B: 元素的副本"
      - "C: 元素的指针"
      - "D: 索引"
    answer: B
    explanation: "range遍历数组时v是元素的副本。修改v不影响原数组。参见 Go 规范 For statements 章节。"
    topic: types
    chapter: array

  - id: type-arr-019
    type: single
    difficulty: easy
    stem: "如何传递大数组而不复制?"
    options:
      - "A: 传指针*[N]T"
      - "B: 传切片[]T"
      - "C: A和B都可以"
      - "D: 无法避免复制"
    answer: C
    explanation: "传数组指针或切片都可以避免复制整个数组。切片更常用。参见 Go 规范 Pointer types 章节。"
    topic: types
    chapter: array

  - id: type-arr-020
    type: single
    difficulty: easy
    stem: "&a[0]和&a类型一样吗?"
