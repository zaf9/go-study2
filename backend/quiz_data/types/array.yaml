    difficulty: easy
    stem: "数组索引从几开始?"
    options:
      - "A: 0"
      - "B: 1"
      - "C: 可配置"
      - "D: 取决于声明"
    answer: A
    explanation: "Go数组索引从0开始。a[0]是第一个元素,a[len(a)-1]是最后一个。参见 Go 规范 Index expressions 章节。"
    topic: types
    chapter: array

