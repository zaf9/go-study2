    topic: types
    chapter: array

  # ========== 中等题 (Medium) - 11道 ==========

  - id: type-arr-024
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          a := [3]int{1, 2, 3}
          b := a
          b[0] = 10
          fmt.Println(a[0], b[0])
      }
    options:
      - "A: 10 10"
      - "B: 1 10"
      - "C: 1 1"
      - "D: 编译错误"
    answer: B
    explanation: "数组是值类型。b=a复制整个数组。修改b不影响a。a[0]=1,b[0]=10。参见 Go 规范 Array types 章节。"
    topic: types
    chapter: array

  - id: type-arr-025
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func modify(a [3]int) {
          a[0] = 100
      }
      func main() {
          arr := [3]int{1, 2, 3}
          modify(arr)
          fmt.Println(arr[0])
      }
    options:
      - "A: 100"
      - "B: 1"
      - "C: 0"
      - "D: 编译错误"
    answer: B
    explanation: "数组传参是值传递,复制整个数组。函数内修改的是副本。原arr不变。参见 Go 规范 Array types 章节。"
    topic: types
    chapter: array

  - id: type-arr-026
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func modify(a *[3]int) {
          a[0] = 100
      }
      func main() {
          arr := [3]int{1, 2, 3}
          modify(&arr)
          fmt.Println(arr[0])
      }
    options:
      - "A: 100"
      - "B: 1"
      - "C: 0"
      - "D: 编译错误"
    answer: A
    explanation: "传数组指针,函数内修改原数组。a[0]自动解引用。arr[0]变为100。参见 Go 规范 Pointer types 章节。"
    topic: types
    chapter: array

