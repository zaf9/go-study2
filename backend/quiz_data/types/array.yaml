      func main() {
          a := [3]*int{}
          x := 1
          a[0] = &x
          b := a
          *b[0] = 100
          fmt.Println(x, *a[0])
      }
    options:
      - "A: 1 1"
      - "B: 100 100"
      - "C: 1 100"
      - "D: 100 1"
    answer: B
    explanation: "a是指针数组。b=a复制指针(浅拷贝)。b[0]和a[0]指向同一个x。修改*b[0]影响x和*a[0]。参见 Go 规范 Array types 章节。"
