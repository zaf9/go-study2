questions:
  # ========== 简单题 (Easy) - 24道 ==========
  
  - id: type-map-001
    type: single
    difficulty: easy
    stem: "Go中map类型的表示格式是什么?"
    options:
      - "A: map[K]V"
      - "B: Map<K,V>"
      - "C: dict[K,V]"
      - "D: {K:V}"
    answer: A
    explanation: "Go的map类型写作map[K]V,K是键类型,V是值类型。参见 Go 规范 Map types 章节。"
    topic: types
    chapter: map

  - id: type-map-002
    type: single
    difficulty: easy
    stem: "map的零值是什么?"
    options:
      - "A: {}"
      - "B: nil"
      - "C: 空map"
      - "D: undefined"
    answer: B
    explanation: "map的零值是nil。nil map不能添加元素。参见 Go 规范 The zero value 章节。"
    topic: types
    chapter: map

  - id: type-map-003
    type: single
    difficulty: easy
    stem: "向nil map写入会怎样?"
    options:
      - "A: 自动初始化"
      - "B: 返回零值"
      - "C: panic"
      - "D: 编译错误"
    answer: C
    explanation: "向nil map写入会panic。必须先用make初始化。参见 Go 规范 Map types 章节。"
    topic: types
    chapter: map

  - id: type-map-004
    type: single
    difficulty: easy
    stem: "从nil map读取会怎样?"
    options:
      - "A: panic"
      - "B: 返回零值"
      - "C: 编译错误"
      - "D: 返回nil"
    answer: B
    explanation: "从nil map读取返回值类型的零值,不会panic。参见 Go 规范 Index expressions 章节。"
    topic: types
    chapter: map

  - id: type-map-005
    type: single
    difficulty: easy
    stem: "如何创建map?"
    options:
      - "A: make(map[K]V)"
      - "B: map[K]V{}"
      - "C: new(map[K]V)"
      - "D: A或B"
    answer: D
    explanation: "make(map[K]V)或字面量map[K]V{}都创建空map。new返回指针。参见 Go 规范 Making slices maps channels 章节。"
    topic: types
    chapter: map

  - id: type-map-006
    type: single
    difficulty: easy
    stem: "如何检查map中键是否存在?"
    options:
      - "A: m.has(k)"
      - "B: m[k] != nil"
      - "C: v, ok := m[k]"
      - "D: k in m"
    answer: C
    explanation: "v, ok := m[k]的ok表示键是否存在。true存在,false不存在。参见 Go 规范 Index expressions 章节。"
    topic: types
    chapter: map

  - id: type-map-007
    type: single
    difficulty: easy
    stem: "如何删除map中的键?"
    options:
      - "A: m.remove(k)"
      - "B: delete(m, k)"
      - "C: m[k] = nil"
      - "D: del m[k]"
    answer: B
    explanation: "delete(m, k)删除map中的键k。键不存在时不报错。参见 Go 规范 Deletion of map elements 章节。"
    topic: types
    chapter: map

  - id: type-map-008
    type: single
    difficulty: easy
    stem: "map的键类型有什么要求?"
    options:
      - "A: 必须是string"
      - "B: 必须可比较"
      - "C: 任何类型"
      - "D: 必须是整数"
    answer: B
    explanation: "map键必须是可比较类型。切片、map、函数不能作为键。参见 Go 规范 Map types 章节。"
    topic: types
    chapter: map

  - id: type-map-009
    type: single
    difficulty: easy
    stem: "map是引用类型还是值类型?"
    options:
      - "A: 值类型"
      - "B: 引用类型"
      - "C: 取决于值类型"
      - "D: 取决于键类型"
    answer: B
    explanation: "map是引用类型。赋值和传参共享底层数据。参见 Go 规范 Map types 章节。"
    topic: types
    chapter: map

  - id: type-map-010
    type: single
    difficulty: easy
    stem: "map可以比较吗?"
    options:
      - "A: 可以用=="
      - "B: 只能与nil比较"
      - "C: 用reflect.DeepEqual"
      - "D: B或C"
    answer: D
    explanation: "map只能与nil用==比较。比较内容需要reflect.DeepEqual或maps.Equal。参见 Go 规范 Comparison operators 章节。"
    topic: types
    chapter: map

  - id: type-map-011
    type: single
    difficulty: easy
    stem: "map迭代顺序是什么?"
    options:
      - "A: 插入顺序"
      - "B: 键的顺序"
      - "C: 不确定"
      - "D: 值的顺序"
    answer: C
    explanation: "map迭代顺序不确定,每次可能不同。设计上是随机的。参见 Go 规范 For statements 章节。"
    topic: types
    chapter: map

  - id: type-map-012
    type: single
    difficulty: easy
    stem: "len(m)返回什么?"
    options:
      - "A: 容量"
      - "B: 键值对数量"
      - "C: 键数量"
      - "D: 内存大小"
    answer: B
    explanation: "len(m)返回map中键值对的数量。参见 Go 规范 Length and capacity 章节。"
    topic: types
    chapter: map

  - id: type-map-013
    type: single
    difficulty: easy
    stem: "map有cap函数吗?"
    options:
      - "A: 有"
      - "B: 没有"
      - "C: 只读有"
      - "D: 只写有"
    answer: B
    explanation: "map没有cap函数。只有len函数获取长度。参见 Go 规范 Length and capacity 章节。"
    topic: types
    chapter: map

  - id: type-map-014
    type: single
    difficulty: easy
    stem: "make(map[K]V, hint)中hint是什么?"
    options:
      - "A: 最大容量"
      - "B: 初始容量提示"
      - "C: 键数量"
      - "D: 值数量"
    answer: B
    explanation: "hint是初始容量提示,不是限制。map会自动增长。参见 Go 规范 Making slices maps channels 章节。"
    topic: types
    chapter: map

  - id: type-map-015
    type: single
    difficulty: easy
    stem: "以下哪个不能作为map键?"
    options:
      - "A: string"
      - "B: int"
      - "C: struct"
      - "D: []int"
    answer: D
    explanation: "切片不可比较,不能作为map键。string、int、可比较struct都可以。参见 Go 规范 Map types 章节。"
    topic: types
    chapter: map

  - id: type-map-016
    type: multiple
    difficulty: easy
    stem: "以下哪些可以作为map键?(多选)"
    options:
      - "A: int"
      - "B: string"
      - "C: [3]int"
      - "D: *int"
    answer: ABCD
    explanation: "int、string、数组(元素可比较)、指针都可比较,可以作为键。参见 Go 规范 Map types 章节。"
    topic: types
    chapter: map

  - id: type-map-017
    type: single
    difficulty: easy
    stem: "clear(m)的作用是什么?(Go 1.21+)"
    options:
      - "A: 删除map"
      - "B: 清空所有键值对"
      - "C: 设为nil"
      - "D: 重置容量"
    answer: B
    explanation: "clear(m)清空map的所有键值对。map本身仍可用。参见 Go 规范 Clear 章节。"
    topic: types
    chapter: map

  - id: type-map-018
    type: single
    difficulty: easy
    stem: "如何遍历map的所有键值对?"
    options:
      - "A: for k, v := range m"
      - "B: for m.each()"
      - "C: m.forEach()"
      - "D: for i := 0; i < len(m); i++"
    answer: A
    explanation: "for k, v := range m遍历map的所有键值对。参见 Go 规范 For statements 章节。"
    topic: types
    chapter: map

  - id: type-map-019
    type: single
    difficulty: easy
    stem: "只遍历map的键用什么语法?"
    options:
      - "A: for k := range m"
      - "B: for k, _ := range m"
      - "C: A或B"
      - "D: m.keys()"
    answer: C
    explanation: "for k := range m或for k, _ := range m都只遍历键。参见 Go 规范 For statements 章节。"
    topic: types
    chapter: map

  - id: type-map-020
    type: single
    difficulty: easy
    stem: "map值不能取地址的原因是什么?"
    options:
      - "A: 值可能移动"
      - "B: 语法不支持"
      - "C: 性能考虑"
      - "D: A(扩容导致)"
    answer: D
    explanation: "map扩容时值会移动。取地址后地址可能失效。参见 Go 规范 Address operators 章节。"
    topic: types
    chapter: map

  - id: type-map-021
    type: single
    difficulty: easy
    stem: "map是并发安全的吗?"
    options:
      - "A: 是"
      - "B: 不是"
      - "C: 只读安全"
      - "D: 只写安全"
    answer: C
    explanation: "map不是并发安全的。并发读可以,但并发写或读写混合需要加锁。参见 Go maps并发访问规则。"
    topic: types
    chapter: map

  - id: type-map-022
    type: single
    difficulty: easy
    stem: "sync.Map的适用场景是什么?"
    options:
      - "A: 所有map场景"
      - "B: 高并发读多写少"
      - "C: 高并发写多读少"
      - "D: 小数据量"
    answer: B
    explanation: "sync.Map优化读多写少场景。一般场景用普通map加锁更好。参见 Go sync包文档。"
    topic: types
    chapter: map

  - id: type-map-023
    type: multiple
    difficulty: easy
    stem: "关于map,以下说法正确的是?(多选)"
    options:
      - "A: 引用类型"
      - "B: 键必须可比较"
      - "C: 迭代顺序不确定"
      - "D: nil map可读不可写"
    answer: ABCD
    explanation: "map是引用类型,键可比较,迭代随机,nil可读(返回零值)不可写(panic)。参见 Go 规范 Map types 章节。"
    topic: types
    chapter: map

  - id: type-map-024
    type: single
    difficulty: easy
    stem: "map[string]struct{}常用来做什么?"
    options:
      - "A: 存储空值"
      - "B: 实现Set"
      - "C: 节省内存"
      - "D: 以上都是"
    answer: D
    explanation: "map[K]struct{}常用于实现Set。struct{}大小为0节省内存。参见 Go map实现Set模式。"
    topic: types
    chapter: map

  # ========== 中等题 (Medium) - 12道 ==========

  - id: type-map-025
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          m := map[string]int{"a": 1, "b": 2}
          n := m
          n["a"] = 100
          fmt.Println(m["a"])
      }
    options:
      - "A: 1"
      - "B: 100"
      - "C: 0"
      - "D: 编译错误"
    answer: B
    explanation: "map是引用类型。n:=m共享底层数据。n[\"a\"]=100也修改了m。参见 Go 规范 Map types 章节。"
    topic: types
    chapter: map

  - id: type-map-026
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          m := map[string]int{"a": 1}
          v := m["b"]
          fmt.Println(v)
      }
    options:
      - "A: nil"
