  - id: type-map-032
    type: multiple
    difficulty: medium
    stem: "关于map并发访问,以下说法正确的是?(多选)"
    options:
      - "A: 并发读安全"
      - "B: 并发写会panic"
      - "C: 需要sync.Mutex"
      - "D: 可用sync.Map"
    answer: ABCD
    explanation: "map并发读安全,并发写panic。可用Mutex或sync.Map解决。参见 Go maps并发访问规则。"
    topic: types
    chapter: map

  - id: type-map-033
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func modify(m map[string]int) {
          m["a"] = 100
      }
      func main() {
          m := map[string]int{"a": 1}
          modify(m)
          fmt.Println(m["a"])
      }
    options:
      - "A: 1"
      - "B: 100"
      - "C: 0"
      - "D: panic"
    answer: B
    explanation: "map是引用类型。函数内修改影响原map。m[\"a\"]=100。参见 Go 规范 Map types 章节。"
    topic: types
    chapter: map

  - id: type-map-034
    type: code_fix
    difficulty: medium
    stem: "以下代码不能编译,正确的修正是?"
    code: |
      package main
      func main() {
          type S struct{ slice []int }
          m := map[S]int{}
          _ = m
      }
    options:
      - "A: S不能作键"
      - "B: 去掉slice字段"
      - "C: 用指针*S"
      - "D: B或C"
    answer: D
    explanation: "S包含切片不可比较。去掉切片或用*S(指针可比较)。参见 Go 规范 Map types 章节。"
    topic: types
    chapter: map

  - id: type-map-035
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          m := map[string]int{"a": 1, "b": 2}
          for k := range m {
              delete(m, k)
          }
          fmt.Println(len(m))
      }
    options:
      - "A: 0"
      - "B: 2"
