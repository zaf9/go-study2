    stem: "以下代码panic,正确的修正是?"
    code: |
      package main
      func main() {
          var m map[string]int
          m["a"] = 1
      }
    options:
      - "A: m = make(map[string]int)"
      - "B: m = map[string]int{}"
      - "C: A或B"
      - "D: 代码正确"
    answer: C
    explanation: "nil map不能写入。必须先初始化:make或字面量。参见 Go 规范 Map types 章节。"
    topic: types
