    options:
      - "A: 0"
      - "B: 100"
      - "C: panic"
      - "D: 编译错误"
    answer: B
    explanation: "数组作为键时按值存储。修改a不影响map中的键。m[[2]int{1,2}]=100。参见 Go 规范 Map types 章节。"
    topic: types
    chapter: map

