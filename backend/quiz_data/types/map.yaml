  - id: type-map-030
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          m := make(map[string]int, 100)
          fmt.Println(len(m))
      }
    options:
      - "A: 100"
      - "B: 0"
      - "C: panic"
      - "D: 编译错误"
    answer: B
    explanation: "make(map, 100)的100是容量提示,不是初始大小。len(m)=0。参见 Go 规范 Making slices maps channels 章节。"
    topic: types
    chapter: map

  - id: type-map-031
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          m := map[string]int{"a": 1, "b": 2}
