    topic: types
    chapter: map

  - id: type-map-036
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          m := map[int]string{1: "a", 2: "b"}
          for k, v := range m {
              m[k+10] = v + "x"
          }
          fmt.Println(len(m))
      }
    options:
      - "A: 2"
      - "B: 4"
      - "C: 不确定"
      - "D: panic"
    answer: C
    explanation: "遍历时添加键行为不确定。新键可能被遍历到也可能不。结果不确定。参见 Go 规范 For statements 章节。"
    topic: types
    chapter: map

  # ========== 困难题 (Hard) - 4道 ==========

  - id: type-map-037
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          type Key struct{ a, b int }
          m := map[Key]int{}
          k1 := Key{1, 2}
          k2 := Key{1, 2}
          m[k1] = 100
          fmt.Println(m[k2])
      }
    options:
      - "A: 0"
      - "B: 100"
      - "C: panic"
      - "D: 编译错误"
    answer: B
    explanation: "结构体作为键按值比较。k1和k2相等(都是{1,2})。m[k2]=m[k1]=100。参见 Go 规范 Comparison operators 章节。"
    topic: types
    chapter: map

  - id: type-map-038
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          m := map[string]*int{}
          for _, v := range []string{"a", "b", "c"} {
              n := len(v)
              m[v] = &n
          }
          fmt.Println(*m["a"], *m["b"], *m["c"])
      }
    options:
      - "A: 1 1 1"
      - "B: 3 3 3"
      - "C: 1 2 3"
      - "D: 取决于编译器"
    answer: A
    explanation: "每次循环n是新变量。len(v)都是1(单字符)。每个*m[k]=1。参见 Go 规范 For statements 章节。"
    topic: types
    chapter: map

  - id: type-map-039
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          m := map[[2]int]int{}
