      - "A: 0 false true"
      - "B: 0 true true"
      - "C: panic"
      - "D: 0 false false"
    answer: A
    explanation: "nil map可读。键不存在返回零值0,ok=false。m是nil。参见 Go 规范 Index expressions 章节。"
