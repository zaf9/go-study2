  - id: const-complex-001
    type: single
    difficulty: easy
    stem: "Go语言中const c = 3 + 4i声明的c是什么类型?"
    options:
      - "A: complex64"
      - "B: complex128"
      - "C: 无类型复数常量"
      - "D: float64"
    answer: C
    explanation: "没有显式类型的常量是无类型常量。const c = 3+4i是无类型复数常量,使用时根据上下文确定类型。参见 Go 规范 Constants 章节。"
