  - id: const-complex-030
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          const c = 3.0 + 4.0i
          fmt.Printf("%v\n", c*c)
      }
    options:
      - "A: (9+16i)"
      - "B: (-7+24i)"
      - "C: (25+0i)"
      - "D: (7+24i)"
