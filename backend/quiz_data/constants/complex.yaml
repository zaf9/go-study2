  # ========== 困难题 (Hard) - 3道 ==========

  - id: const-complex-033
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import (
          "fmt"
          "math/cmplx"
      )
      func main() {
          c := cmplx.Exp(complex(0, cmplx.Pi))
          fmt.Printf("%.0f\n", real(c))
      }
    options:
      - "A: 1"
      - "B: -1"
      - "C: 0"
      - "D: 3"
    answer: B
    explanation: "欧拉公式:e^(iπ) = -1。cmplx.Exp(complex(0, π)) = e^(iπ) ≈ -1+0i。实部是-1。参见欧拉公式。"
    topic: constants
    chapter: complex

  - id: const-complex-034
    type: multiple
    difficulty: hard
    stem: "关于复数常量的编译时计算,以下说法正确的是?(多选)"
    options:
      - "A: 复数常量运算在编译时完成"
      - "B: 精度与无类型浮点相同"
      - "C: 可以计算任意大的复数"
      - "D: cmplx包函数是运行时计算"
    answer: ABCD
    explanation: "常量表达式编译时计算。无类型复数有256位以上精度(实部虚部各自)。cmplx包函数运行时计算。参见 Go 规范 Constants 章节。"
    topic: constants
    chapter: complex

  - id: const-complex-035
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          const c = (1 + 1i) * (1 - 1i)
          fmt.Println(c, real(c), imag(c))
      }
    options:
      - "A: (2+0i) 2 0"
      - "B: (0+0i) 0 0"
      - "C: (0+2i) 0 2"
      - "D: (2-2i) 2 -2"
    answer: A
    explanation: "(1+i)(1-i) = 1-i² = 1-(-1) = 2+0i。这是共轭复数乘积的性质:|z|²=z×z*。参见复数共轭乘积。"
    topic: constants
    chapter: complex
