  # ========== 中等题 (Medium) - 11道 ==========

  - id: const-complex-022
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          const c = 3 + 4i
          fmt.Printf("%T\n", c)
      }
    options:
      - "A: complex"
      - "B: complex64"
      - "C: complex128"
      - "D: untyped complex"
    answer: C
    explanation: "无类型复数常量传给Printf时使用默认类型complex128。%T显示实际类型。参见 Go 规范 Constants 章节。"
    topic: constants
    chapter: complex

  - id: const-complex-023
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          const a, b = 2+3i, 1+2i
          const c = a * b
          fmt.Printf("%.0f+%.0fi\n", real(c), imag(c))
      }
    options:
      - "A: 2+6i"
      - "B: -4+7i"
      - "C: 3+5i"
      - "D: 8+1i"
    answer: B
    explanation: "(2+3i)*(1+2i) = 2*1-3*2 + (2*2+3*1)i = -4+7i。复数乘法:(a+bi)(c+di)=(ac-bd)+(ad+bc)i。参见复数乘法公式。"
    topic: constants
    chapter: complex

  - id: const-complex-024
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          const c = complex(1, 0)
          fmt.Println(c == 1)
      }
    options:
      - "A: true"
      - "B: false"
      - "C: 编译错误"
      - "D: 运行时错误"
    answer: A
    explanation: "complex(1,0) = 1+0i。无类型整数常量1可以与复数比较,隐式转为1+0i。相等。参见 Go 规范 Comparison operators 章节。"
    topic: constants
    chapter: complex

