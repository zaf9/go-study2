questions:
  # ========== 简单题 (Easy) - 21道 ==========
  
  - id: const-boolean-001
    type: single
    difficulty: easy
    stem: "Go语言中布尔类型的两个预声明常量是什么?"
    options:
      - "A: True 和 False"
      - "B: true 和 false"
      - "C: TRUE 和 FALSE"
      - "D: 1 和 0"
    answer: B
    explanation: "Go使用小写的true和false作为预声明布尔常量。Go区分大小写,True/FALSE等都不是预声明标识符。参见 Go 规范 Boolean types 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-002
    type: single
    difficulty: easy
    stem: "以下哪个是Go中true和false的类型?"
    options:
      - "A: int"
      - "B: bool"
      - "C: boolean"
      - "D: Boolean"
    answer: B
    explanation: "true和false是预声明的无类型布尔常量,默认类型是bool。Go没有boolean类型。参见 Go 规范 Boolean types 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-003
    type: single
    difficulty: easy
    stem: "以下哪个表达式的结果是true?"
    options:
      - "A: 1 == true"
      - "B: 0 == false"
      - "C: !false"
      - "D: \"true\" == true"
    answer: C
    explanation: "!false是true。Go中布尔类型不能与数值类型比较(A、B编译错误),也不能与字符串比较(D编译错误)。参见 Go 规范 Comparison operators 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-004
    type: single
    difficulty: easy
    stem: "Go中bool类型的零值是什么?"
    options:
      - "A: nil"
      - "B: 0"
      - "C: false"
      - "D: undefined"
    answer: C
    explanation: "bool类型的零值是false。所有类型都有零值:数值0,布尔false,字符串\"\",指针nil等。参见 Go 规范 The zero value 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-005
    type: single
    difficulty: easy
    stem: "以下代码var b bool后,b的值是什么?"
    options:
      - "A: nil"
      - "B: true"
      - "C: false"
      - "D: 未定义"
    answer: C
    explanation: "var声明不初始化时使用零值。bool的零值是false。Go不存在未定义的值。参见 Go 规范 The zero value 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-006
    type: multiple
    difficulty: easy
    stem: "以下哪些运算符可以用于布尔操作?(多选)"
    options:
      - "A: &&"
      - "B: ||"
      - "C: !"
      - "D: &"
    answer: ABCD
    explanation: "&&(逻辑与)、||(逻辑或)、!(逻辑非)是短路逻辑运算符。&(位与)也可用于bool但不短路。参见 Go 规范 Logical operators 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-007
    type: single
    difficulty: easy
    stem: "表达式true && false的结果是?"
    options:
      - "A: true"
      - "B: false"
      - "C: 1"
      - "D: 编译错误"
    answer: B
    explanation: "&&是逻辑与,两边都为true才为true。true && false = false。参见 Go 规范 Logical operators 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-008
    type: single
    difficulty: easy
    stem: "表达式true || false的结果是?"
    options:
      - "A: true"
      - "B: false"
      - "C: 1"
      - "D: 编译错误"
    answer: A
    explanation: "||是逻辑或,任一为true则为true。true || false = true。参见 Go 规范 Logical operators 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-009
    type: single
    difficulty: easy
    stem: "表达式!true的结果是?"
    options:
      - "A: true"
      - "B: false"
      - "C: -1"
      - "D: 编译错误"
    answer: B
    explanation: "!是逻辑非运算符,对布尔值取反。!true = false。参见 Go 规范 Logical operators 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-010
    type: single
    difficulty: easy
    stem: "Go中可以将布尔值与整数相加吗?"
    options:
      - "A: 可以,true为1,false为0"
      - "B: 可以,需要显式转换"
      - "C: 不可以,类型不兼容"
      - "D: 可以,使用int(bool)"
    answer: C
    explanation: "Go是强类型语言,bool和int是不同类型,不能直接相加。Go也没有提供bool到int的转换。参见 Go 规范 Type definitions 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-011
    type: single
    difficulty: easy
    stem: "以下哪个表达式可以正确将bool转为int?"
    options:
      - "A: int(true)"
      - "B: true + 0"
      - "C: 使用if语句"
      - "D: A和B都可以"
    answer: C
    explanation: "Go不支持bool到int的直接转换(int(true)编译错误)。需要用if b { return 1 } return 0。参见 Go 规范 Conversions 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-012
    type: single
    difficulty: easy
    stem: "布尔常量true和false是否可以被重新定义?"
    options:
      - "A: 不可以,是关键字"
      - "B: 可以,是预声明标识符"
      - "C: 仅在函数内可以"
      - "D: 仅在包级别可以"
    answer: B
    explanation: "true和false是预声明标识符,不是关键字。可以在局部作用域被遮蔽,但强烈不建议这样做。参见 Go 规范 Predeclared identifiers 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-013
    type: multiple
    difficulty: easy
    stem: "以下哪些表达式的结果类型是bool?(多选)"
    options:
      - "A: 1 < 2"
      - "B: a == b"
      - "C: x != nil"
      - "D: len(s) > 0"
    answer: ABCD
    explanation: "比较运算符(<、==、!=、>等)的结果都是bool类型。这包括所有可比较类型的比较操作。参见 Go 规范 Comparison operators 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-014
    type: single
    difficulty: easy
    stem: "&&运算符有什么特殊行为?"
    options:
      - "A: 总是计算两边"
      - "B: 左边为false则不计算右边"
      - "C: 左边为true则不计算右边"
      - "D: 返回非布尔值"
    answer: B
    explanation: "&&是短路与运算符:左边为false时直接返回false,不计算右边。这是性能优化和避免副作用的重要特性。参见 Go 规范 Logical operators 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-015
    type: single
    difficulty: easy
    stem: "||运算符有什么特殊行为?"
    options:
      - "A: 总是计算两边"
      - "B: 左边为false则不计算右边"
      - "C: 左边为true则不计算右边"
      - "D: 返回最后计算的值"
    answer: C
    explanation: "||是短路或运算符:左边为true时直接返回true,不计算右边。与&&类似都有短路求值特性。参见 Go 规范 Logical operators 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-016
    type: single
    difficulty: easy
    stem: "Go中如何声明一个布尔常量?"
    options:
      - "A: const flag bool = true"
      - "B: const flag = true"
      - "C: A和B都可以"
      - "D: 只能用var声明"
    answer: C
    explanation: "常量声明可以显式指定类型或让编译器推断。const flag = true推断为无类型布尔常量。参见 Go 规范 Constant declarations 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-017
    type: single
    difficulty: easy
    stem: "以下哪个不是有效的布尔表达式?"
    options:
      - "A: flag && !done"
      - "B: a > 0 || b < 0"
      - "C: x & y"
      - "D: true || false && true"
    answer: C
    explanation: "如果x和y是非bool类型(如int),则x & y是位运算不是布尔表达式。A、B、D都是有效的布尔表达式。参见 Go 规范 Operators 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-018
    type: single
    difficulty: easy
    stem: "布尔运算的优先级从高到低是?"
    options:
      - "A: && > || > !"
      - "B: ! > && > ||"
      - "C: || > && > !"
      - "D: ! > || > &&"
    answer: B
    explanation: "一元运算符!优先级最高,然后是&&(逻辑与),最后是||(逻辑或)。所以a || b && c等于a || (b && c)。参见 Go 规范 Operator precedence 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-019
    type: single
    difficulty: easy
    stem: "表达式true || false && false的结果是?"
    options:
      - "A: true"
      - "B: false"
      - "C: 编译错误"
      - "D: 取决于求值顺序"
    answer: A
    explanation: "&&优先级高于||。表达式等价于true || (false && false) = true || false = true。参见 Go 规范 Operator precedence 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-020
    type: single
    difficulty: easy
    stem: "如何在fmt中打印布尔值?"
    options:
      - "A: %b"
      - "B: %t"
      - "C: %v"
      - "D: B和C都可以"
    answer: D
    explanation: "%t专门用于打印布尔值(true/false)。%v是通用格式也可以打印布尔值。%b用于二进制整数。参见 fmt包文档。"
    topic: constants
    chapter: boolean

  - id: const-boolean-021
    type: single
    difficulty: easy
    stem: "Go支持哪种三元运算符?"
    options:
      - "A: a ? b : c"
      - "B: a ?: b"
      - "C: 不支持三元运算符"
      - "D: if a then b else c"
    answer: C
    explanation: "Go不支持三元运算符(?:)。必须使用if语句。这是Go简化语法的设计决策。参见 Go FAQ。"
    topic: constants
    chapter: boolean

  # ========== 中等题 (Medium) - 11道 ==========

  - id: const-boolean-022
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var a, b, c = true, false, true
          fmt.Println(a || b && c)
      }
    options:
      - "A: true"
      - "B: false"
      - "C: 编译错误"
      - "D: 运行时错误"
    answer: A
    explanation: "&&优先级高于||。等价于a || (b && c) = true || (false && true) = true || false = true。参见 Go 规范 Operator precedence 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-023
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func f() bool {
          fmt.Print("f ")
          return true
      }
      func main() {
          fmt.Println(true || f())
      }
    options:
      - "A: f true"
      - "B: true"
      - "C: f f true"
      - "D: 编译错误"
    answer: B
    explanation: "||短路求值:左边true时不计算右边。f()不会被调用,只输出true。参见 Go 规范 Logical operators 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-024
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func f() bool {
          fmt.Print("f ")
          return true
      }
      func main() {
          fmt.Println(false && f())
      }
    options:
      - "A: f false"
      - "B: false"
      - "C: f f false"
      - "D: 编译错误"
    answer: B
    explanation: "&&短路求值:左边false时不计算右边。f()不会被调用,只输出false。参见 Go 规范 Logical operators 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-025
    type: code_fix
    difficulty: medium
    stem: "以下代码有编译错误,正确的修正方案是?"
    code: |
      package main
      import "fmt"
      func main() {
          var flag bool = 1
          fmt.Println(flag)
      }
    options:
      - "A: 改为flag = true"
      - "B: 改为flag = bool(1)"
      - "C: 改为flag = 1 != 0"
      - "D: A或C"
    answer: D
    explanation: "布尔类型不能直接赋值整数。可以用true字面量,或用比较表达式1 != 0(结果是bool)。bool(1)无效转换。参见 Go 规范 Types 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-026
    type: multiple
    difficulty: medium
    stem: "关于Go中布尔值的特性,以下说法正确的是?(多选)"
    options:
      - "A: bool类型占用1字节"
      - "B: 切片[]bool元素也各占1字节"
      - "C: 不能将bool转换为int"
      - "D: bool可以参与位运算"
    answer: ABCD
    explanation: "bool占1字节(最小寻址单元)。Go不支持bool到int转换。bool支持位运算(&、|、^)但不短路。参见 Go 规范 Size and alignment guarantees 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-027
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          const true = false
          fmt.Println(true)
      }
    options:
      - "A: true"
      - "B: false"
      - "C: 编译错误"
      - "D: 运行时panic"
    answer: B
    explanation: "true是预声明标识符(不是关键字),可以在局部作用域被遮蔽。const true = false遮蔽了预声明的true,输出false。参见 Go 规范 Predeclared identifiers 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-028
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          a := true
          b := true
          fmt.Println(a & b, a | b, a ^ b)
      }
    options:
      - "A: true true false"
      - "B: 1 1 0"
      - "C: true true true"
      - "D: 编译错误"
    answer: A
    explanation: "bool支持位运算符。true & true = true, true | true = true, true ^ true = false(异或相同为false)。参见 Go 规范 Bitwise operators 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-029
    type: code_fix
    difficulty: medium
    stem: "以下代码有逻辑错误,正确的修正方案是?"
    code: |
      package main
      import "fmt"
      func main() {
          x := 5
          if x > 0 || x < 10 {
              fmt.Println("in range")
          }
      }
    options:
      - "A: 改为x > 0 && x < 10"
      - "B: 改为!(x <= 0 || x >= 10)"
      - "C: A和B都正确"
      - "D: 原代码正确"
    answer: C
    explanation: "||逻辑是任一为真,所以x > 0 || x < 10几乎总是true。要表示范围内应用&&(两条件都满足)。A和B等价,都是正确修正。参见 Go 规范 Logical operators 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-030
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var b bool
          fmt.Printf("%T %v %t\n", b, b, b)
      }
    options:
      - "A: bool false false"
      - "B: bool 0 false"
      - "C: boolean false false"
      - "D: bool nil false"
    answer: A
    explanation: "%T显示类型bool,%v和%t都显示false(零值)。bool不是0或nil。参见 Go 规范 The zero value 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-031
    type: multiple
    difficulty: medium
    stem: "以下哪些比较操作会返回布尔值?(多选)"
    options:
      - "A: struct{a int}{1} == struct{a int}{1}"
      - "B: []int{1} == []int{1}"
      - "C: map[int]int{1:1} == map[int]int{1:1}"
      - "D: [2]int{1,2} == [2]int{1,2}"
    answer: AD
    explanation: "struct和array可以用==比较(返回bool)。slice和map不能用==比较(只能与nil比较)。参见 Go 规范 Comparison operators 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-032
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var a, b interface{} = true, 1
          fmt.Println(a == true, b == 1, a == b)
      }
    options:
      - "A: true true false"
      - "B: true true true"
      - "C: false false false"
      - "D: 编译错误"
    answer: A
    explanation: "interface{}可以与其动态类型的值比较。a(bool true)==true, b(int 1)==1都是true。但a==b比较动态类型不同,是false。参见 Go 规范 Comparison operators 章节。"
    topic: constants
    chapter: boolean

  # ========== 困难题 (Hard) - 3道 ==========

  - id: const-boolean-033
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          const a = true
          const b = 1
          fmt.Println(a == b)
      }
    options:
      - "A: true"
      - "B: false"
      - "C: 编译错误"
      - "D: 运行时panic"
    answer: C
    explanation: "无类型常量a(布尔)和b(整数)是不同类型的常量,不能用==比较。编译器报错:mismatched types。参见 Go 规范 Comparison operators 章节。"
    topic: constants
    chapter: boolean

  - id: const-boolean-034
    type: multiple
    difficulty: hard
    stem: "关于Go布尔类型的内部表示和原子操作,以下说法正确的是?(多选)"
    options:
      - "A: bool在内存中占1字节"
      - "B: 直接bool读写在多核CPU上是原子的"
      - "C: 应该使用sync/atomic包的Load/Store"
      - "D: atomic.Bool是Go 1.19+提供的"
    answer: ACD
    explanation: "bool占1字节,但读写不保证原子性(可能有缓存一致性问题)。应用atomic包。atomic.Bool是1.19新增类型。参见 Go sync/atomic包文档。"
    topic: constants
    chapter: boolean

  - id: const-boolean-035
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          type MyBool bool
          var a MyBool = true
          var b bool = true
          fmt.Println(a == MyBool(b))
          fmt.Println(a == b) // 思考这行
      }
    options:
      - "A: true\\ntrue"
      - "B: true\\n编译错误"
      - "C: 编译错误(第一个println)"
      - "D: false\\nfalse"
    answer: B
    explanation: "MyBool(b)显式转换后可以比较。但a==b比较不同类型(MyBool和bool)会编译错误。类型别名保持类型区分。参见 Go 规范 Type definitions 章节。"
    topic: constants
    chapter: boolean
