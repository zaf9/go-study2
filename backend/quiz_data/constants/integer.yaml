    answer: A
    explanation: "_跳过iota=0。KB=1<<10=1024,MB=1<<20=1048576,GB=1<<30=1073741824。参见 Go 规范 Iota 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-029
