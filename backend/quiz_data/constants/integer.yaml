  # ========== 简单题 (Easy) - 24道 ==========
  
  - id: const-integer-001
    type: single
    difficulty: easy
    stem: "Go语言中const x = 42声明的x是什么类型?"
    options:
      - "A: int"
      - "B: int64"
      - "C: 无类型整数常量"
      - "D: uint"
    answer: C
    explanation: "没有显式类型的常量是无类型常量。const x = 42是无类型整数常量,使用时根据上下文确定具体类型。参见 Go 规范 Constants 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-002
    type: single
    difficulty: easy
    stem: "以下哪个是十六进制整数字面量?"
    options:
      - "A: 0b1010"
      - "B: 0o17"
      - "C: 0xFF"
      - "D: 123"
    answer: C
    explanation: "0x或0X前缀表示十六进制。0b是二进制,0o是八进制,无前缀是十进制。参见 Go 规范 Integer literals 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-003
    type: single
    difficulty: easy
    stem: "0b1010表示的十进制值是多少?"
    options:
      - "A: 1010"
      - "B: 10"
      - "C: 8"
      - "D: 12"
    answer: B
    explanation: "0b前缀表示二进制。1010(二进制) = 1×8 + 0×4 + 1×2 + 0×1 = 10(十进制)。参见 Go 规范 Integer literals 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-004
    type: single
    difficulty: easy
    stem: "0o17表示的十进制值是多少?"
    options:
      - "A: 17"
      - "B: 15"
      - "C: 8"
      - "D: 23"
    answer: B
    explanation: "0o前缀表示八进制。17(八进制) = 1×8 + 7×1 = 15(十进制)。参见 Go 规范 Integer literals 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-005
    type: single
    difficulty: easy
    stem: "Go 1.13+支持的整数字面量分隔符是什么?"
    options:
      - "A: 逗号 ,"
      - "B: 下划线 _"
      - "C: 空格"
      - "D: 单引号 '"
    answer: B
    explanation: "Go 1.13+支持用下划线分隔数字增加可读性,如1_000_000。下划线会被忽略。参见 Go 规范 Integer literals 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-006
    type: multiple
    difficulty: easy
    stem: "以下哪些是有效的整数字面量?(多选)"
    options:
      - "A: 1_000_000"
      - "B: 0x_FF"
      - "C: 0b_1010"
      - "D: _100"
    answer: ABC
    explanation: "下划线可以出现在数字之间,但不能在开头(_100是标识符不是数字)、不能连续、不能在数字末尾。参见 Go 规范 Integer literals 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-007
    type: single
    difficulty: easy
    stem: "无类型整数常量的默认类型是什么?"
    options:
      - "A: int32"
      - "B: int64"
      - "C: int"
      - "D: uint"
    answer: C
    explanation: "无类型整数常量在需要具体类型时默认为int。int的大小取决于平台(32或64位)。参见 Go 规范 Constants 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-008
    type: single
    difficulty: easy
    stem: "const big = 1 << 100是否合法?"
    options:
      - "A: 不合法,超出int64范围"
      - "B: 合法,无类型常量精度无限制"
      - "C: 不合法,Go不支持移位"
      - "D: 合法,但只能用于常量表达式"
    answer: B
    explanation: "无类型整数常量有任意精度。1<<100虽然超出任何整数类型范围,但作为常量是合法的。参见 Go 规范 Constants 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-009
    type: single
    difficulty: easy
    stem: "以下哪个是Go 1.13+新增的八进制前缀?"
    options:
      - "A: 0"
      - "B: 0o"
      - "C: 0q"
      - "D: 0c"
    answer: B
    explanation: "Go 1.13+新增0o前缀明确表示八进制。传统的0前缀(如017)仍然支持但不推荐。参见 Go 规范 Integer literals 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-010
    type: single
    difficulty: easy
    stem: "017(传统八进制)的十进制值是?"
    options:
      - "A: 17"
      - "B: 15"
      - "C: 7"
      - "D: 编译错误"
    answer: B
    explanation: "以0开头(非0x/0b/0o)是传统八进制表示。017(八进制) = 1×8 + 7 = 15(十进制)。参见 Go 规范 Integer literals 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-011
    type: single
    difficulty: easy
    stem: "const x int8 = 200是否合法?"
    options:
      - "A: 合法"
      - "B: 不合法,超出int8范围"
      - "C: 合法,会自动截断"
      - "D: 取决于运行时"
    answer: B
    explanation: "int8范围是-128到127。200超出范围,编译错误:constant 200 overflows int8。参见 Go 规范 Constants 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-012
    type: single
    difficulty: easy
    stem: "无类型常量可以用于哪些运算?"
    options:
      - "A: 只能加减"
      - "B: 只能与同类型运算"
      - "C: 任意算术运算"
      - "D: 不能运算"
    answer: C
    explanation: "无类型常量可以进行任意算术运算(+、-、*、/、%、位运算等),结果仍是无类型常量。参见 Go 规范 Constant expressions 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-013
    type: multiple
    difficulty: easy
    stem: "关于整数常量的除法,以下说法正确的是?(多选)"
    options:
      - "A: 整数除法向零截断"
      - "B: const x = 7/3结果是2"
      - "C: const x = -7/3结果是-2"
      - "D: 常量除法不能除以0"
    answer: ABCD
    explanation: "Go整数除法向零截断。7/3=2,-7/3=-2。常量除以0是编译错误(运行时除0是panic)。参见 Go 规范 Arithmetic operators 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-014
    type: single
    difficulty: easy
    stem: "const x = 5 % 3的结果是?"
    options:
      - "A: 1"
      - "B: 2"
      - "C: 1.67"
      - "D: 0"
    answer: B
    explanation: "%是取模运算符。5 % 3 = 2(5 = 1×3 + 2)。参见 Go 规范 Arithmetic operators 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-015
    type: single
    difficulty: easy
    stem: "const x = 1 << 3的结果是?"
    options:
      - "A: 3"
      - "B: 4"
      - "C: 8"
      - "D: 13"
    answer: C
    explanation: "<<是左移运算符。1 << 3 = 1 × 2³ = 8。左移n位等于乘以2的n次方。参见 Go 规范 Arithmetic operators 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-016
    type: single
    difficulty: easy
    stem: "const x = 8 >> 2的结果是?"
    options:
      - "A: 4"
      - "B: 2"
      - "C: 16"
      - "D: 6"
    answer: B
    explanation: ">>是右移运算符。8 >> 2 = 8 / 4 = 2。右移n位等于除以2的n次方。参见 Go 规范 Arithmetic operators 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-017
    type: single
    difficulty: easy
    stem: "const x = 5 & 3的结果是?"
    options:
      - "A: 8"
      - "B: 7"
      - "C: 1"
      - "D: 2"
    answer: C
    explanation: "&是按位与。5(101) & 3(011) = 1(001)。只有两个位都是1结果才是1。参见 Go 规范 Arithmetic operators 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-018
    type: single
    difficulty: easy
    stem: "const x = 5 | 3的结果是?"
    options:
      - "A: 8"
      - "B: 7"
      - "C: 1"
      - "D: 2"
    answer: B
    explanation: "|是按位或。5(101) | 3(011) = 7(111)。任一位是1结果就是1。参见 Go 规范 Arithmetic operators 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-019
    type: single
    difficulty: easy
    stem: "const x = 5 ^ 3的结果是?"
    options:
      - "A: 8"
      - "B: 6"
      - "C: 2"
      - "D: 15"
    answer: B
    explanation: "^是按位异或。5(101) ^ 3(011) = 6(110)。位相同为0,不同为1。参见 Go 规范 Arithmetic operators 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-020
    type: single
    difficulty: easy
    stem: "^x(一元^)在Go中表示什么?"
    options:
      - "A: x的平方"
      - "B: x的绝对值"
      - "C: x的按位取反"
      - "D: 编译错误"
    answer: C
    explanation: "一元^运算符是按位取反(bitwise NOT)。对于无符号数,^x = MaxValue - x。参见 Go 规范 Arithmetic operators 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-021
    type: single
    difficulty: easy
    stem: "Go中&^运算符的作用是?"
    options:
      - "A: 按位与非(bit clear)"
      - "B: 按位或非"
      - "C: 取地址并解引用"
      - "D: 编译错误"
    answer: A
    explanation: "&^是按位与非(AND NOT),也叫位清除。x &^ y清除x中y为1的位。参见 Go 规范 Arithmetic operators 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-022
    type: single
    difficulty: easy
    stem: "const x = 6 &^ 2的结果是?"
    options:
      - "A: 4"
      - "B: 8"
      - "C: 2"
      - "D: 0"
    answer: A
    explanation: "&^清除指定位。6(110) &^ 2(010) = 4(100)。清除6中第2位(2的位置)。参见 Go 规范 Arithmetic operators 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-023
    type: multiple
    difficulty: easy
    stem: "关于iota常量生成器,以下说法正确的是?(多选)"
    options:
      - "A: iota在const块中从0开始"
      - "B: 每行递增1"
      - "C: 新const块重置为0"
      - "D: 可以用于表达式"
    answer: ABCD
    explanation: "iota是编译期常量生成器,在const块中从0开始逐行递增,可以参与表达式运算。参见 Go 规范 Iota 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-024
    type: single
    difficulty: easy
    stem: "以下const块中b的值是多少?"
    code: |
      const (
          a = iota
          b
          c
      )
    options:
      - "A: 0"
      - "B: 1"
      - "C: 2"
      - "D: 未定义"
    answer: B
    explanation: "iota从0开始逐行递增。a=0,b=1(隐式重复上一行表达式iota),c=2。参见 Go 规范 Iota 章节。"
    topic: constants
    chapter: integer

  # ========== 中等题 (Medium) - 12道 ==========

  - id: const-integer-025
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          const x = 1 << 62
          var y int64 = x
          fmt.Println(y > 0)
      }
    options:
      - "A: true"
      - "B: false"
      - "C: 编译错误"
      - "D: 运行时panic"
    answer: A
    explanation: "1<<62在int64范围内(最大2^63-1)。值是正数,y > 0为true。参见 Go 规范 Constants 章节。"
    topic: constants
    chapter: integer

  - id: const-integer-026
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          const x = 1 << 63
          var y uint64 = x
