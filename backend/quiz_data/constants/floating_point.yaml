questions:
  # ========== 简单题 (Easy) - 23道 ==========
  
  - id: const-float-001
    type: single
    difficulty: easy
    stem: "Go语言中const x = 3.14声明的x是什么类型?"
    options:
      - "A: float32"
      - "B: float64"
      - "C: 无类型浮点常量"
      - "D: double"
    answer: C
    explanation: "没有显式类型的常量是无类型常量。const x = 3.14是无类型浮点常量,使用时根据上下文确定类型。参见 Go 规范 Constants 章节。"
    topic: constants
    chapter: floating_point

  - id: const-float-002
    type: multiple
    difficulty: easy
    stem: "关于无类型浮点常量,以下说法正确的是?(多选)"
    options:
      - "A: 默认类型是float64"
      - "B: 可以赋值给float32"
      - "C: Go有double类型"
      - "D: 使用时根据上下文确定类型"
    answer: ABD
    explanation: "无类型浮点常量在需要具体类型时默认为float64。也可以显式赋值给float32。Go没有double类型。使用时根据上下文确定类型。参见 Go 规范 Constants 章节。"
    topic: constants
    chapter: floating_point

  - id: const-float-003
    type: single
    difficulty: easy
    stem: "以下哪个是科学计数法表示的浮点字面量?"
    options:
      - "A: 3.14"
      - "B: 1e10"
      - "C: 0.001"
      - "D: 1000.0"
    answer: B
    explanation: "1e10是科学计数法,表示1×10^10。e或E表示10的指数。参见 Go 规范 Floating-point literals 章节。"
    topic: constants
    chapter: floating_point

  - id: const-float-004
    type: single
    difficulty: easy
    stem: "1.5e-3表示的值是多少?"
    options:
      - "A: 1500"
      - "B: 0.0015"
      - "C: -4.5"
      - "D: 1.5003"
    answer: B
    explanation: "1.5e-3 = 1.5 × 10^(-3) = 0.0015。e后的负数表示小数点左移。参见 Go 规范 Floating-point literals 章节。"
    topic: constants
    chapter: floating_point

  - id: const-float-005
    type: multiple
    difficulty: easy
    stem: "关于Go语言的浮点类型,以下哪些是正确的?(多选)"
    options:
      - "A: 有float32类型"
      - "B: 有float64类型"
      - "C: 有float类型"
      - "D: 有double类型"
    answer: AB
    explanation: "Go只有float32(32位)和float64(64位)两种浮点类型。没有float、double等类型名。参见 Go 规范 Numeric types 章节。"
    topic: constants
    chapter: floating_point

  - id: const-float-006
    type: multiple
    difficulty: easy
    stem: "以下哪些是有效的浮点字面量?(多选)"
    options:
      - "A: 3.14"
      - "B: .5"
      - "C: 2."
      - "D: 1_000.000_1"
    answer: ABCD
    explanation: "Go支持多种浮点格式:.5(0.5)、2.(2.0)、下划线分隔(Go 1.13+)等都是有效的。参见 Go 规范 Floating-point literals 章节。"
    topic: constants
    chapter: floating_point

  - id: const-float-007
    type: multiple
    difficulty: easy
    stem: "关于float32的精度,以下哪些说法是正确的?(多选)"
    options:
      - "A: 约7位十进制精度"
      - "B: 32位IEEE 754浮点"
      - "C: 23位尾数"
      - "D: 约15位十进制精度"
    answer: ABC
    explanation: "float32是32位IEEE 754浮点,23位尾数提供约7位十进制精度。float64约15位精度。参见IEEE 754标准。"
    topic: constants
    chapter: floating_point

  - id: const-float-008
    type: single
    difficulty: medium
    stem: "float64的精度大约是多少位有效数字?"
    options:
      - "A: 7位"
      - "B: 10位"
      - "C: 15位"
      - "D: 20位"
    answer: C
    explanation: "float64是64位IEEE 754浮点,52位尾数提供约15-16位十进制精度。参见IEEE 754标准。"
    topic: constants
    chapter: floating_point

  - id: const-float-009
    type: multiple
    difficulty: medium
    stem: "关于Go中无类型浮点常量的精度,以下哪些说法是正确的?(多选)"
    options:
      - "A: 无类型常量有任意精度"
      - "B: 常量表达式精确计算"
      - "C: 赋值给变量时可能有精度损失"
      - "D: 0.1 + 0.2 精确等于0.3"
    answer: ABCD
    explanation: "无类型常量有任意精度,常量表达式精确计算。只有赋值给变量时才可能有精度损失。所以在常量表达式中0.1 + 0.2精确等于0.3。参见 Go 规范 Constants 章节。"
    topic: constants
    chapter: floating_point

  - id: const-float-010
    type: multiple
    difficulty: medium
    stem: "关于Go浮点数的零值,以下哪些说法是正确的?(多选)"
    options:
      - "A: float32的零值是0.0"
      - "B: float64的零值是0.0"
      - "C: 是正零"
      - "D: 是nil"
    answer: ABC
    explanation: "float32和float64的零值都是0.0(正零)。Go所有数值类型零值都是0。不是nil(nil只能用于指针、切片、映射、通道、函数和接口)。参见 Go 规范 The zero value 章节。"
    topic: constants
    chapter: floating_point

  - id: const-float-011
    type: multiple
    difficulty: medium
    stem: "关于Go的十六进制浮点格式,以下哪些说法是正确的?(多选)"
    options:
      - "A: 使用0x前缀"
      - "B: 必须有p指数"
      - "C: 0x1.0p10表示1024.0"
      - "D: Go 1.13+支持"
    answer: ABCD
    explanation: "Go 1.13+支持0x前缀的十六进制浮点,如0x1.0p10。必须有p或P指数部分,0x1.0p10 = 1.0×2^10 = 1024.0。参见 Go 规范 Floating-point literals 章节。"
    topic: constants
    chapter: floating_point

  - id: const-float-012
    type: single
    difficulty: medium
    stem: "十六进制浮点0x1.0p10表示什么值?"
    options:
      - "A: 1.0"
      - "B: 10.0"
      - "C: 1024.0"
      - "D: 16.0"
    answer: C
    explanation: "0x1.0p10 = 1.0 × 2^10 = 1024。p后是2的指数(不是10的指数)。参见 Go 规范 Floating-point literals 章节。"
    topic: constants
    chapter: floating_point

  - id: const-float-013
    type: single
    difficulty: easy
    stem: "math.Inf(1)返回什么?"
    options:
      - "A: 正无穷大"
      - "B: 负无穷大"
      - "C: NaN"
      - "D: 1"
    answer: A
    explanation: "math.Inf(1)返回正无穷大(+Inf),math.Inf(-1)返回负无穷大(-Inf)。参见 Go math包文档。"
    topic: constants
    chapter: floating_point

  - id: const-float-014
    type: single
    difficulty: easy
    stem: "math.NaN()返回什么?"
    options:
      - "A: 0"
      - "B: 正无穷"
      - "C: 非数字(Not a Number)"
      - "D: nil"
    answer: C
    explanation: "NaN(Not a Number)表示未定义的数学运算结果,如0/0、Inf-Inf等。参见 Go math包文档。"
    topic: constants
    chapter: floating_point

  - id: const-float-015
    type: single
    difficulty: hard
    stem: "NaN与任何值(包括自身)比较的结果是?"
    options:
      - "A: 总是true"
      - "B: 总是false"
      - "C: 与自身相等"
      - "D: panic"
    answer: B
    explanation: "NaN的特性是与任何值比较(包括NaN==NaN)都返回false。这是IEEE 754标准定义的行为。参见IEEE 754标准。"
    topic: constants
    chapter: floating_point

  - id: const-float-016
    type: multiple
    difficulty: easy
    stem: "以下哪些运算可能产生NaN?(多选)"
    options:
      - "A: 0.0 / 0.0"
      - "B: math.Sqrt(-1)"
      - "C: math.Log(-1)"
      - "D: 1.0 / 0.0"
    answer: ABC
    explanation: "0/0、负数开方、负数对数等无意义运算产生NaN。1.0/0.0产生Inf(无穷大)不是NaN。参见IEEE 754标准。"
    topic: constants
    chapter: floating_point

  - id: const-float-017
    type: single
    difficulty: easy
    stem: "1.0/0.0的结果是什么?"
    options:
      - "A: panic"
      - "B: NaN"
      - "C: +Inf"
      - "D: 编译错误"
    answer: C
    explanation: "浮点除以0不会panic,结果是正或负无穷大(取决于被除数符号)。1.0/0.0 = +Inf。参见IEEE 754标准。"
    topic: constants
    chapter: floating_point

  - id: const-float-018
    type: single
    difficulty: easy
    stem: "如何判断一个float64值是否为NaN?"
    options:
      - "A: x == math.NaN()"
      - "B: math.IsNaN(x)"
      - "C: x != x"
      - "D: B和C都可以"
    answer: D
    explanation: "NaN的特性是x!=x为true(只有NaN满足)。math.IsNaN()是标准方法。x==NaN()总是false。参见 Go math包文档。"
    topic: constants
    chapter: floating_point

  - id: const-float-019
    type: single
    difficulty: easy
    stem: "const x float32 = 3.14正确吗?"
    options:
      - "A: 正确"
      - "B: 错误,常量不能有类型"
      - "C: 错误,需要写成3.14f"
      - "D: 错误,float32精度不够"
    answer: A
    explanation: "Go常量可以有显式类型。const x float32 = 3.14声明float32类型常量。Go不需要f后缀。参见 Go 规范 Constant declarations 章节。"
    topic: constants
    chapter: floating_point

  - id: const-float-020
    type: single
    difficulty: easy
    stem: "浮点字面量e可以是大写E吗?"
    options:
      - "A: 不可以,必须小写"
      - "B: 可以,e和E等价"
      - "C: 大写E表示不同含义"
      - "D: 取决于编译器"
    answer: B
    explanation: "科学计数法中e和E等价,都表示10的指数。1e10和1E10相同。参见 Go 规范 Floating-point literals 章节。"
    topic: constants
    chapter: floating_point

  - id: const-float-021
    type: single
    difficulty: easy
    stem: "以下哪个表达式是false?"
    options:
      - "A: math.Inf(1) > 0"
      - "B: math.Inf(-1) < 0"
      - "C: math.Inf(1) == math.Inf(1)"
      - "D: math.NaN() == math.NaN()"
    answer: D
    explanation: "Inf可以比较和判等。但NaN的任何比较(包括与自身)都返回false。参见IEEE 754标准。"
    topic: constants
    chapter: floating_point

  - id: const-float-022
    type: single
    difficulty: easy
    stem: "Go中如何表示浮点数的最大值?"
    options:
      - "A: float64.Max"
      - "B: math.MaxFloat64"
      - "C: Float64Max"
      - "D: MAX_FLOAT64"
    answer: B
    explanation: "math包定义了MaxFloat64、MaxFloat32等常量表示浮点类型的最大值。参见 Go math包文档。"
    topic: constants
    chapter: floating_point

  - id: const-float-023
    type: multiple
    difficulty: easy
    stem: "关于浮点数的特殊值,以下说法正确的是?(多选)"
    options:
      - "A: 有正零和负零"
      - "B: 0.0 == -0.0为true"
      - "C: 1/+0.0和1/-0.0结果不同"
      - "D: 正负零的位表示不同"
    answer: ABCD
    explanation: "IEEE 754浮点有正零和负零,比较相等但位表示不同。1/+0=+Inf,1/-0=-Inf。参见IEEE 754标准。"
    topic: constants
    chapter: floating_point

  # ========== 中等题 (Medium) - 12道 ==========

  - id: const-float-024
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          const x = 0.1 + 0.2
          fmt.Println(x == 0.3)
      }
    options:
      - "A: true"
      - "B: false"
      - "C: 编译错误"
      - "D: 取决于平台"
    answer: A
    explanation: "常量表达式精确计算,0.1+0.2精确等于0.3。只有变量运算才有浮点精度问题。参见 Go 规范 Constant expressions 章节。"
    topic: constants
    chapter: floating_point

  - id: const-float-025
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var x float64 = 0.1 + 0.2
          fmt.Println(x == 0.3)
      }
    options:
      - "A: true"
      - "B: false"
      - "C: 编译错误"
      - "D: 取决于平台"
    answer: B
    explanation: "变量运算使用float64精度。0.1和0.2在二进制中无法精确表示,相加结果略大于0.3。参见IEEE 754浮点表示。"
    topic: constants
    chapter: floating_point

  - id: const-float-026
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          const x = 1e308 * 2
          var y float64 = x
          fmt.Println(y)
      }
    options:
      - "A: 2e308"
      - "B: +Inf"
      - "C: 编译错误"
      - "D: NaN"
    answer: B
    explanation: "常量1e308*2超出float64范围(约1.8e308),赋值给float64时变为+Inf。参见 Go 规范 Constants 章节。"
    topic: constants
    chapter: floating_point

  - id: const-float-027
    type: code_fix
    difficulty: medium
    stem: "以下代码有精度问题,正确的修正方案是?"
    code: |
      package main
      import "fmt"
      func main() {
          var total float64
          for i := 0; i < 10; i++ {
              total += 0.1
          }
          fmt.Println(total == 1.0)
      }
    options:
      - "A: 使用math.Abs(total-1.0) < 1e-9比较"
      - "B: 使用整数计算后转换"
      - "C: 使用decimal库"
      - "D: 以上都是可行方案"
    answer: D
    explanation: "浮点累加有精度损失。可用epsilon比较、整数运算、或精确decimal库。参见浮点数最佳实践。"
    topic: constants
    chapter: floating_point

  - id: const-float-028
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import (
          "fmt"
          "math"
      )
      func main() {
          x := math.NaN()
          fmt.Println(x < 0, x > 0, x == 0, x == x)
      }
    options:
      - "A: false false false false"
      - "B: false false false true"
      - "C: true true true true"
      - "D: panic"
    answer: A
    explanation: "NaN的所有比较都返回false,包括与自身比较。这是IEEE 754标准定义的行为。参见IEEE 754标准。"
    topic: constants
    chapter: floating_point

  - id: const-float-029
    type: multiple
    difficulty: medium
    stem: "关于浮点常量溢出,以下说法正确的是?(多选)"
    options:
      - "A: 常量可以表示任意大的值"
      - "B: 赋值时检查目标类型范围"
      - "C: 超范围赋值是编译错误"
      - "D: 运行时溢出变为Inf"
    answer: ABCD
    explanation: "无类型常量精度无限。赋值时编译器检查范围,超范围编译错误。运行时计算溢出变Inf。参见 Go 规范 Constants 章节。"
    topic: constants
    chapter: floating_point

  - id: const-float-030
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          const x = 1.0000000000000002
          var y float64 = x
          fmt.Println(y == 1.0)
      }
    options:
      - "A: true"
      - "B: false"
      - "C: 编译错误"
      - "D: 取决于平台"
    answer: B
    explanation: "1.0000000000000002与1.0在float64精度内可区分(差异在15位有效数字内)。y不等于1.0。参见IEEE 754精度。"
    topic: constants
    chapter: floating_point

  - id: const-float-031
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          const x = 1.00000000000000001
          var y float64 = x
          fmt.Println(y == 1.0)
      }
    options:
      - "A: true"
      - "B: false"
      - "C: 编译错误"
      - "D: 取决于平台"
    answer: A
    explanation: "差异在第17位小数,超出float64精度(约15位)。赋值时精度截断,y等于1.0。参见IEEE 754精度。"
    topic: constants
    chapter: floating_point

  - id: const-float-032
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import (
          "fmt"
          "math"
      )
      func main() {
          x := math.Inf(1)
          y := math.Inf(1)
          fmt.Println(x - y)
      }
    options:
      - "A: 0"
      - "B: +Inf"
      - "C: NaN"
      - "D: -Inf"
    answer: C
    explanation: "Inf - Inf是不确定形式,结果是NaN。类似地Inf/Inf、0*Inf也是NaN。参见IEEE 754标准。"
    topic: constants
    chapter: floating_point

  - id: const-float-033
    type: code_fix
    difficulty: medium
    stem: "以下代码有错误,正确的修正方案是?"
    code: |
      package main
      import "fmt"
      func main() {
          const x = 0x1.8p3
          fmt.Println(x)
      }
    options:
      - "A: 需要Go 1.13+"
      - "B: 代码正确,输出12"
      - "C: 改为0x18p3"
      - "D: 十六进制浮点必须有小数点"
    answer: B
    explanation: "代码正确。0x1.8p3 = 1.5(十六进制1.8=1+8/16=1.5) × 2³ = 12。Go 1.13+支持。参见 Go 规范 Floating-point literals 章节。"
    topic: constants
    chapter: floating_point

  - id: const-float-034
    type: multiple
    difficulty: medium
    stem: "关于浮点比较的最佳实践,以下说法正确的是?(多选)"
    options:
      - "A: 避免直接用==比较"
      - "B: 使用epsilon范围比较"
      - "C: 考虑相对误差而非绝对误差"
      - "D: 对于金融计算使用整数或decimal"
    answer: ABCD
    explanation: "浮点直接比较不可靠,应用epsilon容差。大数值应考虑相对误差。金融用整数分或decimal。参见浮点数最佳实践。"
    topic: constants
    chapter: floating_point

  - id: const-float-035
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var x float32 = 16777216
          var y float32 = 16777217
          fmt.Println(x == y)
      }
    options:
      - "A: true"
      - "B: false"
      - "C: 编译错误"
      - "D: panic"
