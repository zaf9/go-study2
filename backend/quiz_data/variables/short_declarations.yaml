    topic: variables
    chapter: short_declarations

  - id: var-short-030
    type: multiple
    difficulty: medium
    stem: "关于if简单语句中的短声明,以下说法正确的是?(多选)"
    options:
      - "A: 变量作用域包含if块"
      - "B: 变量作用域包含else块"
      - "C: 变量在if外不可见"
