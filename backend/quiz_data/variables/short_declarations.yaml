    code: |
      package main
      import "fmt"
      func f() (x int) {
          defer func() {
              x := 10
              _ = x
          }()
          return 5
      }
      func main() {
          fmt.Println(f())
      }
    options:
      - "A: 10"
      - "B: 5"
      - "C: 0"
      - "D: 15"
