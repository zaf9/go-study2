    topic: variables
    chapter: short_declarations

  - id: var-short-031
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func f() (int, int) { return 1, 2 }
      func main() {
          x, y := f()
          y, z := f()
          fmt.Println(x, y, z)
