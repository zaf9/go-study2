  # ========== 困难题 (Hard) - 4道 ==========

  - id: var-short-035
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var x *int
          if x := new(int); x != nil {
              *x = 10
          }
          fmt.Println(x)
      }
    options:
      - "A: 10"
      - "B: <nil>"
      - "C: &10"
      - "D: panic"
    answer: B
    explanation: "if中x:=new(int)是新变量,遮蔽外层x。外层var x *int仍是nil。输出<nil>。参见 Go 规范 Short variable declarations 章节。"
    topic: variables
    chapter: short_declarations

  - id: var-short-036
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          x := 0
          for i := 0; i < 3; i++ {
              x, y := 1, 2
              x += y
              _ = y
          }
          fmt.Println(x)
      }
    options:
      - "A: 0"
      - "B: 3"
      - "C: 9"
      - "D: 6"
    answer: A
    explanation: "每次迭代x,y:=1,2声明新的x(遮蔽外层)。外层x始终是0不变。参见 Go 规范 Short variable declarations 章节。"
    topic: variables
