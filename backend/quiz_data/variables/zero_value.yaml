    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var s1 []int
          var s2 = []int{}
          var s3 = make([]int, 0)
          fmt.Printf("%p %p %p\n", s1, s2, s3)
      }
    options:
      - "A: 三个相同地址"
