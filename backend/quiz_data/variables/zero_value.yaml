  # ========== 简单题 (Easy) - 23道 ==========
  
  - id: var-zero-001
    type: single
    difficulty: easy
    stem: "Go语言的零值是什么概念?"
    options:
      - "A: 值等于0"
      - "B: 变量默认初始化值"
      - "C: 空指针"
      - "D: 未定义值"
    answer: B
    explanation: "零值是变量声明但未初始化时的默认值。每种类型都有确定的零值,不是未定义。参见 Go 规范 The zero value 章节。"
    topic: variables
    chapter: zero_value

