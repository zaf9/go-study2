  # ========== 困难题 (Hard) - 4道 ==========

  - id: var-zero-035
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type I interface{ M() }
      type T struct{}
      func (T) M() {}
      func main() {
          var t *T
          var i I = t
          fmt.Println(t == nil, i == nil)
      }
    options:
      - "A: true true"
      - "B: true false"
      - "C: false false"
      - "D: false true"
    answer: B
    explanation: "t是nil指针(true)。i包含nil指针但类型不是nil,所以i!=nil(false)。接口nil判断需要类型和值都是nil。参见 Go 规范 Interface types 章节。"
    topic: variables
    chapter: zero_value

  - id: var-zero-036
