  # ========== 中等题 (Medium) - 10道 ==========

  - id: var-blank-022
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func f() (int, int, int) { return 1, 2, 3 }
      func main() {
          a, _, b := f()
          fmt.Println(a, b)
      }
    options:
      - "A: 1 2"
      - "B: 1 3"
      - "C: 2 3"
      - "D: 编译错误"
    answer: B
    explanation: "_忽略第二个返回值2。a=1,b=3。输出1 3。参见 Go 规范 Blank identifier 章节。"
    topic: variables
    chapter: blank_identifier

