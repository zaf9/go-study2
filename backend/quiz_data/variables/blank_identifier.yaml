    chapter: blank_identifier

  - id: var-blank-035
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type T struct{ x int }
      func (t T) Get() int { return t.x }
      var _ interface{ Get() int } = (*T)(nil)
      func main() {
          var t *T
          if t == nil {
              fmt.Println(t.Get())
          }
      }
