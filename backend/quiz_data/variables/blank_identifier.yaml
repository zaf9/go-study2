  # ========== 困难题 (Hard) - 4道 ==========

  - id: var-blank-032
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      type Counter int
      func (c Counter) String() string { return fmt.Sprintf("%d", c) }
      var _ fmt.Stringer = Counter(0)
      func main() {
          c := Counter(42)
          fmt.Println(c)
      }
    options:
      - "A: 42"
      - "B: Counter(42)"
      - "C: 编译错误"
      - "D: {42}"
    answer: A
    explanation: "Counter实现fmt.Stringer(有String方法)。var _检查通过。Println调用String()输出42。参见 Go fmt包文档。"
    topic: variables
    chapter: blank_identifier

  - id: var-blank-033
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          funcs := make([]func(), 3)
          for i := 0; i < 3; i++ {
              _ = i
              funcs[i] = func() { fmt.Print(i) }
          }
          for _, f := range funcs {
              f()
          }
      }
    options:
      - "A: 012"
      - "B: 333"
      - "C: 222"
      - "D: 编译错误"
    answer: B
    explanation: "_ = i不创建新变量。闭包捕获循环变量i,循环结束后i=3。Go1.22前输出333。参见 Go 规范 For statements 章节。"
    topic: variables
    chapter: blank_identifier

