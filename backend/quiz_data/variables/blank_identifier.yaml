  # ========== 简单题 (Easy) - 21道 ==========
  
  - id: var-blank-001
    type: single
    difficulty: easy
    stem: "Go语言的空白标识符是什么?"
    options:
      - "A: null"
      - "B: _"
      - "C: void"
      - "D: nil"
    answer: B
    explanation: "下划线_是Go的空白标识符,用于忽略值。null、void不是Go关键字,nil是空值。参见 Go 规范 Blank identifier 章节。"
    topic: variables
    chapter: blank_identifier

  - id: var-blank-002
    type: single
    difficulty: easy
    stem: "空白标识符的主要用途是什么?"
    options:
      - "A: 声明空变量"
      - "B: 忽略不需要的值"
      - "C: 创建占位符"
      - "D: 定义空函数"
    answer: B
    explanation: "空白标识符用于忽略不需要使用的值,如函数返回值。它不存储任何值。参见 Go 规范 Blank identifier 章节。"
    topic: variables
    chapter: blank_identifier

  - id: var-blank-003
    type: single
    difficulty: easy
    stem: "_, err := f()中_代表什么?"
    options:
      - "A: nil值"
      - "B: 默认值"
      - "C: 忽略的返回值"
      - "D: 错误值"
    answer: C
    explanation: "_表示忽略f()的第一个返回值,只使用err。常见于忽略不需要的返回值。参见 Go 规范 Blank identifier 章节。"
    topic: variables
    chapter: blank_identifier

  - id: var-blank-004
    type: single
    difficulty: easy
    stem: "for _, v := range slice中_的作用是?"
    options:
      - "A: 表示切片长度"
      - "B: 忽略索引"
      - "C: 表示空元素"
      - "D: 占位第一个元素"
    answer: B
    explanation: "range返回索引和值,_忽略索引,只使用值v。常见写法避免声明不使用的变量。参见 Go 规范 For statements 章节。"
    topic: variables
    chapter: blank_identifier

  - id: var-blank-005
    type: single
    difficulty: easy
    stem: "可以读取_的值吗?"
    options:
      - "A: 可以"
      - "B: 不可以"
      - "C: 有时可以"
      - "D: 取决于类型"
    answer: B
    explanation: "空白标识符只能用于赋值左侧,不能读取其值。赋给_的值被丢弃。参见 Go 规范 Blank identifier 章节。"
    topic: variables
    chapter: blank_identifier

  - id: var-blank-006
    type: single
    difficulty: easy
    stem: "import _ \"pkg\"的作用是什么?"
    options:
      - "A: 不导入任何包"
      - "B: 只执行包的init函数"
      - "C: 导入但标记为废弃"
      - "D: 导入私有成员"
    answer: B
    explanation: "空白导入只执行包的init函数和包级变量初始化,不使用包内导出的标识符。参见 Go 规范 Import declarations 章节。"
    topic: variables
    chapter: blank_identifier

  - id: var-blank-007
    type: single
    difficulty: easy
    stem: "var _ = initDB()的用途是什么?"
    options:
      - "A: 声明空变量"
      - "B: 执行副作用,忽略返回值"
      - "C: 检查类型"
      - "D: 创建常量"
    answer: B
    explanation: "包级var _ = f()用于执行f()的副作用(如初始化),同时忽略返回值。参见 Go 规范 Blank identifier 章节。"
    topic: variables
    chapter: blank_identifier

  - id: var-blank-008
    type: single
    difficulty: easy
    stem: "var _ Interface = (*Type)(nil)的用途是什么?"
    options:
      - "A: 声明nil指针"
      - "B: 编译时接口实现检查"
      - "C: 创建接口变量"
      - "D: 类型转换"
    answer: B
    explanation: "这是编译时检查Type是否实现Interface的惯用法。如果不实现会编译错误。参见 Go 官方接口检查模式。"
    topic: variables
    chapter: blank_identifier

  - id: var-blank-009
    type: multiple
    difficulty: easy
    stem: "以下哪些是_的合法用法?(多选)"
    options:
      - "A: _, err := f()"
      - "B: for _, v := range s"
      - "C: import _ \"pkg\""
      - "D: x = _"
    answer: ABC
    explanation: "ABC都是合法用法。D不合法,不能读取_的值。_只能用于接收值,不能作为值使用。参见 Go 规范 Blank identifier 章节。"
    topic: variables
    chapter: blank_identifier

  - id: var-blank-010
    type: single
    difficulty: easy
    stem: "_可以用作变量名吗?"
    options:
      - "A: 是普通变量名"
      - "B: 是特殊标识符"
      - "C: 是关键字"
      - "D: 是保留字"
    answer: B
    explanation: "_是特殊的空白标识符,不是普通变量名,也不是关键字。它有特殊语义:值被丢弃。参见 Go 规范 Blank identifier 章节。"
    topic: variables
    chapter: blank_identifier

  - id: var-blank-011
    type: single
    difficulty: easy
    stem: "同一语句中可以多次使用_吗?"
    options:
      - "A: 不可以"
      - "B: 可以"
      - "C: 最多两次"
      - "D: 取决于上下文"
    answer: B
    explanation: "_可以多次使用。如a, _, _, d := f()忽略第2和第3个返回值。参见 Go 规范 Blank identifier 章节。"
    topic: variables
    chapter: blank_identifier

  - id: var-blank-012
    type: single
    difficulty: easy
    stem: "switch x := v.(type)中如果不需要x怎么办?"
    options:
      - "A: 删除x"
      - "B: 使用_"
      - "C: 只能使用x"
      - "D: 使用void"
    answer: B
    explanation: "可以用switch _ := v.(type)或直接switch v.(type)来忽略值。参见 Go 规范 Switch statements 章节。"
    topic: variables
    chapter: blank_identifier

  - id: var-blank-013
    type: single
    difficulty: easy
    stem: "for i, _ := range s和for i := range s等价吗?"
    options:
      - "A: 完全等价"
      - "B: 不等价"
      - "C: 取决于s类型"
      - "D: 语法错误"
    answer: A
    explanation: "两者等价。for i := range s只获取索引。for i, _ := range s显式忽略值,效果相同。参见 Go 规范 For statements 章节。"
    topic: variables
    chapter: blank_identifier

  - id: var-blank-014
    type: single
    difficulty: easy
    stem: "为什么需要空白标识符?"
    options:
      - "A: 节省内存"
      - "B: 避免声明未使用的变量"
      - "C: 提高性能"
      - "D: 类型检查"
    answer: B
    explanation: "Go不允许未使用的局部变量。_让我们能接收但不使用某些值,避免编译错误。参见 Go 规范 Blank identifier 章节。"
    topic: variables
    chapter: blank_identifier

  - id: var-blank-015
    type: single
    difficulty: easy
    stem: "_, ok := m[key]中ok的类型是什么?"
    options:
      - "A: int"
      - "B: bool"
      - "C: error"
      - "D: interface{}"
    answer: B
    explanation: "map的逗号ok惯用法中ok是bool。true表示key存在,false表示不存在。参见 Go 规范 Index expressions 章节。"
    topic: variables
    chapter: blank_identifier

  - id: var-blank-016
    type: single
    difficulty: easy
    stem: "_, ok := x.(T)中_忽略的是什么?"
    options:
      - "A: 错误值"
      - "B: 类型断言的值"
      - "C: nil"
      - "D: 原始值"
    answer: B
    explanation: "类型断言返回转换后的值和bool。_忽略转换后的值,只检查断言是否成功。参见 Go 规范 Type assertions 章节。"
    topic: variables
    chapter: blank_identifier

  - id: var-blank-017
    type: single
    difficulty: easy
    stem: "在函数参数中可以使用_吗?"
    options:
      - "A: 不可以"
      - "B: 可以,表示不使用该参数"
      - "C: 只能在接口中"
      - "D: 只能在方法中"
    answer: B
    explanation: "函数参数可以用_命名,表示不使用该参数。如func f(_ int, b string)。参见 Go 规范 Function declarations 章节。"
