  - id: var-blank-027
    type: code_fix
    difficulty: medium
    stem: "以下代码不符合预期,正确的修正方案是?"
    code: |
      package main
      import "fmt"
      func main() {
          ch := make(chan int, 1)
          ch <- 1
          _ = <-ch
          fmt.Println(<-ch)
      }
    options:
      - "A: 删除_ = <-ch"
      - "B: 将_ = <-ch改为x := <-ch"
      - "C: 代码正确"
      - "D: 增加ch <- 2"
    answer: A
    explanation: "_ = <-ch消费了通道中唯一的值。第二次<-ch会阻塞(死锁)。应该只读取一次或发送两次。参见 Go 规范 Channel types 章节。"
    topic: variables
    chapter: blank_identifier

