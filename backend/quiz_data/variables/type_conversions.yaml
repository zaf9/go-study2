  # ========== 困难题 (Hard) - 4道 ==========

  - id: var-conv-035
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var x uint = 1
          var y int = -1
          fmt.Println(x + uint(y))
      }
    options:
      - "A: 0"
      - "B: 2"
      - "C: 溢出错误"
      - "D: 18446744073709551616(假设64位)"
    answer: A
    explanation: "-1转uint是全1(最大uint),加1溢出回0。在64位系统:1+0xFFFFFFFFFFFFFFFF=0。参见 Go 规范 Integer overflow 章节。"
    topic: variables
    chapter: type_conversions

  - id: var-conv-036
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import (
          "fmt"
          "unsafe"
      )
      func main() {
          var f float64 = 1.5
          p := *(*int64)(unsafe.Pointer(&f))
          fmt.Printf("%016x\n", p)
      }
    options:
      - "A: 0000000000000001"
      - "B: 3ff8000000000000"
      - "C: 编译错误"
      - "D: 运行时panic"
    answer: B
    explanation: "1.5的IEEE 754表示是0x3FF8000000000000。unsafe.Pointer让我们看到底层位模式。参见 IEEE 754 浮点表示。"
    topic: variables
    chapter: type_conversions

  - id: var-conv-037
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          const x = 1 << 100
          fmt.Println(float64(x))
      }
    options:
      - "A: 编译错误:overflow"
      - "B: +Inf"
      - "C: 1.2676506002282294e+30"
      - "D: 0"
    answer: C
    explanation: "无类型常量可以是任意精度。1<<100转float64不溢出(float64最大约1.8e308)。输出约1.27e30。参见 Go 规范 Constants 章节。"
    topic: variables
    chapter: type_conversions

