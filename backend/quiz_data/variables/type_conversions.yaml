  - id: var-conv-019
    type: single
    difficulty: easy
    stem: "(*int)(nil)是什么操作?"
    options:
      - "A: 创建nil指针"
      - "B: 类型转换nil"
      - "C: 两者都是"
      - "D: 编译错误"
    answer: C
    explanation: "(*int)(nil)将无类型nil转换为*int类型的nil指针。是类型转换。参见 Go 规范 Conversions 章节。"
