  - id: var-conv-021
    type: multiple
    difficulty: easy
    stem: "关于类型转换,以下说法正确的是?(多选)"
    options:
      - "A: Go要求显式转换"
      - "B: 数值类型间可转换"
      - "C: string和[]byte可互转"
      - "D: 不同指针类型可直接转换"
    answer: ABC
    explanation: "Go要求显式转换。数值类型、string和[]byte/[]rune可互转。指针类型需要unsafe.Pointer中转。参见 Go 规范 Conversions 章节。"
    topic: variables
    chapter: type_conversions

  - id: var-conv-022
    type: single
    difficulty: easy
    stem: "int(1.0)和int(1)有什么区别?"
    options:
      - "A: 类型不同"
      - "B: 结果相同,都是int类型的1"
      - "C: 第一个编译错误"
      - "D: 精度不同"
    answer: B
    explanation: "1.0和1都是无类型常量,转换为int后都是1。结果完全相同。参见 Go 规范 Conversions 章节。"
    topic: variables
    chapter: type_conversions

  - id: var-conv-023
    type: single
    difficulty: easy
    stem: "类型断言x.(T)和类型转换T(x)的区别是什么?"
    options:
      - "A: 没有区别"
      - "B: 断言用于接口,转换用于具体类型"
      - "C: 断言更安全"
      - "D: 转换只用于数值"
    answer: B
    explanation: "类型断言x.(T)从接口获取具体类型。类型转换T(x)在兼容类型间转换。参见 Go 规范 Conversions 和 Type assertions 章节。"
    topic: variables
    chapter: type_conversions

  # ========== 中等题 (Medium) - 11道 ==========

  - id: var-conv-024
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var x int8 = 127
          x++
          fmt.Println(x)
      }
    options:
      - "A: 128"
      - "B: -128"
      - "C: 溢出错误"
      - "D: 0"
    answer: B
    explanation: "int8范围是-128到127。127+1溢出为-128(二进制补码)。Go不检测整数溢出。参见 Go 规范 Integer overflow 章节。"
    topic: variables
    chapter: type_conversions

  - id: var-conv-025
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          x := 256
          y := uint8(x)
          fmt.Println(y)
      }
    options:
      - "A: 256"
      - "B: 0"
      - "C: 255"
      - "D: 编译错误"
    answer: B
    explanation: "运行时转换会截断。256的低8位是0。uint8(256)=0。参见 Go 规范 Conversions 章节。"
    topic: variables
    chapter: type_conversions

  - id: var-conv-026
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          s := "hello世界"
          fmt.Println(len(s), len([]rune(s)))
      }
    options:
      - "A: 11 7"
      - "B: 7 7"
      - "C: 11 11"
      - "D: 7 11"
    answer: A
    explanation: "len(s)是字节数:5+3*2=11。len([]rune(s))是字符数:5+2=7。参见 Go 规范 Length and capacity 章节。"
    topic: variables
    chapter: type_conversions

