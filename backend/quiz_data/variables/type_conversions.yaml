  - id: var-conv-031
    type: code_output
    difficulty: medium
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var f float64 = 1.9999999999999998
          i := int(f)
          fmt.Println(i)
      }
    options:
      - "A: 1"
      - "B: 2"
      - "C: 1.9999999999999998"
      - "D: 取决于平台"
