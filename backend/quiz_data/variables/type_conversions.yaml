  # ========== 简单题 (Easy) - 23道 ==========
  
  - id: var-conv-001
    type: single
    difficulty: easy
    stem: "Go语言类型转换的语法是什么?"
    options:
      - "A: (Type)value"
      - "B: Type(value)"
      - "C: value as Type"
      - "D: cast(value, Type)"
    answer: B
    explanation: "Go使用Type(value)语法进行类型转换,如int(3.14)。不是C风格的(Type)value。参见 Go 规范 Conversions 章节。"
    topic: variables
    chapter: type_conversions

  - id: var-conv-002
    type: single
    difficulty: easy
    stem: "int(3.14)的结果是什么?"
    options:
      - "A: 3.14"
      - "B: 3"
      - "C: 4"
      - "D: 编译错误"
    answer: B
    explanation: "float到int转换会截断小数部分。3.14截断为3。不是四舍五入。参见 Go 规范 Conversions 章节。"
    topic: variables
    chapter: type_conversions

  - id: var-conv-003
    type: single
    difficulty: easy
    stem: "float64(10)的结果是什么?"
    options:
      - "A: 10"
      - "B: 10.0"
      - "C: 10.000000"
      - "D: 编译错误"
    answer: B
    explanation: "int到float64转换产生对应的浮点数10.0。精度取决于float64的表示。参见 Go 规范 Conversions 章节。"
    topic: variables
    chapter: type_conversions

  - id: var-conv-004
    type: single
    difficulty: easy
    stem: "string(65)的结果是什么?"
    options:
      - "A: \"65\""
      - "B: \"A\""
      - "C: 编译错误"
      - "D: \"6\""
    answer: B
    explanation: "整数转string产生对应Unicode码点的字符。65是'A'的码点。参见 Go 规范 Conversions 章节。"
    topic: variables
    chapter: type_conversions

  - id: var-conv-005
    type: single
    difficulty: easy
    stem: "[]byte(\"hello\")的结果类型是什么?"
    options:
      - "A: string"
      - "B: []byte"
      - "C: []rune"
      - "D: []int"
    answer: B
    explanation: "string转[]byte产生字节切片,每个字节对应UTF-8编码的一个字节。参见 Go 规范 Conversions 章节。"
    topic: variables
    chapter: type_conversions

  - id: var-conv-006
    type: single
    difficulty: easy
    stem: "string([]byte{104, 105})的结果是什么?"
    options:
      - "A: \"hi\""
      - "B: \"104105\""
      - "C: []byte"
      - "D: 编译错误"
    answer: A
    explanation: "[]byte转string产生对应字符串。104是'h',105是'i'的ASCII码。参见 Go 规范 Conversions 章节。"
    topic: variables
    chapter: type_conversions

  - id: var-conv-007
    type: single
    difficulty: easy
    stem: "Go的类型转换是隐式还是显式?"
    options:
      - "A: 隐式"
      - "B: 显式"
      - "C: 两者都有"
      - "D: 取决于类型"
    answer: B
    explanation: "Go要求显式类型转换,不支持隐式转换(除了赋值给接口)。必须写Type(value)。参见 Go 规范 Conversions 章节。"
    topic: variables
    chapter: type_conversions

  - id: var-conv-008
    type: single
    difficulty: easy
    stem: "var x int = 10; var y int64 = x 是否合法?"
    options:
      - "A: 合法"
      - "B: 不合法,需要转换"
      - "C: 取决于平台"
      - "D: 合法但有警告"
    answer: B
    explanation: "int和int64是不同类型,即使底层都是整数也需要显式转换:y = int64(x)。参见 Go 规范 Conversions 章节。"
    topic: variables
    chapter: type_conversions

  - id: var-conv-009
    type: multiple
    difficulty: easy
    stem: "以下哪些是合法的类型转换?(多选)"
    options:
      - "A: int(3.14)"
      - "B: string(65)"
      - "C: []byte(\"hello\")"
      - "D: int(\"10\")"
    answer: ABC
    explanation: "A,B,C都是合法转换。D不合法,string到int需要strconv.Atoi。参见 Go 规范 Conversions 章节。"
    topic: variables
    chapter: type_conversions

  - id: var-conv-010
    type: single
    difficulty: easy
    stem: "int(-3.7)的结果是什么?"
    options:
      - "A: -3"
      - "B: -4"
      - "C: 3"
      - "D: -3.7"
    answer: A
    explanation: "float到int转换向零截断。-3.7截断为-3(不是向下取整-4)。参见 Go 规范 Conversions 章节。"
    topic: variables
    chapter: type_conversions

