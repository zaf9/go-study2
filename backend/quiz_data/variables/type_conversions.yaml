    chapter: type_conversions

  - id: var-conv-014
    type: single
    difficulty: easy
    stem: "byte和uint8是什么关系?"
    options:
      - "A: 完全不同"
      - "B: byte是uint8的别名"
      - "C: uint8是byte的别名"
      - "D: 可以隐式转换"
