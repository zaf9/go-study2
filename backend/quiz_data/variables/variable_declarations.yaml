  - id: var-decl-039
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var a []int
          var b = []int{}
          var c = make([]int, 0)
          fmt.Println(a == nil, b == nil, c == nil)
      }
    options:
      - "A: true true true"
      - "B: true false false"
      - "C: false false false"
      - "D: true false true"
    answer: B
    explanation: "var a []int是nil切片。[]int{}和make([]int,0)是非nil空切片(有底层数组)。参见 Go 规范 Making slices 章节。"
    topic: variables
    chapter: variable_declarations

  - id: var-decl-040
    type: code_output
    difficulty: hard
    stem: "以下代码的输出结果是什么?"
    code: |
      package main
      import "fmt"
      func main() {
          var f func()
          var c chan int
          var i interface{}
          fmt.Println(f == nil, c == nil, i == nil)
      }
    options:
      - "A: true true true"
      - "B: true true false"
      - "C: false false false"
      - "D: true false true"
    answer: A
    explanation: "func、chan、interface的零值都是nil。var声明不初始化时都是nil。参见 Go 规范 The zero value 章节。"
    topic: variables
    chapter: variable_declarations
